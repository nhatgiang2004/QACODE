  moModal(`<h3>Mã QR gọi món · ${esc(tenCN(cnBanHienTai()))}</h3>
    <p class="muted" style="margin-top:-6px">Mỗi bàn một mã riêng. Khách quét bằng camera điện thoại → mở trang gọi món trên GitHub Pages. Chế độ: <b>${esc(d.cheDo)}</b>.</p>
    ${d.ban.length ? `<div class="qr-luoi">${d.ban.map(b => `<div class="qr-the"><b>${esc(b.TEN_BAN)}</b><small>${esc(b.KHU_VUC)}</small>
      <img src="${esc(anhQR(b.LINK))}" alt="Mã QR ${esc(b.TEN_BAN)}" loading="lazy">
      <button class="link" data-act="qrChep" data-id="${esc(b.MA_BAN)}">Sao chép link</button></div>`).join('')}</div>` : '<p class="trong-rong">Chi nhánh chưa có bàn.</p>'}
    <div class="modal-actions">${S.qt.dl.laChuQuan ? '<button class="btn do" data-act="qrDoiKhoa" style="margin-right:auto">Đổi mã (hủy mã cũ)</button>' : ''}
      <button class="btn" data-act="dongModal">Đóng</button><button class="btn primary" data-act="qrIn" ${d.ban.length ? '' : 'disabled'}>🖨 In tất cả</button></div>`, 'rong');
}
async function qrDoiKhoa(){
  if (!(await xacNhan('Đổi mã QR?', 'Toàn bộ mã QR đã in ở mọi chi nhánh sẽ không dùng được nữa; bạn cần in và dán lại. Chỉ làm khi mã bị lộ hoặc có người phá.', 'Đổi mã'))) { veQR(); return; }
  await chay(async () => { S.qr = await api('qtDoiKhoaQR', cnBanHienTai()); veQR(); toast('Đã tạo mã mới. Hãy in lại và thay mã trên các bàn.', 'ok'); });
}
function qrIn(){
  const d = S.qr, pa = $('#print-area');
  pa.className = 'a4';
  pa.innerHTML = `<div class="qr-in">${d.ban.map(b => `<div class="qr-the"><div class="ten-q">${esc(d.tenQuan || '')}</div><b>${esc(b.TEN_BAN)}</b>
    <img src="${esc(anhQR(b.LINK))}" alt=""><div class="moi">📱 Quét mã để xem thực đơn &amp; gọi món</div></div>`).join('')}</div>`;
  const st = document.createElement('style'); st.textContent = '@page{size:A4;margin:10mm}'; document.head.appendChild(st);
  const anh = Array.from(pa.querySelectorAll('img'));
  busy(true);
  Promise.all(anh.map(i => i.complete ? 1 : new Promise(r => { i.addEventListener('load', r); i.addEventListener('error', r); setTimeout(r, 8000); })))
    .then(() => { busy(false); window.print(); setTimeout(() => { st.remove(); pa.className = ''; pa.innerHTML = ''; }, 800); });
}

/** Chuẩn hóa link để xem trước (giống máy chủ): http → https, thêm https nếu thiếu, lấy link gốc từ Google Hình ảnh */
function linkAnhXem(s){
  s = String(s || '').trim();
  if (/^data:/i.test(s)) return s;
  const g = s.match(/[?&](?:imgurl|mediaurl|url)=([^&#]+)/i);
  if (g && /(google|bing)\./i.test(s)) { try { s = decodeURIComponent(g[1]); } catch (e) {} }
  if (/^[/][/]/.test(s)) return 'https:' + s;
  if (/^http:[/][/]/i.test(s)) return 'https:' + s.slice(5);
  if (!/^https:/i.test(s) && /^[\w-]+(\.[\w-]+)+/.test(s)) return 'https:' + '\/\/' + s;
  return s;
}
function anhXemLoi(img){
  if (/lh3\.googleusercontent\.com/.test(img.src) && !img.dataset.thu) return anhLoi(img);
  const o = img.parentNode; if (!o) return;
  o.innerHTML = '<span style="padding:8px;color:var(--do)">Không tải được ảnh từ link này.<br><small style="color:var(--mo)">Một số trang chặn dùng ảnh ở nơi khác. Hãy tải ảnh về máy rồi bấm "Chọn ảnh", hoặc sao chép ảnh rồi bấm Ctrl + V.</small></span>';
}
function xuLyAnhDataUrl(dataUrl, maxPx){
  return fetch(dataUrl).then(r => r.blob()).then(b => xuLyAnh(new File([b], 'anh-dan.' + ((b.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg')), {type: b.type || 'image/jpeg'}), maxPx));
}

/** Thu nhỏ ảnh còn tối đa 900px, nén JPEG để tải nhanh */
function xuLyAnh(file, maxPx){
  return new Promise((res, rej) => {
    if (String(file.type).indexOf('image/') !== 0) return rej(new Error('Vui lòng chọn file ảnh.'));
    if (file.size > 15 * 1024 * 1024) return rej(new Error('Ảnh quá lớn (tối đa 15MB).'));
    const r = new FileReader();
    r.onerror = () => rej(new Error('Không đọc được ảnh.'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Định dạng ảnh không hỗ trợ.'));
      img.onload = () => {
        const max = maxPx || 900, tl = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * tl); c.height = Math.round(img.height * tl);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.85);
        res({dataUrl: url, base64: url.split(',')[1], mimeType: 'image/jpeg', tenFile: file.name});
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ======================= BÁO CÁO & PHÂN TÍCH ======================= */
const THU = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
const THU_NGAN = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const KY_BC = [['homnay', 'Hôm nay'], ['homqua', 'Hôm qua'], ['7ngay', '7 ngày'], ['30ngay', '30 ngày'], ['thangnay', 'Tháng này'], ['thangtruoc', 'Tháng trước'], ['tuychon', 'Tùy chọn']];
function congNgay(s, n){ const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function khoangNgay(k){
  const h = ngayHomNay();
  if (k === 'homnay') return [h, h];
  if (k === 'homqua') { const q = congNgay(h, -1); return [q, q]; }
  if (k === '7ngay') return [congNgay(h, -6), h];
  if (k === '30ngay') return [congNgay(h, -29), h];
  if (k === 'thangnay') return [h.slice(0, 8) + '01', h];
  if (k === 'thangtruoc') { const cuoi = congNgay(h.slice(0, 8) + '01', -1); return [cuoi.slice(0, 8) + '01', cuoi]; }
  return null;
}
const ngayVN = s => String(s).slice(0, 10).split('-').reverse().join('/');
const ngayNgan = s => ngayVN(s).slice(0, 5);
function soGon(n){
  const a = Math.abs(n), f = (x, d) => (+x.toFixed(d)).toLocaleString('vi-VN');
  if (a >= 1e9) return f(n / 1e9, 1) + ' tỷ';
  if (a >= 1e6) return f(n / 1e6, a >= 1e8 ? 0 : 1) + ' tr';
  if (a >= 1e3) return f(n / 1e3, 0) + 'k';
  return String(Math.round(n));
}
const phanTram = (x, d) => (x * 100).toLocaleString('vi-VN', {maximumFractionDigits: d == null ? 1 : d}) + '%';
function bienDong(nay, truoc, tangLaXau){
  if (!truoc) return nay ? '<div class="delta">Kỳ trước chưa phát sinh</div>' : '<div class="delta">Không đổi so với kỳ trước</div>';
  const p = (nay - truoc) / Math.abs(truoc);
  if (Math.abs(p) < 0.005) return '<div class="delta">≈ kỳ trước</div>';
  const tang = p > 0, tot = tangLaXau ? !tang : tang;
  return `<div class="delta ${tot ? 'tot' : 'xau'}">${tang ? '▲' : '▼'} ${phanTram(Math.abs(p))} so với kỳ trước</div>`;
}
function mucChia(max){
  if (max <= 0) return [1, 4];
  const tho = max / 4, mu = Math.pow(10, Math.floor(Math.log10(tho)));
  const buoc = [1, 2, 2.5, 5, 10].map(x => x * mu).find(x => x * 4 >= max) || 10 * mu;
  return [buoc, 4];
}
/** Biểu đồ cột một chuỗi: ds = [{nhan, giaTri, tip}] */
function bieuDoCot(ds, o){
  o = o || {};
  const W = o.rong || 760, H = o.cao || 230, L = 46, R = 6, T = 10, B = 26;
  const max = Math.max(0, ...ds.map(d => d.giaTri));
  const [buoc, soMuc] = mucChia(max), dinh = buoc * soMuc;
  const n = ds.length, bw = (W - L - R) / Math.max(1, n), rong = Math.max(3, Math.min(24, bw * 0.68));
  const y = v => T + (H - T - B) * (1 - v / dinh), day = H - B;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.ten || 'Biểu đồ')}">`;
  for (let i = 0; i <= soMuc; i++) {
    const gy = y(buoc * i);
    s += `<line class="${i ? 'luoi' : 'truc'}" x1="${L}" x2="${W - R}" y1="${gy}" y2="${gy}"/><text x="${L - 6}" y="${gy + 4}" text-anchor="end">${soGon(buoc * i)}</text>`;
  }
  const buocNhan = Math.max(1, Math.ceil(n / Math.floor((W - L) / (o.nhanRong || 46))));
  ds.forEach((d, i) => {
    const cx = L + bw * (i + 0.5), x0 = cx - rong / 2, x1 = cx + rong / 2, yt = y(d.giaTri), r = Math.min(4, (day - yt), rong / 2);
    s += `<g class="cot"><rect x="${L + bw * i}" y="${T}" width="${bw}" height="${day - T}" data-tip="${esc(d.tip)}"/>`;
    if (d.giaTri > 0) s += `<path d="M${x0} ${day}V${yt + r}Q${x0} ${yt} ${x0 + r} ${yt}H${x1 - r}Q${x1} ${yt} ${x1} ${yt + r}V${day}Z" pointer-events="none"/>`;
    s += '</g>';
    if (i % buocNhan === 0) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(d.nhan)}</text>`;
  });
  return `<div class="chart">${s}</svg></div>`;
}
/** Thanh ngang: tỷ trọng từng phần */
function thanhNgang(ds, dinhDang){
  const tong = ds.reduce((a, d) => a + d.giaTri, 0), max = Math.max(1, ...ds.map(d => d.giaTri));
  if (!ds.length || !tong) return '<p class="muted">Chưa có dữ liệu trong kỳ.</p>';
  return `<div class="hbar">${ds.map(d => `<div class="nhan" title="${esc(d.nhan)}">${esc(d.nhan)}</div>
    <div class="track" data-tip="${esc(d.tip || d.nhan + ': ' + (dinhDang || tien)(d.giaTri))}"><div class="fill" style="width:${(d.giaTri / max * 100).toFixed(1)}%"></div></div>
    <div class="gt">${(dinhDang || tien)(d.giaTri)}<small>${phanTram(d.giaTri / tong, 0)}</small></div>`).join('')}</div>`;
}

function phanTich(d){
  const t = d.tongQuan, k = d.kyTruoc, ds = [];
  const them = (loai, ic, html) => ds.push({loai, ic, html});
  if (!t.soHoaDon) { them('', 'i', 'Chưa có hóa đơn đã thanh toán trong kỳ này.'); return ds; }
  if (k.doanhThu) {
    const p = (t.doanhThu - k.doanhThu) / k.doanhThu;
    const pHD = k.soHoaDon ? (t.soHoaDon - k.soHoaDon) / k.soHoaDon : 0, pTB = k.giaTriTB ? (t.giaTriTB - k.giaTriTB) / k.giaTriTB : 0;
    const vi = Math.abs(pHD) >= Math.abs(pTB) ? `số hóa đơn ${pHD >= 0 ? 'tăng' : 'giảm'} ${phanTram(Math.abs(pHD))}` : `giá trị trung bình mỗi hóa đơn ${pTB >= 0 ? 'tăng' : 'giảm'} ${phanTram(Math.abs(pTB))}`;
    them(p >= 0 ? 'tot' : 'xau', p >= 0 ? '▲' : '▼', `Doanh thu <b>${p >= 0 ? 'tăng' : 'giảm'} ${phanTram(Math.abs(p))}</b> so với kỳ trước (${tien(k.doanhThu)} → ${tien(t.doanhThu)}), chủ yếu do ${vi}.`);
  } else them('', 'i', `Kỳ trước (${ngayVN(d.truocTu)} – ${ngayVN(d.truocDen)}) chưa có doanh thu để so sánh.`);
  /* Giờ cao điểm: khung 2 giờ liền nhau có doanh thu cao nhất */
  let tot = -1, gio = 0;
  for (let g = 0; g < 23; g++) { const v = d.theoGio[g].doanhThu + d.theoGio[g + 1].doanhThu; if (v > tot) { tot = v; gio = g; } }
  if (tot > 0) them('', '⏱', `Giờ cao điểm: <b>${gio}h – ${gio + 2}h</b>, chiếm ${phanTram(tot / t.doanhThu, 0)} doanh thu. Nên tăng người pha chế, chuẩn bị sẵn nguyên liệu trước khung giờ này.`);
  if (d.soNgay >= 7) {
    const tb = d.theoThu.filter(x => x.soNgay).map(x => ({thu: x.thu, v: x.doanhThu / x.soNgay})).sort((a, b) => b.v - a.v);
    if (tb.length >= 2 && tb[0].v > 0) them('', '📅', `Bán tốt nhất vào <b>${THU[tb[0].thu]}</b> (trung bình ${tien(tb[0].v)}/ngày), thấp nhất ${THU[tb[tb.length - 1].thu]} (${tien(tb[tb.length - 1].v)}/ngày).`);
  }
  if (d.soNgay > 1) {
    const top = d.theoNgay.slice().sort((a, b) => b.doanhThu - a.doanhThu)[0], khong = d.theoNgay.filter(x => !x.doanhThu).length;
    them('', '★', `Ngày doanh thu cao nhất: <b>${ngayVN(top.ngay)}</b> (${tien(top.doanhThu)}, ${top.soHoaDon} hóa đơn).${khong ? ` Có ${khong} ngày không phát sinh doanh thu.` : ''}`);
  }
  if (d.theoMon.length) {
    const theoSL = d.theoMon.slice().sort((a, b) => b.soLuong - a.soLuong)[0];
    const top3 = d.theoMon.slice(0, 3), ty = top3.reduce((a, m) => a + m.doanhThu, 0) / t.doanhThu;
    them('tot', '☕', `Món bán chạy nhất: <b>${esc(theoSL.ten)}</b> (${theoSL.soLuong} phần). Ba món ${top3.map(m => esc(m.ten)).join(', ')} chiếm ${phanTram(ty, 0)} doanh thu.`);
    const coVon = d.theoMon.filter(m => m.giaVon > 0 && m.doanhThu > 0);
    if (coVon.length) {
      const lai = coVon.slice().sort((a, b) => b.laiGop - a.laiGop)[0];
      them('tot', '₫', `Mang lại lãi gộp nhiều nhất: <b>${esc(lai.ten)}</b> (${tien(lai.laiGop)}, biên ${phanTram(lai.laiGop / lai.doanhThu, 0)}).`);
      const thap = coVon.filter(m => m.laiGop / m.doanhThu < 0.45 && m.doanhThu >= t.doanhThu * 0.05).sort((a, b) => a.laiGop / a.doanhThu - b.laiGop / b.doanhThu)[0];
      if (thap) them('xau', '!', `<b>${esc(thap.ten)}</b> bán nhiều nhưng biên lãi gộp chỉ ${phanTram(thap.laiGop / thap.doanhThu, 0)}: xem lại giá bán hoặc định lượng.`);
    }
  }
  if (d.monChuaBan.length) them('xau', '!', `${d.monChuaBan.length} món đang bán nhưng chưa bán được phần nào trong kỳ: ${d.monChuaBan.slice(0, 4).map(m => esc(m.ten)).join(', ')}${d.monChuaBan.length > 4 ? '…' : ''}. Cân nhắc khuyến mãi hoặc ngừng bán.`);
  if (t.tongTienHang && t.giamGia / t.tongTienHang > 0.08) them('xau', '%', `Giảm giá chiếm ${phanTram(t.giamGia / t.tongTienHang)} tiền hàng (${tien(t.giamGia)}): kiểm tra hiệu quả các chương trình giảm giá.`);
  if (t.tienMonHuy || t.hoaDonHuy) them(t.tienMonHuy > t.doanhThu * 0.02 ? 'xau' : '', '✕', `Thất thoát: ${t.monHuy} món bị hủy (${tien(t.tienMonHuy)}) và ${t.hoaDonHuy} hóa đơn bị hủy. Xem chi tiết lý do ở cuối báo cáo.`);
  const ck = d.theoPhuongThuc.filter(p => /chuy|CK/i.test(p.ten + p.ma)).reduce((a, p) => a + p.soTien, 0);
  if (ck) them('', '⇄', `Chuyển khoản chiếm ${phanTram(ck / t.doanhThu, 0)} doanh thu; nhớ đối soát với sao kê ngân hàng cuối ngày.`);
  const md = d.theoLoaiDon.find(x => x.loai === 'Mang đi');
  if (md && md.doanhThu) them('', '🥤', `Đơn mang đi chiếm ${phanTram(md.doanhThu / t.doanhThu, 0)} doanh thu (${md.soHoaDon} đơn).`);
  if (d.theoChiNhanh.length > 1) { const c = d.theoChiNhanh[0]; them('tot', '🏪', `${esc(c.ten)} dẫn đầu với ${tien(c.doanhThu)} (${phanTram(c.doanhThu / t.doanhThu, 0)} toàn hệ thống).`); }
  return ds;
}

function csvTai(tenFile, rows){
  const csv = '﻿' + rows.map(r => r.map(v => { const s = String(v == null ? '' : v); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
    a.download = tenFile; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } catch (e) { /* hiện dữ liệu để sao chép bên dưới */ }
  return rows.map(r => r.join('\t')).join('\n');
}

  if (loai === 'ngay') rows = [['Ngày', 'Thứ', 'Số hóa đơn', 'Doanh thu', 'Lãi gộp']].concat(d.theoNgay.map(x => [ngayVN(x.ngay), THU[new Date(x.ngay + 'T00:00:00Z').getUTCDay()], x.soHoaDon, x.doanhThu, x.laiGop]));
  if (loai === 'mon') rows = [['Mã món', 'Tên món', 'Số lượng', 'Doanh thu', 'Giá vốn', 'Lãi gộp']].concat(d.theoMon.map(m => [m.ma, m.ten, m.soLuong, m.doanhThu, m.giaVon, m.laiGop]));
  if (loai === 'nhom') rows = [['Nhóm món', 'Số lượng', 'Doanh thu', 'Lãi gộp']].concat(d.theoNhom.map(x => [x.ten, x.soLuong, x.doanhThu, x.laiGop]));
  if (loai === 'nhanvien') rows = [['Mã NV', 'Nhân viên', 'Số hóa đơn mở', 'Doanh thu']].concat(d.theoNhanVien.map(x => [x.ma, x.ten, x.soHoaDon, x.doanhThu]));
  if (loai === 'huy') rows = [['Thời gian', 'Loại', 'Hóa đơn', 'Bàn/đơn', 'Nội dung', 'Người thực hiện']].concat(d.huy.map(x => [x.thoiGian, x.loai, x.maHoaDon, x.noi, x.noiDung, x.nguoi]));
  const tsv = csvTai('BaoCao_' + loai + '_' + hau, rows);
  $('#bc-xuat-kq').innerHTML = `<p class="muted" style="margin-top:14px">Đã tạo file <b>BaoCao_${esc(loai)}_${esc(hau)}</b>. Nếu trình duyệt không tải về, bôi đen nội dung dưới đây rồi dán vào Excel / Google Sheets:</p>
    <textarea class="input" rows="6" readonly style="font-family:monospace;font-size:12px">${esc(tsv)}</textarea>`;
}
function bcIn(){
  const pa = $('#print-area');
  pa.className = 'a4';
  pa.innerHTML = `<h2 style="margin:0 0 4px">${esc(((S.dm && S.dm.thongTinQuan) || {}).TEN_QUAN || '')} – Báo cáo bán hàng</h2>` + $('#bc-noidung').innerHTML;
  const st = document.createElement('style'); st.id = 'trang-a4'; st.textContent = '@page{size:A4;margin:12mm}'; document.head.appendChild(st);
  setTimeout(() => { window.print(); setTimeout(() => { st.remove(); pa.className = ''; pa.innerHTML = ''; }, 500); }, 50);
}

/* ======================= XỬ LÝ SỰ KIỆN ======================= */
const HD = {
  tab: id => { if (S.view === 'quantri' && id === 'quantri') return; if (S.view === 'order' && S.cho.length) return quayLai().then(() => { if (!S.cho.length) doiView(id); }); doiView(id); },
  dangXuat: () => dangXuat(),
  hienMK: (id, el) => hienMK(id, el),
  menuTK: () => menuTK(),
  doiCN: () => moChonChiNhanh(false),
  chonCN: id => chonCN(id),
  moDoiMK: () => moDoiMatKhau(false),
  qtTab: id => { S.qt.tab = id; S.qt.tim = ''; renderQuanTri(); },
  bcKy: id => {
    S.bc.ky = id;
    if (id === 'tuychon') { renderBaoCao(); $('#bc-tu').focus(); return; }
    [S.bc.tu, S.bc.den] = khoangNgay(id); taiBaoCao();
  },
  bcXem: () => {
    const tu = $('#bc-tu').value, den = $('#bc-den').value;
    if (!tu || !den) return toast('Chọn đủ ngày bắt đầu và kết thúc.', 'loi');
    S.bc.tu = tu <= den ? tu : den; S.bc.den = tu <= den ? den : tu; taiBaoCao();
  },
  bcSapMon: id => { S.bc.sapMon = id; renderBaoCao(); },
  bcHetMon: () => { S.bc.hetMon = !S.bc.hetMon; renderBaoCao(); },
  bcXuat: () => bcXuat(),
  bcXuatLoai: id => bcXuatLoai(id),
  bcIn: () => bcIn(),
  achChon: () => $('#ach-file').click(),
  achLink: () => { const l = $('#ach-link'); l.hidden = false; l.value = S.anhCH.moi ? '' : (S.anhCH.link || ''); l.focus(); },
  achXoa: () => { S.anhCH.moi = null; S.anhCH.link = ''; const l = $('#ach-link'); if (l) l.value = ''; S.veAnhCH(); },
  denThongTinQuan: () => { S.qt = S.qt || {tab: null, dl: null, loc: '', tim: '', hienNghi: false}; S.qt.tab = 'quan'; doiView('quantri'); },
  qtFormCN: id => qtFormCN(id),
  qtFormKV: id => qtFormKV(id),
  qtFormBan: id => qtFormBan(id),
  qtFormBanMoi: id => qtFormBan(null, id),
  qtFormNhieuBan: () => qtFormNhieuBan(),
  qtFormNhom: id => qtFormNhom(id),
  qtFormSP: id => qtFormSP(id),
  tdLocNhom: id => { S.qt.nhomTD = id; renderQuanTri(); },
  spChonAnh: () => $('#sp-file').click(),
  spLinkAnh: () => { $('#sp-link-box').hidden = false; $('#sp-link').value = S.anhTam.moi ? '' : (S.anhTam.link || ''); $('#sp-link').focus(); },
  spXoaAnh: () => { S.anhTam.moi = null; S.anhTam.link = ''; const l = $('#sp-link'); if (l) l.value = ''; S.veAnhSP(); },
  qtFormNV: id => qtFormNV(id),
  qtFormTK: () => qtFormTK(),
  qtDatLaiMK: id => qtDatLaiMK(id),
  qtKhoa: id => qtKhoa(id),
  qtDangXuatTK: id => qtDangXuatTK(id),
  mkNgauNhien: id => mkNgauNhien(id),
  saoChepTK: () => {
    const xong = () => toast('Đã sao chép.', 'ok');
    if (navigator.clipboard) navigator.clipboard.writeText(S.tkVuaTao).then(xong, () => toast('Trình duyệt chặn sao chép, hãy ghi lại thủ công.', 'loi'));
  },
  moBan: id => moBan(id),
  locKV: id => { S.locBan.kv = id || ''; renderBan(); },
  locTT: id => { S.locBan.tt = id || ''; renderBan(); },
  moMangDi: () => moMangDi(),
  moHoaDon: id => moHoaDon(id),
  chonNhom: id => { S.nhom = id; renderMenu(); },
  themMon: id => themMon(id),
  tangSL: i => { S.cho[i].soLuong++; renderMenu(); renderCart(); },
  giamSL: i => { if (--S.cho[i].soLuong <= 0) S.cho.splice(i, 1); renderMenu(); renderCart(); },
  ghiChuMon: i => ghiChuMon(+i),
  guiMon: () => guiMon(),
  huyMon: id => huyMon(id),
  chuyenBan: () => chuyenBanUI(),
  chonBanMoi: id => chonBanMoi(id),
  huyHoaDon: () => huyHoaDonUI(),
  inTamTinh: () => inHoaDon(S.ct, true),
  quayLai: () => quayLai(),
  xemGio: () => { S.gioMo = true; $('#cart').classList.add('mo'); $('#gio-nen').classList.add('mo'); },
  dongGio: () => { S.gioMo = false; $('#cart').classList.remove('mo'); $('#gio-nen').classList.remove('mo'); },
  moThanhToan: () => moThanhToan(),
  themKhoan: () => { const n = soTT(); const da = S.tt.khoan.reduce((a, k) => a + (+k.soTien || 0), 0);
    const daDung = S.tt.khoan.map(k => k.pt);
    const pt = S.dm.phuongThuc.find(p => p.MA_PHUONG_THUC === 'TM' && !daDung.includes('TM')) || S.dm.phuongThuc.find(p => !daDung.includes(p.MA_PHUONG_THUC)) || S.dm.phuongThuc[0];
    S.tt.khoan.push({pt: pt.MA_PHUONG_THUC, soTien: Math.max(0, n.conLai - da), khachDua: ''}); renderThanhToan(); },
  xoaKhoan: i => {
    S.tt.khoan.splice(+i, 1);
    if (S.tt.khoan.length === 1) { S.tt.khoan[0].soTien = soTT().conLai; S.tt.khoan[0].khachDua = ''; } /* còn một dòng → thu đủ */
    renderThanhToan();
  },
  khachDua: v => { const [i, so] = v.split(':'); const k = S.tt.khoan[+i]; k.khachDua = +so ? String(+so) : '';
    const ip = document.querySelector(`[data-tt="khachDua"][data-i="${i}"]`); if (ip) ip.value = k.khachDua; capNhatSoTT(); },
  xacNhanThanhToan: () => xacNhanThanhToan(),
  xongThanhToan: () => { dongModal(); S.ct = null; doiView('ban'); },
  inVaDong: () => { const ct = S.ct; dongModal(); S.ct = null; doiView('ban'); inHoaDon(ct, false); },
  dongModal: () => { dongModal(); S.tt = null; },
  taiPhaChe: () => taiPhaChe(),
  ycDongY: id => xuLyYCUI(id, true),
  ycTuChoi: id => xuLyYCUI(id, false),
  qtQR: () => qtQRBan(),
  qrIn: () => qrIn(),
  qrDoiKhoa: () => qrDoiKhoa(),
  qrChep: id => { const b = S.qr.ban.find(x => x.MA_BAN === id); if (b && navigator.clipboard) navigator.clipboard.writeText(b.LINK).then(() => toast('Đã sao chép link ' + b.TEN_BAN, 'ok'), () => toast(b.LINK)); else if (b) toast(b.LINK); },
  batTB: () => { ghiLS('cafe_tb_pc', nhanTB() ? '0' : '1'); moAmThanh(); capNhatHuyHieu(); renderPhaChe(); toast(nhanTB() ? 'Máy này sẽ nhận thông báo khi có món mới.' : 'Đã tắt thông báo trên máy này.', 'ok'); },
  batAm: () => { ghiLS('cafe_tb_am', coAmThanh() ? '0' : '1'); renderPhaChe(); if (coAmThanh()) chuong('moi'); },
  thuChuong: () => chuong('moi'),
  tbDong: (id, el) => { const t = el.closest('.tb'); if (t) t.remove(); },
  tbXem: (id, el) => { $('#tb-pc').innerHTML = ''; if (S.view === 'order' && S.cho.length) return; doiView('phache'); },
  xongMon: id => xongPhaChe([id]),
  xongDon: id => { const d = S.phaChe.find(x => x.MA_HOA_DON === id); if (d) xongPhaChe(d.mon.map(m => m.MA_CHI_TIET)); },
  xemHD: id => xemHD(id),
  inLai: () => { const ct = S.ctXem; dongModal(); inHoaDon(ct, ct.hoaDon.TRANG_THAI !== 'Đã thanh toán'); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = HD[t.dataset.act]; if (f) { e.preventDefault(); f(t.dataset.id, t); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !S.tt && !S.modalKhoa && !S.formMo) dongModal(); });

/* Tự làm mới sơ đồ bàn và quầy pha chế */
setInterval(() => {
  if (!S.token || document.hidden || !$('#modal').classList.contains('hidden')) return;
  if (S.view === 'ban') taiBan(true);
}, 12000);

/* ======================= KHỞI ĐỘNG ======================= */
(async function khoiDong(){
  window.__appOK = true;
  const kiemPhienBan = q => {
    apThongTinCongKhai(q);
    if (q && q.PHIEN_BAN && q.PHIEN_BAN !== PHIEN_BAN_GIAO_DIEN) {
      $('#l-pb').classList.add('lech');
      $('#l-pb').textContent = `Giao diện ${PHIEN_BAN_GIAO_DIEN} ≠ máy chủ ${q.PHIEN_BAN}: hãy dán đủ các file cùng một lần rồi triển khai Phiên bản mới.`;
    }
  };
  if (CAU_HINH) kiemPhienBan(CAU_HINH);
  else goi('layThongTinCongKhai').then(kiemPhienBan).catch(e => {
    $('#l-loi').textContent = 'Không kết nối được máy chủ: ' + loiGon(e) + '. Kiểm tra đã dán đủ file Code.gs, QuanTri.gs và triển khai Phiên bản mới.';
  });
  $('#l-nho').checked = docLS('cafe_nho') === '1';
  const ten = docLS('cafe_tendn'); if (ten) $('#l-tk').value = ten;
  const luu = KHO.doc();
  if (luu && luu.token) {
    S.token = luu.token;
    $('#login').classList.add('hidden'); busy(true);
    try { await sauDangNhap(await goi('layPhienHienTai', S.token)); }
    catch (e) { hienLoiVaoApp(e); }
    finally { busy(false); }
  } else {
    (ten ? $('#l-mk') : $('#l-tk')).focus();
  }
})();
</script>
