<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --nau:#6F4E37; --nau-dam:#4B3325; --kem:#FAF6F0; --kem-dam:#F0E8DC; --vien:#E4D9CA;
  --chu:#2B2118; --mo:#857566; --xanh:#2E7D5B; --xanh-nhat:#E3F2EA; --cam:#C9761E; --cam-nhat:#FBEEDC;
  --do:#B83A2E; --do-nhat:#FBE7E4; --trang:#fff; --r:12px; --bong:0 1px 2px rgba(60,40,20,.08),0 4px 14px rgba(60,40,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--kem);color:var(--chu);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
[hidden]{display:none!important}
h2{font-size:20px;margin:0}
h3{font-size:16px;margin:0}

/* Nút */
.btn{border:1px solid var(--vien);background:var(--trang);color:var(--chu);padding:9px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--kem-dam)}
.btn.primary{background:var(--nau);border-color:var(--nau);color:#fff}
.btn.primary:hover{background:var(--nau-dam)}
.btn.xanh{background:var(--xanh);border-color:var(--xanh);color:#fff}
.btn.do{color:var(--do);border-color:#EBC3BD}
.btn.do:hover{background:var(--do-nhat)}
.btn.lon{padding:13px 18px;font-size:16px;font-weight:600}
.btn.nho{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}

/* Ô nhập */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--mo);margin-bottom:5px;font-weight:500}
.input{width:100%;border:1px solid var(--vien);background:#fff;border-radius:10px;padding:10px 12px;outline:none}
.input::placeholder{text-transform:none}
.input:focus{border-color:var(--nau);box-shadow:0 0 0 3px rgba(111,78,55,.12)}

/* Đăng nhập */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:18px;box-shadow:var(--bong);padding:32px 28px;width:100%;max-width:380px}
.logo{font-size:40px;text-align:center}
.login-box h1{text-align:center;font-size:22px;margin:6px 0 4px}
.login-box p.sub{text-align:center;color:var(--mo);margin:0 0 22px;font-size:14px}

/* Khung ứng dụng */
header{position:sticky;top:0;z-index:20;background:var(--nau-dam);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;height:56px}
header .brand{display:flex;align-items:center;gap:10px;min-width:0;max-width:300px}
header .brand-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff;flex-shrink:0}
header .brand-icon{font-size:22px;flex-shrink:0}
header .brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.2}
header .brand-text b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .brand-text small{font-size:12px;color:#E8DCCD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header nav{display:flex;gap:4px;flex:1;overflow-x:auto}
header nav button{background:transparent;border:0;color:#E8DCCD;padding:8px 12px;border-radius:8px;font-weight:500;white-space:nowrap}
header nav button.on{background:rgba(255,255,255,.14);color:#fff}
header .user{font-size:13px;color:#E8DCCD;text-align:right;white-space:nowrap}
header .user b{color:#fff;display:block;font-weight:600}
header .out{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:18px;max-width:1400px;margin:0 auto}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .gian{flex:1}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mo)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Sơ đồ bàn */
.kv{color:var(--mo);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px}
.ban-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ban{background:#fff;border:1.5px solid var(--vien);border-radius:var(--r);padding:14px;min-height:96px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;box-shadow:var(--bong);transition:transform .08s}
.ban:active{transform:scale(.98)}
.ban .ten{font-weight:700;font-size:17px}
.ban .trong{color:var(--xanh);font-size:13px}
.ban.co-khach{background:var(--cam-nhat);border-color:#EBC08C}
.ban .tien{font-weight:600;color:var(--nau-dam)}
.ban .tg{font-size:12px;color:var(--cam)}
/* Sơ đồ bàn – giao diện mới */
.sdb-dau{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sdb-dau h2{font-size:24px;letter-spacing:-.01em}
.sdb-dau .phu{color:var(--mo);font-size:13px;margin-top:3px}
.sdb-dau .gian{flex:1}
.sdb-tk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tk-o{background:#fff;border-radius:14px;box-shadow:var(--bong);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.tk-o .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tk-o .ic svg{width:20px;height:20px}
.tk-o small{display:block;color:var(--mo);font-size:12px;margin-bottom:2px;white-space:nowrap}
.tk-o b{font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tk-o b span{font-size:13px;color:var(--mo);font-weight:500}
.tk-o .thanh{height:5px;border-radius:99px;background:var(--kem-dam);margin-top:6px;overflow:hidden}
.tk-o .thanh i{display:block;height:100%;background:var(--cam);border-radius:99px}
.ic.nau{background:var(--kem-dam);color:var(--nau)}
.ic.cam{background:var(--cam-nhat);color:var(--cam)}
.ic.xanh{background:var(--xanh-nhat);color:var(--xanh)}
.ic.tim{background:#EEE9F6;color:#6A4FA3}
.sdb-loc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.sdb-loc .chips{padding:0 0 2px;flex:1 1 260px;min-width:0;overflow-x:auto}
.sdb-loc .seg{flex-shrink:0}
.seg{display:inline-flex;background:var(--kem-dam);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mo);white-space:nowrap}
.seg button.on{background:#fff;color:var(--chu);box-shadow:0 1px 3px rgba(60,40,20,.12)}
.kv-tieu{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.kv-tieu h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--nau-dam);white-space:nowrap}
.kv-tieu .dem{font-size:12px;color:var(--mo);background:#fff;border:1px solid var(--vien);border-radius:99px;padding:2px 9px;white-space:nowrap}
.kv-tieu .vach{flex:1;height:1px;background:var(--vien)}
.ban-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.the{position:relative;overflow:hidden;background:#fff;border:1px solid var(--vien);border-radius:16px;padding:13px 14px 12px 17px;min-height:118px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:var(--bong);transition:transform .12s,box-shadow .12s,border-color .12s}
.the::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--xanh)}
.the:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(60,40,20,.08),0 10px 24px rgba(60,40,20,.12);border-color:#D6C6B2}
.the:active{transform:scale(.98)}
.the .dong1{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.the .ten{font-weight:700;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.pill.trong{background:var(--xanh-nhat);color:var(--xanh)}
.pill.khach{background:var(--cam);color:#fff}
.pill.mot-phan{background:#EEE9F6;color:#6A4FA3}
.the .meta{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mo)}
.the .meta svg{width:14px;height:14px;flex-shrink:0}
.the .nghi{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;color:#D9CDBE}
.the .nghi svg{width:34px;height:34px}
.the.khach{background:linear-gradient(180deg,#FFF8EE,#FDEFDC);border-color:#EED3AD}
.the.khach::before{background:var(--cam)}
.the.khach .tien{font-size:19px;font-weight:700;color:var(--nau-dam);font-variant-numeric:tabular-nums;margin-top:auto}
.the.khach .meta{color:#9A6A33}
.the.lau .meta.tg{color:var(--do);font-weight:600}
.the.lau::before{background:var(--do)}
.the.mang-di::before{background:#6A4FA3}
.the.mang-di{background:linear-gradient(180deg,#FBF9FE,#F3EEFA);border-color:#DCD2EE}
.the.mang-di .meta{color:#6E5F8A}
.the .gc{font-size:12px;color:var(--mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.the.them{border-style:dashed;background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--nau);font-weight:600;gap:4px}
.the.them::before{display:none}
.the.them svg{width:24px;height:24px}
.sdb-rong{background:#fff;border:1px dashed var(--vien);border-radius:14px;padding:26px;text-align:center;color:var(--mo);font-size:14px}
@media (max-width:1200px){.sdb-tk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.sdb-dau h2{font-size:21px}}

/* Gọi món */
.order{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
.pane{background:#fff;border-radius:var(--r);box-shadow:var(--bong)}
.menu-pane{padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px}
.chip{border:1px solid var(--vien);background:#fff;border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:500;font-size:14px}
.chip.on{background:var(--nau);color:#fff;border-color:var(--nau)}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sp{border:1px solid var(--vien);background:var(--kem);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative}
.sp:hover{border-color:var(--nau)}
.sp .anh{width:100%;aspect-ratio:4/3;border-radius:8px;background:var(--kem-dam);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--nau);overflow:hidden}
.sp .anh img{width:100%;height:100%;object-fit:cover}
.sp .ten{font-weight:600;font-size:14px;line-height:1.3}
.sp .gia{color:var(--nau);font-weight:600;font-size:14px}
.sp .sl{position:absolute;top:6px;right:6px;background:var(--nau);color:#fff;border-radius:999px;min-width:24px;height:24px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}

.cart-pane{position:sticky;top:72px;display:flex;flex-direction:column;max-height:calc(100vh - 90px)}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--vien);display:flex;align-items:center;gap:10px}
.cart-head .t{flex:1;min-width:0}
.cart-head .ma{font-size:12px;color:var(--mo)}
.cart-body{overflow-y:auto;padding:6px 16px;flex:1}
.nhan{font-size:12px;color:var(--mo);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px;font-weight:600}
.dong{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--vien)}
.dong:last-child{border-bottom:0}
.dong .info{flex:1;min-width:0}
.dong .ten{font-weight:600}
.dong .phu{font-size:13px;color:var(--mo)}
.dong .gc{font-size:13px;color:var(--cam);font-style:italic}
.dong .tt{font-weight:600;white-space:nowrap}
.dong.huy .ten,.dong.huy .tt{text-decoration:line-through;color:var(--mo)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:4px}
.badge.cho{background:var(--cam-nhat);color:var(--cam)}
.badge.xong{background:var(--xanh-nhat);color:var(--xanh)}
.badge.huy{background:var(--do-nhat);color:var(--do)}
.sl-ctl{display:flex;align-items:center;gap:6px}
.sl-ctl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--vien);background:#fff;font-weight:700}
.sl-ctl b{min-width:20px;text-align:center}
.x{border:0;background:transparent;color:var(--mo);font-size:18px;line-height:1;padding:2px 4px}
.x:hover{color:var(--do)}
.link{border:0;background:none;color:var(--nau);font-size:13px;padding:0;text-decoration:underline}
.cart-foot{border-top:1px solid var(--vien);padding:12px 16px;background:var(--kem);border-radius:0 0 var(--r) var(--r)}
.tong{display:flex;justify-content:space-between;font-size:14px;margin:3px 0}
.tong.lon{font-size:19px;font-weight:700;margin-top:6px}
.nut-hang{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nut-hang .btn{flex:1}
.trong-rong{color:var(--mo);text-align:center;padding:24px 8px;font-size:14px}
.mobile-bar{display:none}

/* Pha chế */
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pc-card{background:#fff;border-radius:var(--r);box-shadow:var(--bong);overflow:hidden;border-top:4px solid var(--cam)}
.pc-card.lau{border-top-color:var(--do)}
.pc-card .h{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--vien)}
.pc-card .h b{font-size:17px}
.pc-card .h small{color:var(--mo)}
.pc-mon{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px dashed var(--vien)}
.pc-mon .sl{font-size:20px;font-weight:700;color:var(--nau);min-width:34px}
.pc-mon .info{flex:1}
.pc-card .f{padding:10px 14px}

/* Hóa đơn */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border-radius:var(--r);box-shadow:var(--bong);padding:14px}
.tile small{color:var(--mo);font-size:12px;display:block;margin-bottom:4px}
.tile b{font-size:20px}
.bang{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--bong)}
.bang th,.bang td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--vien);font-size:14px}
.bang th{background:var(--kem-dam);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mo)}
.bang tr[data-act]{cursor:pointer}
.bang tr[data-act]:hover td{background:var(--kem)}
.r{text-align:right!important}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(43,33,24,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-box.rong{max-width:620px}
.modal-box h3{font-size:18px;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.khoan{border:1px solid var(--vien);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--kem)}
.khoan-hang{display:flex;gap:8px;align-items:center}
.khoan-hang>*{flex:1}
.nhanh{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.nhanh button{border:1px solid var(--vien);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px}
.thoi{margin-top:8px;font-weight:600;color:var(--xanh)}
.tom-tat{background:var(--kem);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.bang-chu{font-size:13px;color:var(--mo);margin-top:4px;line-height:1.4}
.bang-chu i{color:var(--chu)}

/* Thông báo, chờ */
/* Thông báo pha chế */
#tb-pc{position:fixed;bottom:20px;right:16px;flex-direction:column-reverse;z-index:85;display:flex;flex-direction:column;gap:10px;width:340px;max-width:calc(100vw - 24px);pointer-events:none}
.tb{pointer-events:auto;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(43,33,24,.25);border-left:6px solid var(--cam);padding:12px 12px 12px 14px;animation:tbVao .3s ease}
.tb.huy{border-left-color:var(--do)}
.tb.canh{border-left-color:var(--do);background:#FFF6F4}
.tb .tb-dau{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tb .tb-dau b{flex:1;font-size:15px}
.tb .tb-dau small{color:var(--mo);font-size:12px;white-space:nowrap}
.tb .tb-ic{width:28px;height:28px;border-radius:50%;background:var(--cam-nhat);color:var(--cam);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:rung 1s ease 2}
.tb.huy .tb-ic,.tb.canh .tb-ic{background:var(--do-nhat);color:var(--do)}
.tb .tb-ic svg{width:16px;height:16px}
.tb ul{margin:0 0 8px;padding:0;list-style:none;font-size:14px;line-height:1.5}
.tb ul i{color:var(--cam);font-size:12.5px}
.tb.huy ul{text-decoration:line-through;color:var(--mo)}
.tb .tb-nut{display:flex;gap:8px;justify-content:flex-end}
@keyframes tbVao{from{opacity:0;transform:translateX(30px)}}
@keyframes rung{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
.dem-tb{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--do);color:#fff;font-size:11px;font-weight:700;font-style:normal;margin-left:6px;vertical-align:1px}
#botnav button i{position:relative}
#botnav .dem-tb{position:absolute;top:-4px;right:2px;margin:0}
.pc-card.moi{animation:pcMoi 1.2s ease 3;border-top-color:var(--xanh)}
.pc-card .nhan-moi{background:var(--xanh);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
@keyframes pcMoi{50%{box-shadow:0 0 0 4px rgba(46,125,91,.35),var(--bong)}}
.pc-canh{background:var(--do-nhat);color:var(--do);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.pc-cai{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cong-tac{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--vien);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mo)}
.cong-tac.on{background:var(--xanh-nhat);border-color:#BFDCCB;color:var(--xanh)}
/* Yêu cầu của khách */
.tb.yc{border-left-color:var(--xanh)}
.tb.yc .tb-ic{background:var(--xanh-nhat);color:var(--xanh)}
.tb-gc{margin:-2px 0 8px;font-size:13px;color:var(--mo)}
.yc-dai{margin-bottom:6px}
.yc-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.yc-the{background:#fff;border-radius:14px;box-shadow:var(--bong);border-left:5px solid var(--xanh);padding:10px 12px}
.yc-the.khac{border-left-color:var(--cam)}
.yc-the .tb-dau{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.yc-the .tb-dau b{flex:1}
.yc-the .tb-dau small{color:var(--mo);font-size:12px}
.yc-the ul{margin:0 0 8px;padding:0;list-style:none;font-size:14px;line-height:1.5}
.yc-the ul i{color:var(--cam);font-size:12.5px}
.yc-the .tb-nut{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* In mã QR gọi món */
.qr-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;max-height:55vh;overflow-y:auto;padding:2px}
.qr-the{border:1px solid var(--vien);border-radius:14px;padding:12px;text-align:center;background:#fff}

.qr-in{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm}
.qr-in .qr-the{border:1.5px dashed #999;break-inside:avoid;padding:6mm 4mm}
.qr-in .qr-the img{max-width:45mm}
.qr-in .ten-q{font-size:13px;font-weight:600}
.qr-in .moi{font-size:12px;margin-top:2mm}
@media (max-width:900px){#tb-pc{top:60px;bottom:auto;right:12px;left:12px;width:auto;max-width:none;flex-direction:column}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chu);color:#fff;padding:12px 18px;border-radius:10px;z-index:80;max-width:90vw;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.loi{background:var(--do)}
#toast.ok{background:var(--xanh)}

.spin{width:38px;height:38px;border:4px solid var(--vien);border-top-color:var(--nau);border-radius:50%;animation:q .8s linear infinite}
@keyframes q{to{transform:rotate(360deg)}}

/* Mật khẩu, ghi nhớ, tài khoản */
.pw{position:relative}
.pw .input{padding-right:46px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mo);width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.pw-eye:hover{background:var(--kem-dam);color:var(--nau)}
.pw-eye svg{width:20px;height:20px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;margin:0;accent-color:var(--nau)}
.loi-text{color:var(--do);font-size:14px;min-height:20px;margin:8px 0}
.ghi-chu-nho{text-align:center;color:var(--mo);font-size:13px;margin:14px 0 0}
.phien-ban{text-align:center;color:#B9AC9E;font-size:11px;margin:8px 0 0}
.phien-ban.lech{color:var(--do);font-weight:600}
.logo img{width:76px;height:76px;object-fit:contain;border-radius:16px}
.user-btn{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#fff;text-align:right;padding:4px 6px;border-radius:10px;font-size:13px}
.user-btn:hover{background:rgba(255,255,255,.1)}
.user-btn .ten{color:#E8DCCD;line-height:1.3}
.user-btn .ten b{display:block;color:#fff}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.nut-cot{display:grid;gap:8px}
.cn-list{display:grid;gap:10px}
.cn-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--vien);background:#fff;border-radius:var(--r);padding:12px 14px}
.cn-item:hover,.cn-item.on{border-color:var(--nau);background:var(--kem)}
.muted{color:var(--mo);font-size:13px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--vien);margin-bottom:16px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mo);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.subtabs button.on{color:var(--nau);border-bottom-color:var(--nau)}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--bong);padding:20px}
.card h3{margin:4px 0 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
.hop-tk{border:1px dashed var(--vien);border-radius:10px;padding:14px;margin-top:10px;background:var(--kem)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
@media (max-width:900px){.bang th,.bang td{white-space:nowrap}}

/* Bàn & thực đơn trong quản trị */
.kv-card{background:#fff;border-radius:var(--r);box-shadow:var(--bong);padding:14px 16px;margin-bottom:14px}
.kv-card.ngung{opacity:.65}
.kv-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kv-head h3{margin:0;flex:1}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.ban-chip{border:1.5px solid var(--vien);background:var(--kem);border-radius:10px;padding:8px 12px;min-width:92px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ban-chip:hover{border-color:var(--nau)}
.ban-chip b{font-size:15px}
.ban-chip small{color:var(--mo);font-size:12px}
.ban-chip.ngung{opacity:.5;border-style:dashed}
.ban-chip.co-khach{background:var(--cam-nhat);border-color:#EBC08C}
.ban-chip.them{border-style:dashed;color:var(--nau);font-weight:600;justify-content:center;align-items:center}
.nhom-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.nhom-bar .chip small{opacity:.7;margin-left:4px}
.td-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.td-card{background:#fff;border:1px solid var(--vien);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.td-card:hover{border-color:var(--nau);box-shadow:var(--bong)}
.td-card .anh{aspect-ratio:4/3;background:var(--kem-dam);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--nau);overflow:hidden}
.td-card .anh img{width:100%;height:100%;object-fit:cover}
.td-card .nd{padding:10px 12px;display:flex;flex-direction:column;gap:3px}

.td-card.ngung{opacity:.55}
.anh-box{display:grid;grid-template-columns:180px 1fr;gap:16px;margin-bottom:6px}
.anh-xem{width:180px;aspect-ratio:4/3;border-radius:10px;background:var(--kem-dam);border:1px dashed var(--vien);display:flex;align-items:center;justify-content:center;color:var(--mo);font-size:13px;text-align:center;overflow:hidden}
.anh-xem img{width:100%;height:100%;object-fit:cover}
.qr-box{display:flex;gap:14px;align-items:center;margin-top:10px;background:#fff;border:1px solid var(--vien);border-radius:10px;padding:10px}
.qr-box img{width:150px;height:auto;border-radius:6px;flex-shrink:0}
.qr-box .muted b{color:var(--chu)}
@media (max-width:600px){.anh-box{grid-template-columns:1fr}.anh-xem{width:100%}.qr-box{flex-direction:column;align-items:flex-start}}

/* Màn hình chính: bàn (2/3) + ảnh cửa hàng (1/3) */
.man-chinh{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.mc-phai{position:sticky;top:72px}
.ach-khung{position:relative;border-radius:16px;overflow:hidden;height:calc(100vh - 100px);min-height:380px;background:var(--kem-dam);box-shadow:var(--bong)}
.ach-khung img{width:100%;height:100%;object-fit:cover;display:block}
.ach-chu{position:absolute;left:0;right:0;bottom:0;padding:56px 18px 16px;background:linear-gradient(rgba(30,20,12,0),rgba(30,20,12,.8));color:#fff;display:flex;flex-direction:column;gap:3px}
.ach-chu b{font-size:20px;line-height:1.25}
.ach-chu span,.ach-chu i{font-size:13px;opacity:.9}
.ach-trong{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mo);font-size:52px;padding:24px 20px 120px}
.ach-trong p{font-size:14px;margin:12px 0 0;line-height:1.7}
.ach-sua{border:1px dashed var(--vien);border-radius:12px;padding:14px;background:var(--kem);display:grid;grid-template-columns:150px 1fr;gap:16px;margin-bottom:14px}
.ach-xem{width:150px;height:200px;border-radius:10px;background:var(--kem-dam);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mo);font-size:12px;text-align:center}
.ach-xem img{width:100%;height:100%;object-fit:cover}
@media (max-width:900px){.man-chinh{grid-template-columns:minmax(0,1fr)}.mc-phai{display:none}}
@media (max-width:600px){.ach-sua{grid-template-columns:1fr}}

/* Báo cáo */
#v-baocao{--series:#B4652A;--series-nhat:#F3E3D6}
.bc-loc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bc-loc .input{width:auto}
.bc-ky{font-size:13px;color:var(--mo);margin:0 0 16px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--bong);padding:14px 16px}
.kpi small{display:block;color:var(--mo);font-size:12px;margin-bottom:4px}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.kpi.hero{grid-column:span 2}
.kpi.hero b{font-size:34px}
.kpi .delta{font-size:12px;margin-top:4px;color:var(--mo)}
.delta.tot{color:var(--xanh)}
.delta.xau{color:var(--do)}
.bc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.bc-card{background:#fff;border-radius:var(--r);box-shadow:var(--bong);padding:16px 18px;margin-bottom:16px;min-width:0}
.bc-grid .bc-card{margin-bottom:0}
.bc-card h3{margin:0 0 2px}
.bc-card .mo-ta{color:var(--mo);font-size:13px;margin:0 0 12px}
.bc-card .tieu-de{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.bc-card .tieu-de>div{flex:1;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart .cot path{fill:var(--series)}
.chart .cot rect{fill:transparent;cursor:default}
.chart .cot:hover rect{fill:rgba(111,78,55,.06)}
.chart .luoi{stroke:#EDE6DC;stroke-width:1}
.chart .truc{stroke:#CFC3B4;stroke-width:1}
.chart text{fill:var(--mo);font-size:11px;font-family:inherit}
#bc-tip{position:fixed;z-index:90;pointer-events:none;background:var(--chu);color:#fff;font-size:13px;line-height:1.45;padding:8px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:260px;opacity:0;transition:opacity .1s}
#bc-tip.hien{opacity:1}
.hbar{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px 12px;align-items:center;font-size:14px}
.hbar .nhan{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;background:var(--series-nhat);border-radius:999px;overflow:hidden}
.hbar .fill{height:100%;background:var(--series);border-radius:999px}
.hbar .gt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hbar .gt small{color:var(--mo);margin-left:6px}
.phan-tich{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.phan-tich li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
.phan-tich .ic{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--kem-dam);color:var(--nau)}
.phan-tich .tot .ic{background:var(--xanh-nhat);color:var(--xanh)}
.phan-tich .xau .ic{background:var(--do-nhat);color:var(--do)}
.bang.gon th,.bang.gon td{padding:8px 10px}
.bang.gon{box-shadow:none;border:1px solid var(--vien)}
.chip-nho{display:inline-block;background:var(--kem);border:1px solid var(--vien);border-radius:999px;padding:3px 10px;font-size:13px;margin:0 6px 6px 0}
@media (max-width:900px){.bc-grid{grid-template-columns:1fr}.kpi.hero{grid-column:auto}}

#print-area{display:none}

  body>*:not(#print-area){display:none!important}

.chi-mb,#botnav,.fab,.mb-dau,#gio-nen{display:none}
@media (max-width:900px){
  .chi-pc{display:none!important}

  /* Thanh điều hướng dưới cùng */

  #botnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;color:var(--mo);font-size:11px;font-weight:600;border-radius:10px;min-width:0}
  #botnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #botnav button i{display:flex;align-items:center;justify-content:center;width:46px;height:28px;border-radius:99px;transition:background .15s}
  #botnav button svg{width:21px;height:21px}
  #botnav button.on{color:var(--nau-dam)}
  #botnav button.on i{background:var(--kem-dam)}
  body[data-view="order"] #botnav{display:none}
  body[data-view="order"] main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  /* Sơ đồ bàn */
  .sdb-dau{margin-bottom:12px}
  .sdb-dau .btn{display:none}
  .sdb-tk{grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:#fff;border-radius:14px;box-shadow:var(--bong);margin-bottom:12px;overflow:hidden}
  .tk-o{box-shadow:none;border-radius:0;padding:10px 4px;flex-direction:column;gap:2px;text-align:center;justify-content:flex-start}
  .tk-o+.tk-o{border-left:1px solid var(--kem-dam)}
  .tk-o .ic,.tk-o .thanh{display:none}
  .tk-o>div{width:100%}
  .tk-o small{font-size:11px;white-space:normal;line-height:1.25;min-height:28px;display:flex;align-items:flex-end;justify-content:center}
  .tk-o b{font-size:16px}
  .tk-o b span{font-size:11px}
  .sdb-loc{position:sticky;top:52px;z-index:15;background:var(--kem);margin:0;padding:8px 0;box-shadow:-12px 0 0 var(--kem),12px 0 0 var(--kem);flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:8px}
  .sdb-loc .chips{flex:none}
  .sdb-loc .chip{padding:6px 12px;font-size:13px}
  .seg{display:flex}
  .seg button{flex:1;padding:7px 6px}
  .kv-tieu{margin:14px 0 10px}
  .ban-luoi{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .the{min-height:80px;padding:10px 11px 10px 15px;gap:4px;border-radius:14px}
  .the .ten{font-size:16px}
  .the .nghi{display:none}
  .the.khach .tien{font-size:16px}
  .pill{font-size:10px;padding:2px 7px}
  .the:hover{transform:none}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:35;align-items:center;gap:6px;background:var(--nau);color:#fff;border:0;border-radius:99px;padding:13px 18px;font-weight:600;box-shadow:0 6px 18px rgba(75,51,37,.35)}
  .fab svg{width:20px;height:20px}
  /* Gọi món */
  .order{grid-template-columns:minmax(0,1fr);gap:0}
  .menu-pane{background:transparent;box-shadow:none;padding:0}
  .menu-dau{position:sticky;top:52px;z-index:15;background:var(--kem);margin:-12px 0 8px;padding:10px 0 0;box-shadow:-12px 0 0 var(--kem),12px 0 0 var(--kem),0 1px 0 var(--vien)}
  .mb-dau{display:flex;align-items:center;gap:10px;margin-bottom:10px}

  .mb-dau .t{flex:1;min-width:0}
  .mb-dau b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mb-dau small{color:var(--mo);font-size:12px}
  .menu-dau .chips{padding:8px 0 10px}

  .sp{padding:7px;gap:5px;background:#fff;border-radius:12px}

  .sp .ten{font-size:13px}
  .sp .gia{font-size:13px}

<script>
/* LƯU Ý: Apps Script coi hai dấu gạch chéo liền nhau nằm ngoài dấu nháy là chú thích, kể cả bên trong template literal (dấu backtick).
   Đường link https và regex có hai gạch chéo phải đặt trong chuỗi nháy đơn/kép, hoặc viết dạng gạch chéo có thoát. */
/* ======================= TRẠNG THÁI & TIỆN ÍCH ======================= */
if (!Object.fromEntries) Object.fromEntries = it => { const o = {}; for (const [k, v] of it) o[k] = v; return o; };
const VT = {CHU_QUAN:'Chủ quán', QUAN_LY:'Quản lý', THU_NGAN:'Thu ngân', PHA_CHE:'Pha chế', PHUC_VU:'Phục vụ'};
const S = {token:null, phien:null, dm:null, view:null, hdMo:[], ct:null, ban:null, loaiDon:null, ghiChuDon:'',
  cho:[], nhom:'', tuKhoa:'', phaChe:[], ngayHD:null, dangTai:false, tt:null};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tien = n => (Math.round(+n || 0)).toLocaleString('vi-VN') + 'đ';
const co = ds => S.phien && ds.includes(S.phien.VAI_TRO);
const Q = {
  banHang: () => co([VT.CHU_QUAN, VT.QUAN_LY, VT.THU_NGAN, VT.PHUC_VU]),
  thanhToan: () => co([VT.CHU_QUAN, VT.QUAN_LY, VT.THU_NGAN]),
  huyHD: () => co([VT.CHU_QUAN, VT.QUAN_LY]),
  xemHD: () => co([VT.CHU_QUAN, VT.QUAN_LY, VT.THU_NGAN])
};
function thoiDiem(s){ return s ? new Date(String(s).replace(' ', 'T') + '+07:00') : new Date(); }
function phutTruoc(s){
  const m = Math.max(0, Math.round((Date.now() - thoiDiem(s)) / 60000));
  return m < 60 ? m + ' phút' : Math.floor(m / 60) + ' giờ ' + String(m % 60).padStart(2, '0');
}
function ngayHomNay(){
  const d = new Date(Date.now() + 7 * 3600e3); return d.toISOString().slice(0, 10);
}
function tenDon(h, tenBan){
  return h.LOAI_DON === 'Mang đi' ? 'Mang đi #' + String(h.MA_HOA_DON).slice(-4) : (tenBan || h.MA_BAN);
}

let toastT;
function toast(msg, loai){
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (loai || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', loai === 'loi' ? 4500 : 2500);
}
function busy(on){ $('#busy').classList.toggle('hidden', !on); }

function goi(ten, ...args){
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => {
      const m = (e && e.message) || String(e);
      if (m.includes('PHIEN_HET_HAN')) { veDangNhap(); toast('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.', 'loi'); }
      else if (m.includes('CAN_DOI_MAT_KHAU')) moDoiMatKhau(true);
      else if (m.includes('CHUA_CHON_CHI_NHANH')) moChonChiNhanh(true);
      rej(new Error(m));
    })[ten](...args);
  });
}
const api = (ten, ...args) => goi(ten, S.token, ...args);
const MA_LOI_DB = /PHIEN_HET_HAN|CAN_DOI_MAT_KHAU|CHUA_CHON_CHI_NHANH/;
const loiGon = e => String(e && e.message || e).replace(/^Error:\s{0,9}/, '');
const ICON_HIEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_AN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
function oMK(id, nhan, ac){
  return `<div class="field"><span>${esc(nhan)}</span><div class="pw"><input class="input" type="password" id="${id}" autocomplete="${ac}">
    <button type="button" class="pw-eye" data-act="hienMK" data-id="${id}" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">${ICON_HIEN}</button></div></div>`;
}
function hienMK(id, nut){
  const i = document.getElementById(id); if (!i) return;
  const hien = i.type === 'password';
  i.type = hien ? 'text' : 'password';
  nut = nut || document.querySelector(`.pw-eye[data-id="${id}"]`);
  if (nut) { nut.innerHTML = hien ? ICON_AN : ICON_HIEN; nut.title = nut.ariaLabel = hien ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'; nut.setAttribute('aria-label', nut.title); }
  i.focus(); const n = i.value.length; try { i.setSelectionRange(n, n); } catch (e) {}
}
/* Mã BIN theo danh sách của Ngân hàng Nhà nước; tên viết tắt dùng hiển thị */
const NGAN_HANG = [
  ['970436','Vietcombank'],['970415','VietinBank'],['970418','BIDV'],['970405','Agribank'],['970422','MB Bank'],
  ['970407','Techcombank'],['970416','ACB'],['970432','VPBank'],['970423','TPBank'],['970403','Sacombank'],
  ['970437','HDBank'],['970441','VIB'],['970443','SHB'],['970426','MSB'],['970448','OCB'],['970440','SeABank'],
  ['970431','Eximbank'],['970449','LPBank'],['970428','Nam A Bank'],['970409','Bac A Bank'],['970454','Viet Capital Bank'],
  ['970429','SCB'],['970452','KienlongBank'],['970425','ABBANK'],['970412','PVcomBank'],['970419','NCB'],['970427','VietABank'],
  ['970433','Vietbank'],['970438','BaoViet Bank'],['970430','PG Bank'],['970400','Saigonbank'],['970406','Vikki Bank (DongA)'],
  ['970414','MBV (OceanBank)'],['970444','VCBNeo (CBBank)'],['970408','GPBank'],['970446','Co-opBank'],['970424','Shinhan Bank'],
  ['970457','Woori Bank'],['970458','UOB'],['970410','Standard Chartered'],['970439','Public Bank'],['970442','Hong Leong Bank'],
  ['970434','Indovina Bank'],['970421','VRB'],['970459','CIMB']
];
function tenNganHang(bin){ const n = NGAN_HANG.find(x => x[0] === bin); return n ? n[1] : ''; }
function hoaKhongDau(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toUpperCase().trim(); }
/** Ảnh VietQR (img.vietqr.io). mau: compact2 | compact | qr_only | print */
function urlQR(o){
  if (!o.bin || !o.stk) return '';
  const q = new URLSearchParams();
  if (o.soTien > 0) q.set('amount', Math.round(o.soTien));
  if (o.noiDung) q.set('addInfo', o.noiDung);
  if (o.ten) q.set('accountName', hoaKhongDau(o.ten));
  return 'https:/' + '/img.vietqr.io/image/' + encodeURIComponent(o.bin) + '-' + encodeURIComponent(o.stk) + '-' + (o.mau || 'compact2') + '.png?' + q;
}
function coTKNganHang(){ const q = (S.dm && S.dm.thongTinQuan) || {}; return !!(q.MA_NGAN_HANG && q.SO_TAI_KHOAN); }
function qrQuan(soTien, maHD, mau){
  const q = (S.dm && S.dm.thongTinQuan) || {};
  return urlQR({bin: q.MA_NGAN_HANG, stk: q.SO_TAI_KHOAN, ten: q.CHU_TAI_KHOAN, soTien, noiDung: maHD ? String(maHD).replace(/[^A-Za-z0-9]/g, '') : '', mau});
}
function laCK(ma){
  const p = S.dm.phuongThuc.find(x => x.MA_PHUONG_THUC === ma);
  return ma === 'CK' || /chuy[eể]n\s*kho[aả]n/i.test(p ? p.TEN_PHUONG_THUC : '');
}
/** Ảnh Drive: lh3 lỗi thì thử link thumbnail, vẫn lỗi thì hiện chữ cái đầu */
function anhLoi(img){
  const m = img.src.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)/);
  if (m && !img.dataset.thu) { img.dataset.thu = '1'; img.src = 'https:/' + '/drive.google.com/thumbnail?id=' + m[1] + '&sz=w800'; return; }
  const p = img.parentNode; if (p) p.textContent = img.alt ? img.alt.charAt(0) : '☕';
}
function anhHtml(url, ten){ return url ? `<img src="${esc(url)}" alt="${esc(ten)}" loading="lazy" onerror="anhLoi(this)">` : esc(String(ten || '?').charAt(0)); }
function taiLaiDM(){ api('layDuLieuKhoiTao').then(d => { S.dm = d; }).catch(() => {}); }

function docLS(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function ghiLS(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
const KHO = {
  luu(token, ghiNho){
    try {
      const v = JSON.stringify({token, ghiNho: !!ghiNho});
      if (ghiNho) { localStorage.setItem('cafe_phien', v); sessionStorage.removeItem('cafe_phien'); }
      else { sessionStorage.setItem('cafe_phien', v); localStorage.removeItem('cafe_phien'); }
    } catch (e) {}
  },
  doc(){ try { return JSON.parse(localStorage.getItem('cafe_phien') || sessionStorage.getItem('cafe_phien') || 'null'); } catch (e) { return null; } },
  xoa(){ try { localStorage.removeItem('cafe_phien'); sessionStorage.removeItem('cafe_phien'); } catch (e) {} }
};

async function chay(fn, imLang){
  if (!imLang) busy(true);
  try { return await fn(); }
  catch (e) { if (!MA_LOI_DB.test(e.message)) toast(e.message.replace(/^Error:\s{0,9}/, ''), 'loi'); }
  finally { if (!imLang) busy(false); }
}

/* ======================= MODAL ======================= */
function moModal(html, cls){
  const b = $('#modal-box'); b.className = 'modal-box ' + (cls || ''); b.innerHTML = html;
  $('#modal').classList.remove('hidden');
}
function dongModal(){ $('#modal').classList.add('hidden'); $('#modal-box').innerHTML = ''; S.modalKhoa = false; S.formMo = false; }
function hoi(tieuDe, nhan, macDinh){
  return new Promise(res => {
    moModal(`<h3>${esc(tieuDe)}</h3><label class="field"><span>${esc(nhan)}</span>
      <input class="input" id="hoi-i" value="${esc(macDinh || '')}"></label>
      <div class="modal-actions"><button class="btn" id="hoi-h">Hủy</button><button class="btn primary" id="hoi-ok">Đồng ý</button></div>`);
    const i = $('#hoi-i'); i.focus(); i.select();
    $('#hoi-ok').onclick = () => { const v = i.value.trim(); dongModal(); res(v); };
    $('#hoi-h').onclick = () => { dongModal(); res(null); };
    i.onkeydown = e => { if (e.key === 'Enter') $('#hoi-ok').click(); };
  });
}
function xacNhan(tieuDe, noiDung, nut){
  return new Promise(res => {
    moModal(`<h3>${esc(tieuDe)}</h3><p>${esc(noiDung)}</p>
      <div class="modal-actions"><button class="btn" id="xn-h">Không</button><button class="btn primary" id="xn-ok">${esc(nut || 'Đồng ý')}</button></div>`);
    $('#xn-ok').onclick = () => { dongModal(); res(true); };
    $('#xn-h').onclick = () => { dongModal(); res(false); };
  });
}

/* ======================= ĐĂNG NHẬP ======================= */
function veDangNhap(){
  S.token = null; S.phien = null; S.dm = null; S.qt = null; S.ct = null; S.cho = [];
  KHO.xoa(); dongModal(); busy(false);
  PC.biet = null; YCB.biet = null; $('#tb-pc').innerHTML = ''; clearInterval(PC.nhac);
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  setTimeout(() => ($('#l-tk').value ? $('#l-mk') : $('#l-tk')).focus(), 50);
}

function apThongTinCongKhai(q){
  if (!q) return;
  ghiLS('cafe_quan', JSON.stringify({TEN_QUAN: q.TEN_QUAN || '', SLOGAN: q.SLOGAN || '', LOGO: q.LOGO || ''}));
  if (q.TEN_QUAN) { $('#l-ten').textContent = q.TEN_QUAN; document.title = q.TEN_QUAN; }
  if (q.SLOGAN) $('#l-sub').textContent = q.SLOGAN;
  if (q.LOGO) $('#l-logo').innerHTML = `<img src="${esc(q.LOGO)}" alt="" onerror="this.parentNode.textContent='☕'">`;
  else $('#l-logo').textContent = '☕';
}

$('#f-login').addEventListener('submit', async e => {
  e.preventDefault();
  const tk = $('#l-tk').value.trim(), mk = $('#l-mk').value, nho = $('#l-nho').checked;
  $('#l-loi').textContent = '';
  if (!tk || !mk) { $('#l-loi').textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu.'; (tk ? $('#l-mk') : $('#l-tk')).focus(); return; }
  const btn = $('#l-btn'); btn.disabled = true; btn.textContent = 'Đang kiểm tra tài khoản…';
  try {
    const kq = await goi('dangNhap', tk, mk, nho, docLS('cafe_cn') || '');
    S.token = kq.token; KHO.luu(kq.token, nho);
    ghiLS('cafe_nho', nho ? '1' : null); ghiLS('cafe_tendn', nho ? tk : null);
    $('#l-mk').value = '';
    if ($('#l-mk').type === 'text') hienMK('l-mk');
    await sauDangNhap(kq);
  } catch (err) {
    if (!MA_LOI_DB.test(err.message)) {
      let m = loiGon(err);
      if (/not found|không tìm thấy hàm|is not defined|is not a function/i.test(m)) m = 'Máy chủ chưa có chức năng đăng nhập mới (' + m + '). Hãy dán đủ file QuanTri.gs, Code.gs rồi triển khai Phiên bản mới.';
      $('#l-loi').textContent = m; $('#l-mk').select();
    }
  } finally { btn.disabled = false; btn.textContent = 'Đăng nhập'; }
});

/** Lỗi xảy ra khi chưa vào được ứng dụng: luôn quay về màn hình đăng nhập và hiện rõ lỗi (không để màn hình trắng). */
function hienLoiVaoApp(e){
  const m = loiGon(e);
  if (MA_LOI_DB.test(m)) return;
  if (!$('#app').classList.contains('hidden')) { toast(m, 'loi'); return; }
  dongModal(); busy(false);
  $('#login').classList.remove('hidden');
  $('#l-loi').textContent = 'Không vào được ứng dụng: ' + m;
}
/* Lưới an toàn: nếu không có màn hình nào hiện (không đăng nhập, không ứng dụng, không hộp thoại, không đang tải) thì hiện lại đăng nhập */
setInterval(() => {
  const an = id => $(id).classList.contains('hidden');
  if (an('#login') && an('#app') && an('#modal') && an('#busy')) {
    $('#login').classList.remove('hidden');
    if (!$('#l-loi').textContent) $('#l-loi').textContent = 'Không tải được dữ liệu. Vui lòng đăng nhập lại.';
  }
}, 1500);
window.addEventListener('error', e => { if ($('#app').classList.contains('hidden')) hienLoiVaoApp(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { if ($('#app').classList.contains('hidden')) hienLoiVaoApp(e.reason); });

async function sauDangNhap(kq){
  if (!kq || !kq.phien) throw new Error('Máy chủ không trả về thông tin đăng nhập. Hãy chạy hàm kiemTraHeThong trong Apps Script.');
  S.phien = kq.phien; if (kq.chiNhanh) S.dsCN = kq.chiNhanh;
  if (S.phien.DOI_MAT_KHAU) return moDoiMatKhau(true);
  if (!S.phien.MA_CHI_NHANH) return moChonChiNhanh(true);
  await vaoUngDung(kq.duLieu);
}

async function vaoUngDung(duLieu){
  if (!duLieu) { const b = $('#l-btn'); if (b && b.disabled) b.textContent = 'Đang tải dữ liệu…'; }
  S.dm = duLieu || await api('layDuLieuKhoiTao');
  if (!S.dm || !S.dm.phien) throw new Error('Máy chủ không trả về dữ liệu bán hàng. Hãy chạy hàm kiemTraHeThong trong Apps Script.');
  PC.biet = null; PC.moi.clear(); PC.canhBao.clear(); $('#tb-pc').innerHTML = ''; YCB.biet = null; S.yc = [];
  S.phien = S.dm.phien; S.ct = null; S.cho = []; S.qt = null; S.ngayHD = null; S.hdNgayKq = null; S.bc = null; S.anhCH = null;
  S.hdMo = S.dm.hdMo || []; S.hdMoMoi = !!S.dm.hdMo; /* vừa có danh sách bàn → không cần gọi máy chủ lần nữa */
  if (S.dm.thongTinQuan) apThongTinCongKhai(S.dm.thongTinQuan);
  veAnhCuaHang();
  if (S.phien.MA_CHI_NHANH) ghiLS('cafe_cn', S.phien.MA_CHI_NHANH);
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  capNhatHeader();
  const tabs = [];
  if (S.phien.VAI_TRO !== VT.PHA_CHE) tabs.push(['ban', 'Sơ đồ bàn']);
  tabs.push(['phache', 'Pha chế']);
  if (Q.xemHD()) tabs.push(['hoadon', 'Biên lai']);
  if (co([VT.CHU_QUAN, VT.QUAN_LY])) tabs.push(['baocao', 'Báo cáo'], ['quantri', 'Quản trị']);
  $('#h-nav').innerHTML = tabs.map(t => `<button data-act="tab" data-id="${t[0]}">${t[1]}</button>`).join('');
  const tenNgan = {ban: 'Bàn', phache: 'Pha chế', hoadon: 'Biên lai', baocao: 'Báo cáo', quantri: 'Quản trị'};
  $('#botnav').innerHTML = tabs.map(t => `<button data-act="tab" data-id="${t[0]}"><i>${IC_TAB[t[0]]}</i><span>${tenNgan[t[0]]}</span></button>`).join('');
  doiView(tabs[0][0]);
  if (tabs[0][0] !== 'phache' && nhanTB()) kiemTraPhaChe(true);
  else if (canYC()) kiemTraPhaChe(true, true);
}

function capNhatHeader(){
  const q = (S.dm && S.dm.thongTinQuan) || {};
  $('#h-brand').innerHTML = (q.LOGO ? `<img class="brand-logo" src="${esc(q.LOGO)}" alt="" onerror="this.replaceWith('☕')">` : '<span class="brand-icon">☕</span>') +
    `<span class="brand-text"><b>${esc(q.TEN_QUAN || 'Quản lý quán cafe')}</b><small>${esc(S.phien.TEN_CHI_NHANH)}</small></span>`;
  $('#h-brand').title = (q.TEN_QUAN || '') + ' – ' + S.phien.TEN_CHI_NHANH;
  document.title = q.TEN_QUAN || 'Quản lý quán cafe';
  const ten = S.phien.TEN_NHAN_VIEN || '';
  $('#h-user').innerHTML = `<span class="ten"><b>${esc(ten)}</b>${esc(S.phien.VAI_TRO)}</span>
    <span class="avatar">${esc((ten.trim().split(/\s+/).pop() || '?').charAt(0).toUpperCase())}</span>`;
}

function dangXuat(){
  const t = S.token;

}

function moDoiMatKhau(batBuoc){
  moModal(`<h3>${batBuoc ? '🔑 Đặt mật khẩu mới' : 'Đổi mật khẩu'}</h3>
    ${batBuoc ? '<p class="muted">Tài khoản đang dùng mật khẩu tạm do quản lý cấp. Vui lòng đặt mật khẩu riêng để tiếp tục.</p>' : ''}
    <form id="f-doimk" novalidate>
      <input type="text" name="username" autocomplete="username" value="${esc(S.phien ? S.phien.TEN_DANG_NHAP : '')}" hidden>
      ${oMK('mk-cu', batBuoc ? 'Mật khẩu tạm hiện tại' : 'Mật khẩu hiện tại', 'current-password')}
      ${oMK('mk-moi', 'Mật khẩu mới (ít nhất 6 ký tự)', 'new-password')}
      ${oMK('mk-lai', 'Nhập lại mật khẩu mới', 'new-password')}
      <div class="loi-text" id="mk-loi"></div>
      <div class="modal-actions">${batBuoc ? '<button type="button" class="btn" data-act="dangXuat">Đăng xuất</button>' : '<button type="button" class="btn" data-act="dongModal">Hủy</button>'}
        <button class="btn primary" type="submit">Lưu mật khẩu</button></div>
    </form>`);
  S.modalKhoa = !!batBuoc; S.formMo = true;
  $('#mk-cu').focus();
  $('#f-doimk').onsubmit = async e => {
    e.preventDefault();
    const cu = $('#mk-cu').value, moi = $('#mk-moi').value, lai = $('#mk-lai').value, loi = $('#mk-loi');
    if (!cu) return loi.textContent = 'Nhập mật khẩu hiện tại.';
    if (moi.length < 6) return loi.textContent = 'Mật khẩu mới phải có ít nhất 6 ký tự.';
    if (moi !== lai) return loi.textContent = 'Hai lần nhập mật khẩu mới không khớp.';
    if (moi === cu) return loi.textContent = 'Mật khẩu mới phải khác mật khẩu hiện tại.';
    loi.textContent = ''; busy(true);
    try {
      const kq = await api('doiMatKhau', cu, moi);
      dongModal();
      toast('Đã đổi mật khẩu. Các thiết bị khác đã được đăng xuất.', 'ok');
      if (batBuoc) await sauDangNhap(kq); else Object.assign(S.phien, kq.phien);
    } catch (err) {
      if (document.body.contains(loi)) { if (!MA_LOI_DB.test(err.message)) loi.textContent = loiGon(err); }
      else hienLoiVaoApp(err);
    }
    finally { busy(false); }
  };
}

async function moChonChiNhanh(batBuoc){
  if (!S.dsCN || !S.dsCN.length) {
    try { const kq = await api('layPhienHienTai'); S.dsCN = kq.chiNhanh || []; } catch (e) { hienLoiVaoApp(e); return; }
  }
  if (!S.dsCN.length) { hienLoiVaoApp(new Error('Không có chi nhánh nào đang hoạt động (bảng DM_CHINHANH).')); return;
  }
  moModal(`<h3>Chọn chi nhánh làm việc</h3>
    <div class="cn-list">${S.dsCN.map(c => `<button class="cn-item ${S.phien && S.phien.MA_CHI_NHANH === c.MA_CHI_NHANH ? 'on' : ''}" data-act="chonCN" data-id="${esc(c.MA_CHI_NHANH)}">
      <b>${esc(c.TEN_CHI_NHANH)}</b><span class="muted">${esc(c.DIA_CHI || c.MA_CHI_NHANH)}</span></button>`).join('')}</div>
    <div class="modal-actions">${batBuoc ? '<button class="btn" data-act="dangXuat">Đăng xuất</button>' : '<button class="btn" data-act="dongModal">Hủy</button>'}</div>`);
  S.modalKhoa = !!batBuoc;
}

async function chonCN(ma){
  if (S.view === 'order' && S.cho.length && !(await xacNhan('Bỏ món chưa gửi?', 'Các món mới chưa gửi sẽ bị bỏ khi đổi chi nhánh.', 'Tiếp tục'))) return;
  busy(true);
  try {
    const kq = await api('doiChiNhanh', ma);
    S.phien = kq.phien; S.dsCN = kq.chiNhanh || S.dsCN;
    dongModal(); await vaoUngDung(kq.duLieu);
    toast('Đang làm việc tại ' + kq.phien.TEN_CHI_NHANH, 'ok');
  } catch (e) { hienLoiVaoApp(e); }
  finally { busy(false); }
}

/* ======================= ĐIỀU HƯỚNG ======================= */
function doiView(v){
  S.view = v;
  ['ban', 'order', 'phache', 'hoadon', 'baocao', 'quantri'].forEach(x => $('#v-' + x).classList.toggle('hidden', x !== v));
  document.querySelectorAll('#h-nav button, #botnav button').forEach(b => b.classList.toggle('on', b.dataset.id === (v === 'order' ? 'ban' : v)));
  document.body.dataset.view = v; S.gioMo = false;
  window.scrollTo(0, 0);
  if (v === 'ban') taiBan();
  if (v === 'phache') taiPhaChe();
  if (v === 'hoadon') taiHoaDonNgay();
  if (v === 'quantri') taiQuanTri();
  if (v === 'baocao') taiBaoCao();
}

  if (S.hdMoMoi) { S.hdMoMoi = false; renderBan(); return; }
  if (!imLang) renderBan();
  await chay(async () => { S.hdMo = await api('layTrangThaiBan'); if (S.view === 'ban') renderBan(); }, true);
}

function renderBan(){
  if (!S.locBan) S.locBan = {kv: '', tt: ''};
  const L = S.locBan;
  const mo = {}; S.hdMo.forEach(h => { if (h.LOAI_DON === 'Tại bàn') mo[h.MA_BAN] = h; });
  const mangDi = S.hdMo.filter(h => h.LOAI_DON === 'Mang đi');
  const tongBan = S.dm.ban.length, banCo = S.dm.ban.filter(b => mo[b.MA_BAN]).length;
  const tamTinh = S.hdMo.reduce((a, h) => a + (+h.TONG_THANH_TOAN || 0) - (+h.DA_THANH_TOAN || 0), 0);
  const tyLe = tongBan ? banCo / tongBan : 0;
  if (L.kv && L.kv !== '__MD' && !S.dm.khuVuc.some(k => k.MA_KHU_VUC === L.kv)) L.kv = '';

  const gioNay = new Date(Date.now() + 7 * 3600e3);
  const thuNay = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'][gioNay.getUTCDay()];
  let html = `<div class="sdb-dau"><div><h2>Sơ đồ bàn</h2>
      <div class="phu">${esc(S.phien.TEN_CHI_NHANH)} · ${thuNay}, ${ngayVN(ngayHomNay())}</div></div>
    <div class="gian"></div>
    ${Q.banHang() ? '<button class="btn primary" data-act="moMangDi">+ Đơn mang đi</button>' : ''}</div>
    <div class="sdb-tk">
      <div class="tk-o"><span class="ic cam">${IC.nguoi}</span><div style="flex:1;min-width:0"><small>Bàn có khách</small><b>${banCo}<span> / ${tongBan}</span></b>
        <div class="thanh"><i style="width:${Math.round(tyLe * 100)}%"></i></div></div></div>
      <div class="tk-o"><span class="ic xanh">${IC.ban}</span><div><small>Bàn trống</small><b>${tongBan - banCo}</b></div></div>
      <div class="tk-o"><span class="ic tim">${IC.tui}</span><div><small>Đơn mang đi</small><b>${mangDi.length}</b></div></div>
      <div class="tk-o"><span class="ic nau">${IC.tien}</span><div style="min-width:0"><small>Tạm tính đang phục vụ</small><b>${tien(tamTinh)}</b></div></div>
    </div>
    <div class="sdb-loc"><div class="chips">
      ${[{MA_KHU_VUC: '', TEN_KHU_VUC: 'Tất cả khu vực'}].concat(S.dm.khuVuc).map(k => `<button class="chip ${L.kv === k.MA_KHU_VUC ? 'on' : ''}" data-act="locKV" data-id="${esc(k.MA_KHU_VUC)}">${esc(k.TEN_KHU_VUC)}</button>`).join('')}
      <button class="chip ${L.kv === '__MD' ? 'on' : ''}" data-act="locKV" data-id="__MD">Mang đi${mangDi.length ? ' (' + mangDi.length + ')' : ''}</button></div>
      <div class="seg">${[['', 'Tất cả'], ['trong', 'Trống'], ['khach', 'Có khách']].map(x => `<button class="${L.tt === x[0] ? 'on' : ''}" data-act="locTT" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>
    </div>`;
  const ycBan = {}; (S.yc || []).forEach(y => { (ycBan[y.MA_BAN] = ycBan[y.MA_BAN] || []).push(y); });
  if ((S.yc || []).length) html += `<div class="yc-dai"><div class="kv-tieu" style="margin-top:4px"><h3>🛎 Khách yêu cầu</h3><span class="dem">${S.yc.length} đang chờ</span><span class="vach"></span></div>
    <div class="yc-luoi">${S.yc.map(y => `<div class="yc-the ${y.LOAI === 'Gọi món' ? '' : 'khac'}"><div class="tb-dau"><b>${esc(y.TEN_BAN)} · ${esc(y.LOAI)}</b><small>${thoiGianMo(y.THOI_GIAN)}</small></div>
      ${moTaYC(y)}${y.GHI_CHU || y.TEN_KHACH ? `<p class="tb-gc">${y.TEN_KHACH ? '<b>' + esc(y.TEN_KHACH) + '</b>' : ''}${y.TEN_KHACH && y.GHI_CHU ? ': ' : ''}${esc(y.GHI_CHU)}</p>` : ''}
      <div class="tb-nut">${nutYC(y)}</div></div>`).join('')}</div></div>`;

  const theBan = b => {
    const h = mo[b.MA_BAN];
    const goi = ycBan[b.MA_BAN] ? '<span class="pill goi">🛎 Khách gọi</span>' : '';
    if (!h) return `<button class="the ban ${goi ? 'goi' : ''}" data-act="moBan" data-id="${esc(b.MA_BAN)}">
        <div class="dong1"><span class="ten">${esc(b.TEN_BAN)}</span>${goi || '<span class="pill trong">Trống</span>'}</div>
        ${b.SO_CHO ? `<div class="meta">${IC.nguoi}${esc(b.SO_CHO)} chỗ</div>` : ''}
        <div class="nghi">${IC.ban}</div></button>`;
    const m = soPhut(h.NGAY_TAO), daTra = +h.DA_THANH_TOAN || 0;
    return `<button class="the ban khach co-khach ${m >= 90 ? 'lau' : ''} ${goi ? 'goi' : ''}" data-act="moBan" data-id="${esc(b.MA_BAN)}">
        <div class="dong1"><span class="ten">${esc(b.TEN_BAN)}</span>${goi || (daTra ? '<span class="pill mot-phan">Trả 1 phần</span>' : '<span class="pill khach">Có khách</span>')}</div>
        <div class="meta tg" title="Mở lúc ${esc(String(h.NGAY_TAO).slice(11, 16))}">${IC.dongHo}${thoiGianMo(h.NGAY_TAO)}${b.SO_CHO ? ' · ' + esc(b.SO_CHO) + ' chỗ' : ''}</div>
        <div class="tien">${tien((+h.TONG_THANH_TOAN || 0) - daTra)}</div></button>`;
  };
  const locTT = b => !L.tt || (L.tt === 'khach') === !!mo[b.MA_BAN];
  const nhom = S.dm.khuVuc.map(k => ({ten: k.TEN_KHU_VUC, ma: k.MA_KHU_VUC, bans: S.dm.ban.filter(b => b.MA_KHU_VUC === k.MA_KHU_VUC)}));
  const banLe = S.dm.ban.filter(b => !S.dm.khuVuc.some(k => k.MA_KHU_VUC === b.MA_KHU_VUC));
  if (banLe.length) nhom.push({ten: 'Khác', ma: '__KHAC', bans: banLe});
  let coBan = false;
  if (L.kv !== '__MD') nhom.forEach(g => {
    if (L.kv && g.ma !== L.kv) return;
    const hien = g.bans.filter(locTT);
    if (!hien.length) return;
    coBan = true;
    const co = g.bans.filter(b => mo[b.MA_BAN]).length;
    html += `<div class="kv-tieu"><h3>${esc(g.ten)}</h3><span class="dem">${co}/${g.bans.length} có khách</span><span class="vach"></span></div>
      <div class="ban-luoi">${hien.map(theBan).join('')}</div>`;
  });
  if (L.kv !== '__MD' && !coBan) html += `<div class="sdb-rong" style="margin-top:16px">${tongBan ? 'Không có bàn nào phù hợp bộ lọc.' : 'Chi nhánh chưa có bàn. Thêm bàn trong Quản trị → Bàn & khu vực.'}</div>`;

  if (!L.kv || L.kv === '__MD') {
    if (L.tt !== 'trong') {

/** Ảnh cửa hàng bên phải màn hình chính (cấu hình trong Quản trị → Thông tin quán) */
function veAnhCuaHang(){
  const o = $('#mc-phai'); if (!o || !S.dm) return;
  const q = S.dm.thongTinQuan || {}, p = S.phien;
  const chu = `<div class="ach-chu"><b>${esc(q.TEN_QUAN || 'Quán cafe')}</b>
    <span>${esc(p.TEN_CHI_NHANH)}${p.DIA_CHI ? ' · ' + esc(p.DIA_CHI) : ''}</span>${q.SLOGAN ? `<i>${esc(q.SLOGAN)}</i>` : ''}</div>`;
  o.innerHTML = `<div class="ach-khung">${q.ANH_CUA_HANG
    ? `<img src="${esc(q.ANH_CUA_HANG)}" alt="${esc(q.TEN_QUAN || '')}" onerror="anhCuaHangLoi(this)">`
    : `<div class="ach-trong">☕<p>${co([VT.CHU_QUAN]) ? 'Chưa có ảnh cửa hàng.<br><button class="btn nho" data-act="denThongTinQuan">Thêm ảnh trong Quản trị</button>' : 'Chào mừng quý khách'}</p></div>`}${chu}</div>`;
}
function anhCuaHangLoi(img){
  const m = img.src.match(/lh3[.]googleusercontent[.]com[/]d[/]([\w-]+)/);
  if (m && !img.dataset.thu) { img.dataset.thu = '1'; img.src = 'https:' + '\/\/drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600'; return; }
  const k = img.parentNode; if (k) img.replaceWith(Object.assign(document.createElement('div'), {className: 'ach-trong', innerHTML: '☕<p>Không tải được ảnh cửa hàng.</p>'}));
}

/** Đọc số tiền bằng chữ tiếng Việt (chuẩn hóa đơn): 1.005.000 → "Một triệu không trăm lẻ năm nghìn đồng" */
function docSoTien(n){
  n = Math.round(Math.abs(+n || 0));
  if (!n) return 'Không đồng';
  const so = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  const donVi = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const docBa = (x, dauTien) => {
    const tr = Math.floor(x / 100), ch = Math.floor(x / 10) % 10, dv = x % 10, kq = [];
    if (tr || !dauTien) kq.push(so[tr] + ' trăm');
    if (ch === 0) { if (dv && kq.length) kq.push('lẻ'); }
    else if (ch === 1) kq.push('mười');
    else kq.push(so[ch] + ' mươi');
    if (dv) kq.push(dv === 1 && ch >= 2 ? 'mốt' : dv === 4 && ch >= 2 ? 'tư' : dv === 5 && ch >= 1 ? 'lăm' : so[dv]);
    return kq.join(' ');
  };
  const nhom = [];
  while (n > 0) { nhom.push(n % 1000); n = Math.floor(n / 1000); }
  const phan = [];
  for (let i = nhom.length - 1; i >= 0; i--) {
    if (!nhom[i]) continue;
    phan.push(docBa(nhom[i], i === nhom.length - 1) + donVi[i]);
  }
  const s = phan.join(' ') + ' đồng';
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const bangChu = n => `<div class="bang-chu">Bằng chữ: <i>${esc(docSoTien(n))}</i></div>`;

/* ======================= THANH TOÁN ======================= */
function giamHienTai(){
  const g = S.tt.giam, tong = +S.ct.hoaDon.TONG_TIEN_HANG;
  let loai = '', gt = 0;
  if (g.kieu === 'CT') { const ct = S.dm.giamGia.find(x => x.MA_GIAM_GIA === g.ma); if (ct) { loai = ct.LOAI_GIAM; gt = ct.GIA_TRI; } }
  else if (g.kieu === 'PT') { loai = 'Phần trăm'; gt = +g.giaTri || 0; }
  else if (g.kieu === 'TIEN') { loai = 'Số tiền'; gt = +g.giaTri || 0; }
  if (loai === 'Phần trăm') return Math.round(tong * Math.min(100, Math.max(0, gt)) / 100);
  if (loai === 'Số tiền') return Math.min(tong, Math.max(0, Math.round(gt)));
  return 0;
}
function soTT(){
  const hd = S.ct.hoaDon, daTra = +hd.DA_THANH_TOAN || 0;
  const khoa = daTra > 0;
  const giam = khoa ? +hd.TIEN_GIAM_GIA : giamHienTai();
  const phaiTra = +hd.TONG_TIEN_HANG - giam;
  return {tong: +hd.TONG_TIEN_HANG, giam, phaiTra, daTra, conLai: phaiTra - daTra, khoa};
}

function moThanhToan(){
  if (S.cho.length) return toast('Vui lòng gửi các món mới trước khi thanh toán.', 'loi');
  const hd = S.ct.hoaDon;
  let giam = {kieu: '', ma: '', giaTri: ''};
  if (hd.MA_GIAM_GIA === 'GIAM_TAY') giam = {kieu: hd.LOAI_GIAM === 'Phần trăm' ? 'PT' : 'TIEN', ma: '', giaTri: hd.GIA_TRI_GIAM};
  else if (hd.MA_GIAM_GIA) giam = {kieu: 'CT', ma: hd.MA_GIAM_GIA, giaTri: ''};
  S.tt = {giam, khoan: [], kh: {sdt: '', ten: ''}};
  const ptCK = S.dm.phuongThuc.find(p => laCK(p.MA_PHUONG_THUC)) || S.dm.phuongThuc[0] || {};
  S.tt.khoan.push({pt: ptCK.MA_PHUONG_THUC, soTien: 0, khachDua: ''}); /* mặc định: Chuyển khoản */
  S.tt.khoan[0].soTien = soTT().conLai;
  renderThanhToan();
}

    `<option value="PT" ${S.tt.giam.kieu === 'PT' ? 'selected' : ''}>Giảm tay theo %</option>
     <option value="TIEN" ${S.tt.giam.kieu === 'TIEN' ? 'selected' : ''}>Giảm tay số tiền</option>`;
  const optPT = ma => S.dm.phuongThuc.map(p => `<option value="${esc(p.MA_PHUONG_THUC)}" ${p.MA_PHUONG_THUC === ma ? 'selected' : ''}>${esc(p.TEN_PHUONG_THUC)}</option>`).join('');
  const khoanHtml = S.tt.khoan.map((k, i) => {
    const tm = k.pt === 'TM';
    return `<div class="khoan"><div class="khoan-hang">

function capNhatSoTT(){
  const n = soTT();
  const g = $('#tt-giam'); if (g) g.textContent = '−' + tien(n.giam);
  const c = $('#tt-conlai'); if (c) c.textContent = tien(n.conLai);
  const chu = $('#tt-chu'); if (chu) chu.innerHTML = bangChu(n.conLai);
  let tong = 0;
  S.tt.khoan.forEach((k, i) => {
    tong += +k.soTien || 0;
    const t = $('#thoi-' + i);
    const qr = $('#qr-' + i);
    if (qr) { clearTimeout(qr._t); qr._t = setTimeout(() => { if (!S.ct || !S.tt || !document.body.contains(qr)) return; const u = qrQuan(k.soTien, S.ct.hoaDon.MA_HOA_DON); if (qr.src !== u) qr.src = u; }, 500); }
    if (t) { const kd = +k.khachDua || 0; t.textContent = kd ? (kd >= k.soTien ? 'Tiền thối lại: ' + tien(kd - k.soTien) : 'Khách đưa chưa đủ') : ''; t.style.color = kd && kd < k.soTien ? 'var(--do)' : ''; }
  });
  const loi = $('#tt-loi');
  if (loi) loi.textContent = tong > n.conLai ? `Tổng ${tien(tong)} vượt quá số cần thu.` : tong < n.conLai ? `Còn thiếu ${tien(n.conLai - tong)} (sẽ ghi nhận thanh toán một phần).` : '';
}

document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.tt; if (!k || !S.tt) return;
  const i = +el.dataset.i;
  if (k === 'soTien') S.tt.khoan[i].soTien = Math.round(+el.value || 0);

  else if (k === 'giaTriGiam') { S.tt.giam.giaTri = el.value; if (S.tt.khoan.length === 1) { S.tt.khoan[0].soTien = soTT().conLai; const ip = document.querySelector('[data-tt="soTien"][data-i="0"]'); if (ip) ip.value = S.tt.khoan[0].soTien; } }
  else if (k === 'sdt') S.tt.kh.sdt = el.value;
  else if (k === 'tenKH') S.tt.kh.ten = el.value;

});
document.addEventListener('change', e => {

  else if (k === 'sdt' && S.tt.kh.sdt.replace(/\D/g, '').length >= 9) {

function xacNhanThanhToan(){
  const n = soTT();
  const khoan = S.tt.khoan.filter(k => +k.soTien > 0);
  const tong = khoan.reduce((a, k) => a + +k.soTien, 0);
  if (tong > n.conLai) return toast('Tổng thanh toán vượt quá số cần thu.', 'loi');
  if (!khoan.length && n.conLai > 0) return toast('Nhập số tiền thanh toán.', 'loi');
  if (khoan.some(k => k.khachDua !== '' && +k.khachDua < +k.soTien)) return toast('Tiền khách đưa chưa đủ.', 'loi');
  const g = S.tt.giam;
  const giamGia = n.khoa ? null : g.kieu === 'CT' ? {maGiamGia: g.ma}
    : g.kieu === 'PT' ? {loai: 'Phần trăm', giaTri: +g.giaTri || 0}
    : g.kieu === 'TIEN' ? {loai: 'Số tiền', giaTri: +g.giaTri || 0} : null;
  chay(async () => {
    const kq = await api('thanhToan', S.ct.hoaDon.MA_HOA_DON, {
      giamGia, khachHang: S.tt.kh.sdt ? {soDienThoai: S.tt.kh.sdt, ten: S.tt.kh.ten} : null,
      khoanThanhToan: khoan.map(k => ({maPhuongThuc: k.pt, soTien: +k.soTien, tienKhachDua: +k.khachDua || 0}))
    });
    S.ct = kq; S.tt = null;
    if (kq.hoanTat) {
      moModal(`<h3>✅ Thanh toán thành công</h3>
        <div class="tom-tat"><div class="tong lon"><span>Đã thu</span><span>${tien(kq.hoaDon.TONG_THANH_TOAN)}</span></div>${bangChu(kq.hoaDon.TONG_THANH_TOAN)}
        ${kq.tienThoi ? `<div class="tong lon" style="color:var(--xanh)"><span>Tiền thối</span><span>${tien(kq.tienThoi)}</span></div>` : ''}</div>

    } else {
      dongModal(); renderCart(); toast('Đã ghi nhận thanh toán một phần.', 'ok');
    }
  });
}

/** Logo trên biên lai: ảnh Drive lỗi thì thử link thumbnail, vẫn lỗi thì bỏ logo và căn giữa phần đầu như cũ */
function logoBillLoi(img){
  const m = img.src.match(/lh3[.]googleusercontent[.]com[/]d[/]([\w-]+)/);
  if (m && !img.dataset.thu) { img.dataset.thu = '1'; img.src = 'https:' + '\/\/drive.google.com/thumbnail?id=' + m[1] + '&sz=w400'; return; }
  const dau = img.closest('.bill-dau'); img.remove(); if (dau) dau.classList.add('khong-logo');
}

/* ======================= PHA CHẾ ======================= */
/* ---------- Thông báo & cảnh báo cho quầy pha chế ---------- */
const PC = {dangXong: new Set(), biet: null, huyBiet: new Set(), moi: new Set(), canhBao: new Set(), dangGoi: false, timer: null, nhac: null};
const PHUT_CANH_BAO = 10;
const ICON_CHUONG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
/** Máy này có nhận thông báo pha chế không: vai trò Pha chế luôn nhận; vai trò khác bật/tắt riêng từng máy */
function nhanTB(){
  if (!S.phien || !S.phien.MA_CHI_NHANH) return false;
  if (S.phien.VAI_TRO === VT.PHA_CHE) return docLS('cafe_tb_pc') !== '0';
  return docLS('cafe_tb_pc') === '1';
}
const coAmThanh = () => docLS('cafe_tb_am') !== '0';
let AC = null;
function moAmThanh(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
document.addEventListener('pointerdown', moAmThanh, {passive: true});
document.addEventListener('keydown', moAmThanh);
function chuong(loai){
  if (!coAmThanh()) return;
  try {
    moAmThanh(); if (!AC) return;
    const notes = loai === 'huy' ? [[523, 0], [392, .18]] : loai === 'canh' ? [[880, 0], [880, .22], [880, .44]] : [[784, 0], [1047, .16], [1319, .32]];
    notes.forEach(([f, t]) => {
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + t;
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      o.start(t0); o.stop(t0 + 0.55);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(loai === 'canh' ? [300, 120, 300, 120, 300] : [200, 100, 200]); } catch (e) {}
}
function gioPhut(s){ return String(s || '').slice(11, 16) || new Date(Date.now() + 7 * 3600e3).toISOString().slice(11, 16); }
function hienTB(loai, tieuDe, mon, maHD){
  const o = $('#tb-pc'); if (!o) return;
  const el = document.createElement('div');
  el.className = 'tb ' + (loai === 'moi' ? '' : loai);
  el.innerHTML = `<div class="tb-dau"><span class="tb-ic">${ICON_CHUONG}</span><b>${tieuDe}</b><small>${gioPhut()}</small></div>
    ${typeof mon === 'string' ? mon : mon.length ? `<ul>${mon.map(m => `<li><b>${esc(m.SO_LUONG)}×</b> ${esc(m.TEN_SAN_PHAM)}${m.GHI_CHU ? ` <i>(${esc(m.GHI_CHU)})</i>` : ''}</li>`).join('')}</ul>` : ''}
    <div class="tb-nut"><button class="btn nho" data-act="tbDong">Đã biết</button>${S.view !== 'phache' ? '<button class="btn nho primary" data-act="tbXem">Mở quầy pha chế</button>' : ''}</div>`;
  if (maHD) el.dataset.hd = maHD;
  o.prepend(el);
  while (o.children.length > 4) o.lastChild.remove();
  if (S.view === 'phache') setTimeout(() => el.remove(), loai === 'canh' ? 20000 : 12000);
  chuong(loai);
  nhacLai();
}
/** Còn thông báo chưa bấm "Đã biết" và đang không ở quầy pha chế → kêu nhắc lại mỗi 45 giây */
function nhacLai(){
  clearInterval(PC.nhac);
  PC.nhac = setInterval(() => {
    const con = $('#tb-pc') && $('#tb-pc').children.length;
    if (!con || !nhanTB()) { clearInterval(PC.nhac); return; }
    if (S.view !== 'phache') chuong('moi');
  }, 45000);
}
function capNhatHuyHieu(){
  const ds = S.phaChe || [], n = ds.reduce((a, d) => a + d.mon.reduce((b, m) => b + (+m.SO_LUONG || 0), 0), 0);
  document.querySelectorAll('[data-act="tab"][data-id="phache"]').forEach(b => {
    let em = b.querySelector('.dem-tb');

    em.textContent = n > 99 ? '99+' : n;

}
function tenDonPC(d){ return d.LOAI_DON === 'Mang đi' ? 'Mang đi #' + String(d.MA_HOA_DON).slice(-4) : (d.TEN_BAN || 'Bàn'); }

/** Lấy danh sách chờ pha chế, so với lần trước để báo món mới / món bị hủy / đơn chờ quá lâu */
/** Máy này có theo dõi yêu cầu của khách (gọi món QR) không */
function canYC(){
  const q = (S.dm && S.dm.thongTinQuan) || {};
  return !!(S.phien && S.phien.MA_CHI_NHANH && Q.banHang() && q.LINK_GOI_MON && q.GOI_MON_KHACH !== 'Tắt');
}
/** Một lượt gọi máy chủ cho cả quầy pha chế và yêu cầu của khách */
async function kiemTraPhaChe(imLang, chiYC){
  if (!S.token || !S.phien || !S.phien.MA_CHI_NHANH || PC.dangGoi) return;
  const canPC = !chiYC, canY = canYC();
  if (!canPC && !canY) return;
  PC.dangGoi = true;
  try {
    const tong = await api('theoDoi', {phaChe: canPC, yeuCau: canY});
    if (tong.yc) xuLyYC(tong.yc);
    if (!tong.pc) return;
    const kq = tong.pc;
    const ds = locDangXong(kq.ds), baoTB = nhanTB();
    const hienTai = new Set();

/* ======================= QUẢN TRỊ ======================= */
function khongDau(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }
function tgNgan(s){ if (!s) return ''; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/); return m ? `${m[3]}/${m[2]}/${m[1]}${m[4] ? ' ' + m[4] + ':' + m[5] : ''}` : s; }
function badgeTT(t){
  const m = {'Hoạt động': 'xong', 'Đang làm': 'xong', 'Ngừng hoạt động': 'huy', 'Nghỉ việc': 'huy', 'Đã khóa': 'huy'};
  return `<span class="badge ${m[t] || 'cho'}">${esc(t)}</span>`;
}
function tenCN(ma){
  if (ma === '*') return 'Tất cả chi nhánh';
  const c = S.qt.dl.chiNhanh.find(x => x.MA_CHI_NHANH === ma); return c ? c.TEN_CHI_NHANH : ma;
}
function goiYTenDN(ten){
  const w = khongDau(ten).replace(/[^a-z0-9 ]/g, ' ').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return '';
  const cuoi = w.pop(); return cuoi + w.map(x => x[0]).join('');
}
function mkNgauNhien(id){
  const bang = 'abcdefghjkmnpqrstuvwxyz23456789', a = new Uint32Array(8);
  (window.crypto || window.msCrypto).getRandomValues(a);
  const i = document.getElementById(id); if (!i) return;
  i.value = Array.from(a, x => bang[x % bang.length]).join('');
  if (i.type === 'password') hienMK(id);
}

function ganFormQuan(){
  const fq = $('#f-quan'); if (!fq) return;
  if (!S.anhCH) S.anhCH = {moi: null, link: (S.qt.dl.thongTinQuan.find(x => x.KHOA === 'ANH_CUA_HANG') || {}).NOI_DUNG || ''};
  const veXem = () => {
    const url = S.anhCH.moi ? S.anhCH.moi.dataUrl : S.anhCH.link;
    $('#ach-xem').innerHTML = url ? `<img src="${esc(linkAnhXem(url))}" alt="" onerror="anhXemLoi(this)">` : 'Chưa có ảnh';
    $('#ach-xoa').hidden = !url;
  };
  S.veAnhCH = veXem; veXem();
  $('#ach-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { S.anhCH.moi = await xuLyAnh(f, 1600); veXem(); } catch (err) { toast(loiGon(err), 'loi'); }
    e.target.value = '';
  };
  $('#ach-link').addEventListener('input', async e => {
    const v = e.target.value.trim();
    if (/^data:image[/]/i.test(v)) {
      try { S.anhCH.moi = await xuLyAnhDataUrl(v, 1600); S.anhCH.link = ''; e.target.value = ''; veXem(); } catch (err) { toast(loiGon(err), 'loi'); }
      return;
    }
    S.anhCH.moi = null; S.anhCH.link = v; veXem();
  });
  fq.addEventListener('paste', async e => {
    const tep = Array.from((e.clipboardData && e.clipboardData.files) || []).find(x => /^image[/]/.test(x.type));
    if (!tep) return;
    e.preventDefault();
    try { S.anhCH.moi = await xuLyAnh(tep, 1600); S.anhCH.link = ''; veXem(); toast('Đã dán ảnh cửa hàng – bấm "Lưu thông tin quán" để lưu.', 'ok'); } catch (err) { toast(loiGon(err), 'loi'); }
  });
  const layBin = () => { const c = $('#nh-chon').value; return c === '__KHAC' ? $('#nh-bin').value.trim() : c; };
  const xem = () => {
    const bin = layBin(), stk = $('#nh-stk').value.replace(/\s/g, '');
    $('#nh-xem-box').hidden = !(bin && stk && /^\d{6}$/.test(bin));
    if (!$('#nh-xem-box').hidden) {
      clearTimeout(xem._t);
      xem._t = setTimeout(() => { $('#nh-xem').src = urlQR({bin, stk, ten: $('#nh-chu').value, mau: 'compact2'}); }, 500);
    }
  };
  $('#nh-chon').onchange = () => { $('#nh-khac').hidden = $('#nh-chon').value !== '__KHAC'; xem(); };
  ['#nh-stk', '#nh-chu', '#nh-bin'].forEach(s => $(s).addEventListener('input', xem));
  xem();
  fq.onsubmit = e => {
    e.preventDefault();
    const dlq = Object.fromEntries(new FormData(fq));
    const c = $('#nh-chon').value;
    dlq.MA_NGAN_HANG = layBin();
    dlq.NGAN_HANG = c === '__KHAC' ? $('#nh-ten').value.trim() : tenNganHang(c);
    if (!dlq.SO_TAI_KHOAN.trim()) { dlq.MA_NGAN_HANG = dlq.MA_NGAN_HANG || ''; }
    if (S.anhCH) {
      dlq.ANH_CUA_HANG = S.anhCH.moi ? '' : S.anhCH.link;
      if (S.anhCH.moi) dlq.anhCuaHangMoi = {base64: S.anhCH.moi.base64, mimeType: S.anhCH.moi.mimeType};
    }
    chay(async () => {
      const q = await api('luuThongTinQuan', dlq);
      S.dm.thongTinQuan = q; capNhatHeader(); veAnhCuaHang(); S.anhCH = null;
      S.qt.dl.thongTinQuan.forEach(x => x.NOI_DUNG = q[x.KHOA]);
      renderQuanTri(); toast('Đã lưu thông tin quán.', 'ok');
    });
  };
}

function cnBanHienTai(){
  const dl = S.qt.dl;
  if (!dl.laChuQuan) return dl.maChiNhanh;
  if (!S.qt.cnBan || !dl.chiNhanh.some(c => c.MA_CHI_NHANH === S.qt.cnBan)) S.qt.cnBan = dl.maChiNhanh || (dl.chiNhanh[0] || {}).MA_CHI_NHANH;
  return S.qt.cnBan;
}
function qtHtmlBan(){
  const dl = S.qt.dl, cn = cnBanHienTai();
  const kvs = dl.khuVuc.filter(k => k.MA_CHI_NHANH === cn);
  const bans = dl.ban.filter(b => b.MA_CHI_NHANH === cn);
  const chip = b => `<button class="ban-chip ${b.TRANG_THAI === 'Ngừng hoạt động' ? 'ngung' : ''} ${dl.banCoKhach[b.MA_BAN] ? 'co-khach' : ''}" data-act="qtFormBan" data-id="${esc(b.MA_BAN)}">
      <b>${esc(b.TEN_BAN)}</b><small>${b.SO_CHO ? b.SO_CHO + ' chỗ' : '—'}${dl.banCoKhach[b.MA_BAN] ? ' · có khách' : ''}${b.TRANG_THAI === 'Ngừng hoạt động' ? ' · ngừng' : ''}</small></button>`;
  const dangDung = bans.filter(b => b.TRANG_THAI !== 'Ngừng hoạt động').length;
  let html = `<div class="toolbar">
      ${dl.laChuQuan ? `<select class="input" id="qt-cnban" style="width:auto">${dl.chiNhanh.map(c => `<option value="${esc(c.MA_CHI_NHANH)}" ${c.MA_CHI_NHANH === cn ? 'selected' : ''}>${esc(c.TEN_CHI_NHANH)}</option>`).join('')}</select>` : ''}
      <span class="muted">${kvs.length} khu vực · ${dangDung} bàn đang dùng · bấm vào bàn để sửa</span><div class="gian"></div>
      <button class="btn" data-act="qtQR" title="In mã QR để khách tự gọi món">🔳 Mã QR gọi món</button>
      <button class="btn" data-act="qtFormKV">+ Khu vực</button>
      <button class="btn primary" data-act="qtFormNhieuBan" ${kvs.length ? '' : 'disabled title="Tạo khu vực trước"'}>+ Thêm nhiều bàn</button></div>`;
  if (!kvs.length) return html + '<div class="trong-rong">Chi nhánh chưa có khu vực nào. Bấm "+ Khu vực" để bắt đầu (ví dụ: Trong nhà, Sân vườn, Tầng 2).</div>';
  html += kvs.map(k => `<div class="kv-card ${k.TRANG_THAI === 'Ngừng hoạt động' ? 'ngung' : ''}">
      <div class="kv-head"><h3>${esc(k.TEN_KHU_VUC)}</h3>${k.TRANG_THAI === 'Ngừng hoạt động' ? badgeTT(k.TRANG_THAI) : ''}
        <span class="muted">${bans.filter(b => b.MA_KHU_VUC === k.MA_KHU_VUC).length} bàn</span>
        <button class="btn nho" data-act="qtFormKV" data-id="${esc(k.MA_KHU_VUC)}">Sửa khu vực</button></div>
      <div class="chip-grid">${bans.filter(b => b.MA_KHU_VUC === k.MA_KHU_VUC).map(chip).join('')}
        <button class="ban-chip them" data-act="qtFormBanMoi" data-id="${esc(k.MA_KHU_VUC)}">+ Thêm bàn</button></div></div>`).join('');
  const le = bans.filter(b => !kvs.some(k => k.MA_KHU_VUC === b.MA_KHU_VUC));
  if (le.length) html += `<div class="kv-card"><div class="kv-head"><h3>Chưa xếp khu vực</h3></div><div class="chip-grid">${le.map(chip).join('')}</div></div>`;
  return html;
}

function veQR(){
