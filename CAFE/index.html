<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B3325">
<meta name="robots" content="noindex">
<title>Gọi món tại bàn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nau:#6F4E37;--nau-dam:#4B3325;--kem:#FAF6F0;--kem-dam:#F0E8DC;--vien:#E4D9CA;--chu:#2B2118;--mo:#857566;
  --xanh:#2E7D5B;--xanh-nhat:#E3F2EA;--cam:#C9761E;--cam-nhat:#FBEEDC;--do:#B83A2E;--do-nhat:#FBE7E4;--tim:#6A4FA3;--tim-nhat:#EEE9F6;
  --bong:0 1px 2px rgba(60,40,20,.08),0 4px 14px rgba(60,40,20,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--kem);color:var(--chu);font-size:15px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;font-size:16px;color:inherit}
.an{display:none!important}
.btn{border:1px solid var(--vien);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600}
.btn.chinh{background:var(--nau);border-color:var(--nau);color:#fff}
.btn.xanh{background:var(--xanh);border-color:var(--xanh);color:#fff}
.btn.lon{padding:14px 18px;font-size:16px;width:100%}
.btn:disabled{opacity:.5}
/* Đầu trang */
.dau{background:linear-gradient(160deg,var(--nau-dam),#6b4a35);color:#fff;padding:18px 16px 48px}
.dau .hang{display:flex;align-items:center;gap:12px}
.dau .logo{width:48px;height:48px;border-radius:14px;background:#fff;object-fit:cover;flex-shrink:0}
.dau .logo-chu{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.dau h1{font-size:19px;margin:0;line-height:1.25}
.dau p{margin:2px 0 0;font-size:13px;color:#E8DCCD}
.the-ban{margin:-34px 14px 0;background:#fff;border-radius:18px;box-shadow:var(--bong);padding:14px 16px;position:relative}
.the-ban .tb-dong{display:flex;align-items:center;gap:12px}
.the-ban .so{background:var(--cam-nhat);color:var(--cam);font-weight:700;border-radius:12px;padding:8px 12px;font-size:18px;white-space:nowrap}
.the-ban small{color:var(--mo);font-size:13px;display:block}
.the-ban b{font-size:15px}
.nhanh{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.nhanh button{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--vien);background:var(--kem);border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px}
.nhanh svg{width:18px;height:18px}
.tra-quay{display:block;width:100%;margin-top:10px;border:1px dashed #9CC6DD;background:#F1F8FC;color:#1F5F85;border-radius:12px;padding:9px 10px;font-size:13.5px;text-align:center}
.tra-quay b{white-space:nowrap}
.o input.ma{font-size:30px;letter-spacing:.4em;text-align:center;font-weight:700;padding:12px;font-variant-numeric:tabular-nums}
.da-tra{background:#E7F5EC;color:#1E6B45;border-radius:12px;padding:10px 12px;font-weight:700;text-align:center;margin-top:10px}
/* Yêu cầu đã gửi */
.yc-ds{margin:14px 14px 0;display:grid;gap:8px}
.yc{background:#fff;border-radius:14px;box-shadow:var(--bong);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.yc.xong{box-shadow:0 0 0 2px var(--xanh),var(--bong)}
.pill.pha{background:#FFF1DE;color:var(--cam)}
/* Tiến trình đơn: Đã gửi → Quán đã nhận → Đang pha → Đã xong */
.buoc{display:flex;gap:4px;width:100%;margin-top:-2px}
.buoc span{flex:1;font-size:10.5px;text-align:center;color:var(--mo);padding-top:5px;border-top:4px solid var(--kem-dam);border-radius:2px;white-space:nowrap}
.buoc span.xong{border-top-color:var(--xanh);color:var(--xanh);font-weight:600}
.buoc span.dang{border-top-color:var(--cam);color:var(--cam);font-weight:700;animation:nhay 1.4s infinite}
.tien-do{width:100%;height:6px;border-radius:99px;background:var(--kem-dam);overflow:hidden;margin-top:-4px}
.tien-do i{display:block;height:100%;background:var(--xanh);border-radius:99px;transition:width .4s}
/* Mỗi lần gọi món là một đơn riêng: Đơn 1, Gọi thêm lần 1, 2… */
.yc .so-don{display:inline-block;white-space:nowrap;width:auto;height:auto;line-height:1.5;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--kem-dam);color:var(--nau-dam);vertical-align:1px}
.yc .so-don.them{background:var(--cam);color:#fff}
.yc-mon{width:100%;margin:-4px 0 0;padding:0;list-style:none;font-size:13.5px}
.yc-mon li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--kem-dam)}
.yc-mon li:last-child{border-bottom:0}
.yc-mon li.ok{color:var(--xanh)}
.yc-mon li span:last-child{white-space:nowrap;font-size:12.5px;color:var(--mo)}
.yc-mon li.ok span:last-child{color:var(--xanh);font-weight:700}
.goi-them{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:1.5px dashed var(--cam);background:#FFF8EE;color:var(--cam);border-radius:14px;padding:11px;font-weight:700;font-size:14.5px}
.phien-ban{font-size:11px;color:#B9AC9E;text-align:center;margin:8px 0 0}
.yc .nd{flex:1 1 150px;min-width:0}
.yc .nd small{display:block;color:var(--mo);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.cho{background:var(--cam-nhat);color:var(--cam)}
.pill.ok{background:var(--xanh-nhat);color:var(--xanh)}
.pill.huy{background:var(--do-nhat);color:var(--do)}
.cham{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;animation:nhay 1s infinite}
@keyframes nhay{50%{opacity:.25}}
/* Thực đơn */
.loc{position:sticky;top:0;z-index:10;background:var(--kem);padding:14px 14px 8px}
.tim{width:100%;border:1px solid var(--vien);background:#fff;border-radius:12px;padding:11px 14px;outline:none}
.tim:focus{border-color:var(--nau)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--vien);background:#fff;border-radius:99px;padding:7px 14px;white-space:nowrap;font-weight:600;font-size:14px}
.chip.on{background:var(--nau);border-color:var(--nau);color:#fff}
.nhom-tieu{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--nau-dam);margin:16px 14px 8px;font-weight:700}
.ds-mon{display:grid;gap:10px;padding:0 14px}
.mon{background:#fff;border-radius:16px;box-shadow:var(--bong);padding:10px;display:flex;gap:12px;align-items:center}
.mon .anh{width:78px;height:78px;border-radius:12px;background:var(--kem-dam);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:var(--nau)}
.mon .anh img{width:100%;height:100%;object-fit:cover}
.mon .tt{flex:1;min-width:0}
.mon .ten{font-weight:600;line-height:1.3}
.mon .gia{color:var(--nau);font-weight:700;margin-top:4px}
.them{width:38px;height:38px;border-radius:12px;border:0;background:var(--nau);color:#fff;font-size:22px;line-height:1;flex-shrink:0}
.sl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--vien);background:#fff;font-size:18px;font-weight:700;line-height:1}
.sl b{min-width:18px;text-align:center}
.rong{color:var(--mo);text-align:center;padding:30px 16px}
/* Thanh dưới */
.thanh{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(250,246,240,0),var(--kem) 30%)}
.thanh button{width:100%;display:flex;align-items:center;gap:12px;background:var(--nau-dam);color:#fff;border:0;border-radius:16px;padding:13px 16px;box-shadow:0 8px 24px rgba(75,51,37,.35);font-weight:600}
.thanh .gio-ic{position:relative;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thanh .gio-ic svg{width:22px;height:22px}
.thanh .gio-ic em{position:absolute;top:-6px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--cam);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--nau-dam)}
.thanh .dem{background:#fff;color:var(--nau-dam);border-radius:10px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700}
.thanh .gian{flex:1;text-align:left}
.thanh.nay button{animation:nay .35s}
@keyframes nay{40%{transform:scale(1.03)}}
/* Ngăn kéo */
.nen{position:fixed;inset:0;z-index:30;background:rgba(43,33,24,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.nen.mo{opacity:1;pointer-events:auto}
.ngan{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:22px 22px 0 0;max-height:90vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease}
.ngan.mo{transform:none}
.ngan .tay{width:42px;height:5px;border-radius:99px;background:var(--vien);margin:8px auto 0}
.ngan .dau-ngan{display:flex;align-items:center;padding:10px 16px 8px;gap:10px}
.ngan .dau-ngan h2{flex:1;font-size:18px;margin:0}
.dong-x{border:0;background:var(--kem);width:34px;height:34px;border-radius:50%;font-size:18px}
.ngan .than{overflow-y:auto;padding:0 16px 8px}
.ngan .chan{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--kem-dam)}
.gio-mon{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--vien)}
.gio-mon .tt{flex:1;min-width:0}
.gio-mon input{width:100%;border:0;border-bottom:1px solid var(--vien);padding:5px 0;font-size:14px;margin-top:4px;outline:none;background:transparent}
.o{display:block;margin-top:12px}
.o span{display:block;font-size:13px;color:var(--mo);margin-bottom:5px;font-weight:500}
.o input,.o textarea{width:100%;border:1px solid var(--vien);border-radius:12px;padding:10px 12px;outline:none;resize:none}
.tong{display:flex;justify-content:space-between;margin:4px 0;font-size:15px}
.tong.lon{font-size:19px;font-weight:700;margin-top:8px}
.don-mon{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--vien);font-size:14px}
.don-mon .tt{flex:1}
.don-mon small{color:var(--mo)}
.qr{display:flex;flex-direction:column;align-items:center;background:var(--kem);border-radius:16px;padding:14px;margin-top:14px;text-align:center}
.qr img{width:220px;max-width:100%;border-radius:10px;background:#fff}
.qr p{margin:8px 0 0;font-size:13px;color:var(--mo)}
.chon-tt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.loi-man{padding:60px 24px;text-align:center}
.loi-man .bieu{font-size:56px}
.loi-man h2{font-size:20px}
.loi-man p{color:var(--mo)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-120%);z-index:50;background:var(--chu);color:#fff;padding:12px 18px;border-radius:12px;max-width:92vw;font-size:14px;transition:transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.hien{transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--xanh)}
#toast.loi{background:var(--do)}
.cho-tai{padding:80px 20px;text-align:center;color:var(--mo)}
.xoay{width:36px;height:36px;border:4px solid var(--vien);border-top-color:var(--nau);border-radius:50%;margin:0 auto 14px;animation:x .8s linear infinite}
@keyframes x{to{transform:rotate(360deg)}}
.ghi{font-size:12px;color:var(--mo);text-align:center;margin:20px 16px 0}
@media (min-width:700px){body{max-width:560px;margin:0 auto}.thanh,.ngan{max-width:560px;margin:0 auto}}
</style>
</head>
<body>
<div id="app"><div class="cho-tai"><div class="xoay"></div><span id="cho-chu">Đang tải thực đơn…</span></div></div>
<div class="nen" id="nen" data-act="dong"></div>
<div class="ngan" id="ngan"><div class="tay"></div><div class="dau-ngan"><h2 id="ngan-tieu"></h2><button class="dong-x" data-act="dong" aria-label="Đóng">✕</button></div>
  <div class="than" id="ngan-than"></div><div class="chan" id="ngan-chan"></div></div>
<div id="toast"></div>
<script>
/* Báo lỗi ngay trên trang nếu trình duyệt không chạy được mã (không để màn hình chờ mãi) */
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (a && document.getElementById('cho-chu')) a.innerHTML = '<div class="loi-man"><div class="bieu">☕</div><h2>Trình duyệt không chạy được trang</h2><p>' +
    String(e.message || e).replace(/[<>&]/g, '') + '</p><p>Hãy mở bằng Chrome hoặc Safari.</p></div>';
});
</script>
<script src="config.js?v=2"></script>
<script>
(function () {
  'use strict';
  const CH = window.GOI_MON_CAU_HINH || {};
  const API = (new URLSearchParams(location.search).get('api')) || CH.API_URL;
  const tham = new URLSearchParams(location.search);
  const B = tham.get('b') || '', K = tham.get('k') || '';
  const S = {dm: null, gio: [], nhom: '', tim: '', ten: '', ghiChu: '', yc: [], don: null, ngan: null, gui: false};
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const tien = n => (Math.round(+n || 0)).toLocaleString('vi-VN') + 'đ';
  const khongDau = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  const IC = {
    chuong: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    gio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2l1.6-6.8H6.2"/></svg>',
    hoaDon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>'
  };
  const KHO = 'goimon_' + B;
  const PHIEN_BAN_TRANG = '2026.11.25-36';

  let toastT;
  function toast(m, loai) { const t = $('#toast'); t.textContent = m; t.className = 'hien ' + (loai || ''); clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, loai === 'loi' ? 5000 : 3000); }

  /* ---------- Gọi API ---------- */
  const LOI_KET_NOI = 'Không kết nối được máy chủ của quán. Vui lòng báo nhân viên.';
  async function goi(tsGet, body, giay) {
    if (!API || !/^https?:/.test(API) || /DAN_LINK/.test(API)) { const e = new Error('Trang chưa được cấu hình link máy chủ (file config.js).'); e.kyThuat = 1; throw e; }
    const ctl = window.AbortController ? new AbortController() : null;
    const hen = setTimeout(() => { if (ctl) ctl.abort(); }, (giay || 25) * 1000);
    let r, txt;
    try {
      if (body) r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({b: B, k: K}, body)), redirect: 'follow', signal: ctl && ctl.signal});
      else r = await fetch(API + (API.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({b: B, k: K}, tsGet)), {redirect: 'follow', signal: ctl && ctl.signal});
      txt = await r.text();
    } catch (e) {
      const loi = new Error(e && e.name === 'AbortError' ? 'Máy chủ phản hồi quá lâu. Vui lòng thử lại.' : LOI_KET_NOI);
      loi.kyThuat = e && e.name === 'AbortError' ? 2 : 3; throw loi;
    } finally { clearTimeout(hen); }
    let j;
    try { j = JSON.parse(txt); } catch (e) { const loi = new Error(LOI_KET_NOI); loi.kyThuat = /accounts\.google|ServiceLogin/i.test(txt) ? 3 : 4; throw loi; }
    if (!j.ok) throw new Error(j.loi || 'Có lỗi xảy ra.');
    return j.v;
  }
  /* Gợi ý cho chủ quán khi trang không kết nối được (khách chỉ cần báo nhân viên) */
  function goiYKyThuat(m) {
    const lk = API ? API + (API.includes('?') ? '&' : '?') + 'api=ping' : '';
    const ly = {1: 'Mở file config.js trên GitHub và dán đúng link /exec của Web App.',
      2: 'Web App chạy quá lâu. Thử lại; nếu lặp lại, chạy hàm kiemTraHeThong trong Apps Script.',
      3: 'Web App đang bắt đăng nhập Google hoặc link /exec trong config.js sai. Vào Apps Script → Triển khai → Quản lý các bản triển khai → ✏️ → "Người có quyền truy cập: Bất kỳ ai" → Phiên bản mới → Triển khai.',
      4: 'Web App chưa có file GoiMon.gs hoặc chưa triển khai Phiên bản mới.'}[m];
    return ly ? `<details style="margin-top:18px;text-align:left;font-size:13px;color:var(--mo)"><summary>Dành cho chủ quán</summary>
      <p>${esc(ly)}</p>${lk ? `<p>Kiểm tra nhanh: mở <a href="${esc(lk)}" target="_blank" rel="noopener">link này</a> trong cửa sổ ẩn danh. Đúng thì thấy dòng chữ bắt đầu bằng <code>{"ok":true</code>; nếu ra trang đăng nhập Google là chưa để quyền "Bất kỳ ai".</p>` : ''}</details>` : '';
  }

  /* ---------- Lưu yêu cầu đã gửi trên máy khách (trong ngày) ---------- */
  function homNay() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
  function docYC() { try { const o = JSON.parse(localStorage.getItem(KHO) || 'null'); return o && o.ngay === homNay() ? o.ds : []; } catch (e) { return []; } }
  function luuYC() { try { localStorage.setItem(KHO, JSON.stringify({ngay: homNay(), ds: S.yc.filter(y => !/^tam/.test(y.MA_YEU_CAU)).slice(-20)})); } catch (e) {} }

  /* ---------- Hiển thị ---------- */
  function loiMan(m, kyThuat) {
    $('#app').innerHTML = `<div class="loi-man"><div class="bieu">☕</div><h2>Không mở được thực đơn</h2><p>${esc(m)}</p>
      <button class="btn chinh" onclick="location.reload()">Thử lại</button>${goiYKyThuat(kyThuat)}</div>`;
    $('#thanh') && $('#thanh').remove();
  }

  function nhanDon() {
    const d = S.don;
    return IC.hoaDon + (d && d.TRA_TRUOC ? 'Đơn đã trả ✓' : 'Hóa đơn' + (d ? ' · ' + tien(d.TONG_THANH_TOAN - d.DA_THANH_TOAN) : ''));
  }
  function render() {
    const d = S.dm, q = d.quan, b = d.ban;
    document.title = (q.TEN_QUAN || 'Gọi món') + ' – ' + b.TEN_BAN;
    $('#app').innerHTML = `
      <div class="dau"><div class="hang">${q.LOGO ? `<img class="logo" src="${esc(q.LOGO)}" alt="" onerror="this.outerHTML='<div class=logo-chu>☕</div>'">` : '<div class="logo-chu">☕</div>'}
        <div><h1>${esc(q.TEN_QUAN || 'Quán cafe')}</h1><p>${esc(q.SLOGAN || b.TEN_CHI_NHANH)}</p></div></div></div>
      <div class="the-ban"><div class="tb-dong"><span class="so">${esc(b.TEN_BAN)}</span>
        <div><b>${esc(b.KHU_VUC || b.TEN_CHI_NHANH)}</b><small>${esc(b.TEN_CHI_NHANH)}${q.WIFI ? ' · Wifi: ' + esc(q.WIFI) : ''}</small></div></div>
        <div class="nhanh"><button data-act="goiNV">${IC.chuong}Gọi nhân viên</button><button data-act="xemDon">${nhanDon()}</button></div>
        <button class="tra-quay" data-act="moNgoi">🧾 Đã gọi &amp; trả tiền tại quầy? <b>Nhập mã nhận bàn →</b></button></div>
      <div class="yc-ds" id="yc-ds"></div>
      <div class="loc"><input class="tim" id="tim" type="search" placeholder="🔍 Tìm món…" value="${esc(S.tim)}">
        <div class="chips" id="chips"></div></div>
      <div id="ds"></div>
      <p class="ghi" style="margin-bottom:0">${d.cheDo === 'Gửi thẳng quầy pha chế' ? 'Món bạn gọi sẽ được gửi thẳng tới quầy pha chế.' : 'Món bạn gọi sẽ được nhân viên xác nhận rồi chuyển tới quầy pha chế.'}</p>
      <p class="phien-ban">Trang gọi món · phiên bản ${PHIEN_BAN_TRANG}</p>`;
    $('#tim').addEventListener('input', e => { S.tim = e.target.value; renderMenu(); });
    renderYC(); renderMenu(); renderThanh();
  }

  function renderMenu() {
    const d = S.dm;
    $('#chips').innerHTML = [{MA_NHOM_SAN_PHAM: '', TEN_NHOM_SAN_PHAM: 'Tất cả'}].concat(d.nhom)
      .map(n => `<button class="chip ${S.nhom === n.MA_NHOM_SAN_PHAM ? 'on' : ''}" data-act="nhom" data-id="${esc(n.MA_NHOM_SAN_PHAM)}">${esc(n.TEN_NHOM_SAN_PHAM)}</button>`).join('');
    const kw = khongDau(S.tim.trim());
    const loc = d.sanPham.filter(s => (!S.nhom || s.MA_NHOM_SAN_PHAM === S.nhom) && (!kw || khongDau(s.TEN_SAN_PHAM).includes(kw)));
    if (!loc.length) { $('#ds').innerHTML = '<div class="rong">Không tìm thấy món phù hợp.</div>'; return; }
    const nhom = (S.nhom || kw) ? [{TEN_NHOM_SAN_PHAM: '', ds: loc}]
      : d.nhom.map(n => ({TEN_NHOM_SAN_PHAM: n.TEN_NHOM_SAN_PHAM, ds: loc.filter(s => s.MA_NHOM_SAN_PHAM === n.MA_NHOM_SAN_PHAM)}))
        .concat([{TEN_NHOM_SAN_PHAM: 'Khác', ds: loc.filter(s => !d.nhom.some(n => n.MA_NHOM_SAN_PHAM === s.MA_NHOM_SAN_PHAM))}]);
    $('#ds').innerHTML = nhom.filter(g => g.ds.length).map(g => `${g.TEN_NHOM_SAN_PHAM ? `<div class="nhom-tieu">${esc(g.TEN_NHOM_SAN_PHAM)}</div>` : '<div style="height:8px"></div>'}
      <div class="ds-mon">${g.ds.map(s => { const sl = slGio(s.MA_SAN_PHAM);
        return `<div class="mon"><div class="anh">${s.HINH_ANH ? `<img src="${esc(s.HINH_ANH)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${esc(s.TEN_SAN_PHAM.charAt(0))}'">` : esc(s.TEN_SAN_PHAM.charAt(0))}</div>
          <div class="tt"><div class="ten">${esc(s.TEN_SAN_PHAM)}</div><div class="gia">${tien(s.GIA_BAN)}</div></div>
          ${sl ? `<div class="sl"><button data-act="bot" data-id="${esc(s.MA_SAN_PHAM)}" aria-label="Bớt">−</button><b>${sl}</b><button data-act="them" data-id="${esc(s.MA_SAN_PHAM)}" aria-label="Thêm">+</button></div>`
            : `<button class="them" data-act="them" data-id="${esc(s.MA_SAN_PHAM)}" aria-label="Thêm ${esc(s.TEN_SAN_PHAM)}">+</button>`}</div>`; }).join('')}</div>`).join('');
  }

  const slGio = ma => S.gio.filter(g => g.ma === ma).reduce((a, g) => a + g.sl, 0);
  const tongGio = () => S.gio.reduce((a, g) => a + g.sl * g.gia, 0);
  const demGio = () => S.gio.reduce((a, g) => a + g.sl, 0);

  function renderThanh() {
    let t = $('#thanh');
    const n = demGio();
    if (!n) { if (t) t.remove(); return; }
    if (!t) { t = document.createElement('div'); t.id = 'thanh'; t.className = 'thanh'; document.body.appendChild(t); }
    t.innerHTML = `<button data-act="gio"><span class="gio-ic">${IC.gio}<em>${n}</em></span><span class="gian">${laGoiThem() ? 'Gọi thêm · xem món đã chọn' : 'Xem món đã chọn'}</span><span>${tien(tongGio())}</span></button>`;
    t.classList.remove('nay'); void t.offsetWidth; t.classList.add('nay');
  }

  const NHAN_TT = {'Đang gửi': ['cho', 'Đang gửi…'], 'Lỗi gửi': ['huy', 'Chưa gửi được'], 'Chờ xác nhận': ['cho', 'Đang chờ nhân viên'], 'Đang xử lý': ['cho', 'Đang chuyển pha chế'], 'Đã xác nhận': ['pha', 'Đang pha chế'],
    'Đã pha xong': ['ok', '✓ Đã xong – đang mang ra'], 'Đã thanh toán': ['ok', '✓ Đã thanh toán'], 'Đã hủy': ['huy', 'Đã hủy'],
    'Đã xử lý': ['ok', 'Nhân viên đã nhận'], 'Từ chối': ['huy', 'Không thực hiện được']};
  /* Trạng thái đã kết thúc: không cần hỏi máy chủ nữa */
  const XONG_HAN = /^(Đã xử lý|Từ chối|Đã thanh toán|Đã hủy|Lỗi gửi)$/;
  /** Số bước đã xong trên thanh tiến trình gọi món (0–4) */
  function buocYC(y) {
    return {'Đang gửi': 0, 'Chờ xác nhận': 1, 'Đang xử lý': 1, 'Đã xác nhận': 2, 'Đã pha xong': 4, 'Đã thanh toán': 4}[y.TRANG_THAI];
  }
  /** Bàn đã có đơn (khách gọi trước đó, hoặc nhân viên đã gọi món cho bàn) → lần gọi này là "gọi thêm" */
  function laGoiThem() {
    return S.yc.some(y => y.LOAI === 'Gọi món' && !/Từ chối|Lỗi gửi|Đã hủy/.test(y.TRANG_THAI)) || !!(S.don && S.don.mon && S.don.mon.length);
  }
  function renderYC() {
    const o = $('#yc-ds'); if (!o) return;
    const ds = S.yc.slice(-6).reverse();
    const coDon = S.yc.some(y => y.LOAI === 'Gọi món' && !/Từ chối|Lỗi gửi|Đã hủy/.test(y.TRANG_THAI));
    o.innerHTML = ds.map(y => { let n = NHAN_TT[y.TRANG_THAI] || ['cho', y.TRANG_THAI];
      if (y.TRANG_THAI === 'Chờ xác nhận' && y.LOAI === 'Gọi món' && S.dm.cheDo === 'Gửi thẳng quầy pha chế') n = ['cho', 'Đang chuyển pha chế'];
      if (y.TRANG_THAI === 'Đã xác nhận' && y.TONG) n = ['pha', 'Đang pha ' + (y.XONG || 0) + '/' + y.TONG + ' món'];
      if (y.TRANG_THAI === 'Đã xử lý' && y.LOAI === 'Xin thanh toán') n = ['ok', 'Nhân viên đang mang hóa đơn tới'];
      const b = y.LOAI === 'Gọi món' ? buocYC(y) : undefined;
      const laMon = y.LOAI === 'Gọi món', xi = y.XI || [];
      const nhan = laMon ? (y.LAN > 1 || y.THEM ? `<span class="so-don them">＋ Gọi thêm${y.LAN > 1 ? ' lần ' + (y.LAN - 1) : ''}</span>` : '<span class="so-don">Đơn 1</span>') : '';
      return `<div class="yc ${y.TRANG_THAI === 'Đã pha xong' ? 'xong' : ''}"><div class="nd"><b>${nhan}${laMon ? (nhan.indexOf('them') >= 0 ? '' : 'Gọi món') : esc(y.LOAI)}</b>
          <small>${laMon && y.MON ? '' : esc(y.MO_TA || '')}${y.LY_DO ? (laMon && y.MON ? '' : ' – ') + esc(y.LY_DO) : ''}</small></div>
        <span class="pill ${n[0]}">${n[0] === 'cho' || n[0] === 'pha' ? '<span class="cham"></span>' : ''}${n[1]}</span>
        ${b !== undefined ? `<div class="buoc">${['Đã gửi', 'Quán đã nhận', 'Đang pha', 'Đã xong'].map((t, i) => `<span class="${i < b || (i === 0 && b >= 0 && y.TRANG_THAI !== 'Đang gửi') ? 'xong' : i === b ? 'dang' : ''}">${t}</span>`).join('')}</div>` : ''}
        ${y.TRANG_THAI === 'Đã xác nhận' && y.TONG ? `<div class="tien-do"><i style="width:${Math.round((y.XONG || 0) / y.TONG * 100)}%"></i></div>` : ''}
        ${laMon && y.MON ? `<ul class="yc-mon">${y.MON.map((m, i) => { const ok = y.TRANG_THAI === 'Đã pha xong' || y.TRANG_THAI === 'Đã thanh toán' || xi.indexOf(i) >= 0;
          return `<li class="${ok ? 'ok' : ''}"><span>${esc(m.sl)}× ${esc(m.ten)}</span><span>${ok ? '✓ Xong' : /Đã xác nhận/.test(y.TRANG_THAI) ? 'Đang pha' : ''}</span></li>`; }).join('')}</ul>` : ''}</div>`; }).join('')
      + (coDon ? `<button class="goi-them" data-act="goiThem">＋ Gọi thêm món</button>` : '');
  }

  /* ---------- Ngăn kéo ---------- */
  function moNgan(loai) {
    S.ngan = loai;
    $('#nen').classList.add('mo'); $('#ngan').classList.add('mo');
    veNgan();
  }
  function dongNgan() { S.ngan = null; $('#nen').classList.remove('mo'); $('#ngan').classList.remove('mo'); }
  function veNgan() {
    if (S.ngan === 'gio') {
      $('#ngan-tieu').innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px"><span style="width:22px;height:22px;display:inline-flex;color:var(--nau)">${IC.gio}</span>${laGoiThem() ? 'Gọi thêm món' : 'Món đã chọn'}</span>`;
      if (!S.gio.length) { dongNgan(); return; }
      $('#ngan-than').innerHTML = S.gio.map((g, i) => `<div class="gio-mon"><div class="tt"><b>${esc(g.ten)}</b><div style="color:var(--nau);font-weight:600">${tien(g.gia * g.sl)}</div>
          <input data-gc="${i}" placeholder="Ghi chú (ít đá, ít ngọt…)" value="${esc(g.gc)}" maxlength="100"></div>
          <div class="sl"><button data-act="botG" data-id="${i}">−</button><b>${g.sl}</b><button data-act="themG" data-id="${i}">+</button></div></div>`).join('') +
        `<label class="o"><span>Tên của bạn (không bắt buộc)</span><input id="g-ten" maxlength="40" value="${esc(S.ten)}" placeholder="VD: Anh Nam"></label>
         <label class="o"><span>Ghi chú cho quán</span><textarea id="g-gc" rows="2" maxlength="200" placeholder="VD: mang nước ra trước">${esc(S.ghiChu)}</textarea></label>`;
      $('#ngan-chan').innerHTML = `<div class="tong lon"><span>Tạm tính</span><span>${tien(tongGio())}</span></div>
        <button class="btn chinh lon" style="margin-top:10px" data-act="gui" ${S.gui ? 'disabled' : ''}>${S.gui ? 'Đang gửi…' : (laGoiThem() ? 'Gửi gọi thêm (' : 'Gửi gọi món (') + demGio() + ')'}</button>`;
      document.querySelectorAll('[data-gc]').forEach(i => i.addEventListener('input', e => { S.gio[+e.target.dataset.gc].gc = e.target.value; }));
      $('#g-ten').addEventListener('input', e => { S.ten = e.target.value; });
      $('#g-gc').addEventListener('input', e => { S.ghiChu = e.target.value; });
    } else if (S.ngan === 'don') {
      const d = S.don, q = S.dm.quan;
      $('#ngan-tieu').textContent = d && d.TRA_TRUOC ? 'Order #' + d.SO + ' – đã trả tại quầy' : 'Hóa đơn của bàn';
      if (!d || !d.mon.length) {
        $('#ngan-than').innerHTML = '<div class="rong">Bàn chưa có món nào được xác nhận.</div>';
        $('#ngan-chan').innerHTML = '<button class="btn lon" data-act="dong">Đóng</button>'; return;
      }
      const con = d.TONG_THANH_TOAN - d.DA_THANH_TOAN;
      const qr = q.MA_NGAN_HANG && q.SO_TAI_KHOAN && con > 0 ? 'https://img.vietqr.io/image/' + encodeURIComponent(q.MA_NGAN_HANG) + '-' + encodeURIComponent(q.SO_TAI_KHOAN) +
        '-compact2.png?' + new URLSearchParams({amount: Math.round(con), addInfo: String(d.MA_HOA_DON).replace(/[^A-Za-z0-9]/g, ''), accountName: khongDau(q.CHU_TAI_KHOAN || '').toUpperCase()}) : '';
      $('#ngan-than').innerHTML = d.mon.map(m => `<div class="don-mon"><div class="tt">${m.SL}× ${esc(m.TEN)}${m.GHI_CHU ? `<br><small>${esc(m.GHI_CHU)}</small>` : ''}</div>
          <div style="text-align:right">${tien(m.TIEN)}<br><small>${m.XONG ? '✓ Đã xong' : 'Đang pha chế'}</small></div></div>`).join('') +
        `<div style="margin-top:10px"><div class="tong"><span>Tổng tiền hàng</span><span>${tien(d.TONG_TIEN_HANG)}</span></div>
          ${d.TIEN_GIAM_GIA ? `<div class="tong"><span>Giảm giá</span><span>−${tien(d.TIEN_GIAM_GIA)}</span></div>` : ''}
          ${d.DA_THANH_TOAN ? `<div class="tong"><span>Đã trả</span><span>${tien(d.DA_THANH_TOAN)}</span></div>` : ''}
          ${d.TRA_TRUOC || con <= 0 ? '<div class="da-tra">✓ Đã thanh toán – cảm ơn quý khách!</div>' : `<div class="tong lon"><span>Cần thanh toán</span><span>${tien(con)}</span></div>`}</div>` +
        (qr ? `<div class="qr"><img src="${esc(qr)}" alt="Mã QR chuyển khoản"><p>Quét bằng app ngân hàng: số tiền và nội dung đã điền sẵn.<br>${esc(q.NGAN_HANG || '')} · ${esc(q.SO_TAI_KHOAN)}</p></div>` : '');
      $('#ngan-chan').innerHTML = con > 0 ? `<div style="font-size:13px;color:var(--mo);text-align:center">Báo nhân viên bạn muốn thanh toán bằng:</div>
        <div class="chon-tt"><button class="btn" data-act="xinTT" data-id="Tiền mặt">💵 Tiền mặt</button><button class="btn xanh" data-act="xinTT" data-id="Chuyển khoản">🏦 Chuyển khoản</button></div>`
        : '<button class="btn lon" data-act="dong">Đóng</button>';
    } else if (S.ngan === 'ngoi') {
      $('#ngan-tieu').textContent = 'Nhận bàn – đã trả tiền tại quầy';
      $('#ngan-than').innerHTML = `<p style="color:var(--mo);margin:0">Bạn đã gọi món và thanh toán ở quầy? Nhập <b>mã nhận bàn</b> (4 số) in trên biên lai để quán mang đồ uống ra <b>${esc(S.dm.ban.TEN_BAN)}</b>.</p>
        <label class="o"><span>Mã nhận bàn</span><input class="ma" id="ma-nb" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="····"></label>
        <p style="color:var(--mo);font-size:12.5px;margin:10px 0 0">Không thấy mã? Báo nhân viên <b>số order</b> trên biên lai.</p>`;
      $('#ngan-chan').innerHTML = `<button class="btn chinh lon" data-act="nhanBan" ${S.gui ? 'disabled' : ''}>${S.gui ? 'Đang gửi…' : 'Nhận bàn này'}</button>`;
      const o = $('#ma-nb'); o.addEventListener('input', () => { o.value = o.value.replace(/\D/g, '').slice(0, 4); });
      o.addEventListener('keydown', e => { if (e.key === 'Enter') nhanBan(); });
      setTimeout(() => o.focus(), 250);
    } else if (S.ngan === 'nv') {
      $('#ngan-tieu').textContent = 'Gọi nhân viên';
      $('#ngan-than').innerHTML = `<p style="color:var(--mo);margin:0">Chọn nhanh hoặc ghi rõ yêu cầu:</p>
        <div class="chips" style="flex-wrap:wrap">${['Xin thêm nước lọc', 'Xin khăn giấy', 'Dọn bàn', 'Tư vấn món'].map(x => `<button class="chip" data-act="nvNhanh" data-id="${x}">${x}</button>`).join('')}</div>
        <label class="o"><span>Yêu cầu</span><textarea id="nv-gc" rows="2" maxlength="200" placeholder="VD: cho thêm đá"></textarea></label>`;
      $('#ngan-chan').innerHTML = `<button class="btn chinh lon" data-act="guiNV" ${S.gui ? 'disabled' : ''}>Gọi nhân viên</button>`;
    }
  }

  /* ---------- Thao tác ---------- */
  function them(ma) {
    const s = S.dm.sanPham.find(x => x.MA_SAN_PHAM === ma); if (!s) return;
    const g = S.gio.find(x => x.ma === ma && !x.gc);
    if (g) { if (g.sl < 20) g.sl++; } else S.gio.push({ma, ten: s.TEN_SAN_PHAM, gia: s.GIA_BAN, sl: 1, gc: ''});
    renderMenu(); renderThanh();
  }
  function bot(ma) {
    for (let i = S.gio.length - 1; i >= 0; i--) if (S.gio[i].ma === ma) { if (--S.gio[i].sl <= 0) S.gio.splice(i, 1); break; }
    renderMenu(); renderThanh();
  }
  /** Gửi yêu cầu kiểu "lạc quan": hiện ngay trên màn hình, máy chủ xác nhận ở nền (không bắt khách chờ) */
  function guiYC(body, moTa, khiLoi, them) {
    const tam = Object.assign({MA_YEU_CAU: 'tam' + Date.now(), LOAI: body.loai, TRANG_THAI: 'Đang gửi', MO_TA: moTa}, them || {});
    S.yc.push(tam); renderYC();
    window.scrollTo({top: 0, behavior: 'smooth'});
    const thu = lan => goi(null, body, 40).then(kq => {
      tam.MA_YEU_CAU = kq.MA_YEU_CAU; tam.TRANG_THAI = kq.TRANG_THAI; S.tGui = Date.now(); luuYC(); renderYC(); lich();
      toast(body.loai === 'Gọi món' ? (S.dm.cheDo === 'Gửi thẳng quầy pha chế' ? 'Đã gửi món tới quầy pha chế!' : 'Đã gửi! Nhân viên sẽ xác nhận ngay.')
        : body.loai === 'Xin thanh toán' ? 'Đã báo nhân viên mang hóa đơn tới.' : 'Đã gọi nhân viên, vui lòng đợi trong giây lát.', 'ok');
    }).catch(e => {
      /* lỗi mạng: thử lại 1 lần; lỗi nghiệp vụ (hết món, quá nhiều yêu cầu...) thì báo ngay */
      if (lan < 1 && e.kyThuat) return thu(lan + 1);
      S.yc.splice(S.yc.indexOf(tam), 1); renderYC();
      toast(e.message, 'loi');
      if (khiLoi) khiLoi();
    });
    thu(0);
  }
  function guiMon() {
    if (!S.gio.length) return;
    const gio = S.gio, ghiChu = S.ghiChu;
    const moTa = gio.map(g => g.sl + '× ' + g.ten).join(', ');
    /* Đánh số đơn: lần đầu là "Đơn 1", các lần sau (hoặc bàn đã có món nhân viên gọi) là "Gọi thêm" */
    const truoc = S.yc.filter(y => y.LOAI === 'Gọi món' && !/Từ chối|Lỗi gửi|Đã hủy/.test(y.TRANG_THAI)).length;
    const them = {LAN: truoc + 1, THEM: truoc > 0 || !!(S.don && S.don.mon && S.don.mon.length), MON: gio.map(g => ({ten: g.ten, sl: g.sl}))};
    guiYC({api: 'dat', loai: 'Gọi món', items: gio.map(g => ({ma: g.ma, sl: g.sl, gc: g.gc})), ten: S.ten, ghiChu}, moTa,
      () => { S.gio = gio; S.ghiChu = ghiChu; renderMenu(); renderThanh(); }, them);
    S.gio = []; S.ghiChu = ''; dongNgan(); renderMenu(); renderThanh();
  }
  function guiNV(noiDung) {
    guiYC({api: 'dat', loai: 'Gọi nhân viên', ghiChu: noiDung, ten: S.ten}, noiDung || 'Cần hỗ trợ tại bàn');
    dongNgan();
  }
  /* Khách trả tiền tại quầy rồi mới chọn bàn: nhập mã nhận bàn để quán biết mang đồ ra bàn nào */
  function nhanBan() {
    const o = $('#ma-nb'), ma = (o ? o.value : '').replace(/\D/g, '');
    if (ma.length !== 4) { toast('Mã nhận bàn gồm 4 chữ số.', 'loi'); if (o) o.focus(); return; }
    if (S.gui) return;
    S.gui = true; veNgan();
    const thu = lan => goi(null, {api: 'ngoi', ma}, 40).then(kq => {
      S.gui = false; dongNgan();
      toast('Đã nhận ' + kq.TEN_BAN + ' – order #' + kq.SO + ' sẽ được mang ra bàn này ☕', 'ok');
      capNhat(true);
    }).catch(e => {
      if (lan < 1 && e.kyThuat) return thu(lan + 1);
      S.gui = false; if (S.ngan === 'ngoi') { veNgan(); const o2 = $('#ma-nb'); if (o2) o2.value = ma; }
      toast(e.message, 'loi');
    });
    thu(0);
  }
  function xinTT(pt) {
    guiYC({api: 'dat', loai: 'Xin thanh toán', phuongThuc: pt, ten: S.ten}, pt);
    dongNgan();
  }

  /* ---------- Theo dõi trạng thái ---------- */
  let hen;
  let demTT = 0, dangHoi = false;
  /** Hỏi trạng thái: chỉ hỏi các yêu cầu còn chờ; hóa đơn của bàn chỉ lấy khi khách mở xem hoặc mỗi ~1 phút */
  async function capNhat(canDon) {
    if (dangHoi) return;
    const ma = S.yc.filter(y => !XONG_HAN.test(y.TRANG_THAI) && y.TRANG_THAI !== 'Đang gửi' && !/^tam/.test(y.MA_YEU_CAU)).map(y => y.MA_YEU_CAU);
    const layDon = canDon || S.ngan === 'don' || (++demTT % 6 === 0);
    if (!ma.length && !layDon) return;
    dangHoi = true;
    try {
      const kq = await goi({api: 'tt', ma: ma.join(','), don: layDon ? 1 : 0});
      let doi = false;
      (kq.yeuCau || []).forEach(n => { const y = S.yc.find(x => x.MA_YEU_CAU === n.MA_YEU_CAU);
        if (!y) return;
        if (y.XONG !== n.XONG || y.TONG !== n.TONG || String(y.XI) !== String(n.XI || [])) { y.XONG = n.XONG; y.TONG = n.TONG; y.XI = n.XI || []; doi = true; }
        if (y.TRANG_THAI !== n.TRANG_THAI) { y.TRANG_THAI = n.TRANG_THAI; y.LY_DO = n.LY_DO; doi = true;
          if (n.TRANG_THAI === 'Đã xác nhận') { toast('Quán đã nhận món của bạn – đang pha chế ☕', 'ok'); bao(1); }
          if (n.TRANG_THAI === 'Đã pha xong') { toast('Món của bạn đã xong – nhân viên đang mang ra 🥤', 'ok'); bao(2); }
          if (n.TRANG_THAI === 'Đã thanh toán') toast('Đã thanh toán. Cảm ơn quý khách!', 'ok');
          if (n.TRANG_THAI === 'Đã xử lý' && y.LOAI !== 'Gọi món') { toast(y.LOAI === 'Xin thanh toán' ? 'Nhân viên đang mang hóa đơn tới.' : 'Nhân viên đã nhận, đang tới bàn bạn.', 'ok'); bao(1); }
          if (n.TRANG_THAI === 'Đã hủy') toast('Đơn đã bị hủy' + (n.LY_DO ? ': ' + n.LY_DO : ''), 'loi');
          if (n.TRANG_THAI === 'Từ chối') toast('Yêu cầu không thực hiện được' + (n.LY_DO ? ': ' + n.LY_DO : ''), 'loi'); } });
      if (doi) { luuYC(); renderYC(); }
      if (!('don' in kq)) return;
      const cu = JSON.stringify(S.don); S.don = kq.don;
      if (cu !== JSON.stringify(S.don)) { const nut = document.querySelector('[data-act="xemDon"]'); if (nut) nut.innerHTML = nhanDon(); if (S.ngan === 'don') veNgan(); }
    } catch (e) { /* mạng chập chờn: thử lại lần sau */ }
    finally { dangHoi = false; }
  }
  function lich() {
    clearTimeout(hen);
    const dangCho = S.yc.some(y => /Chờ|Đang|Đã xác nhận/.test(y.TRANG_THAI));
    const doiTT = S.yc.some(y => y.TRANG_THAI === 'Đã pha xong');
    /* Vừa gửi (2 phút đầu): hỏi 2 giây/lần – rất nhẹ vì máy chủ chỉ đọc bộ nhớ chung; đang pha: 4 giây; đã xong, chờ thanh toán: 5 giây; không còn gì: 60 giây */
    const moiGui = Date.now() - (S.tGui || 0) < 120000;
    hen = setTimeout(async () => { if (!document.hidden) await capNhat(); lich(); }, dangCho ? (moiGui ? 2000 : 4000) : doiTT ? 5000 : 60000);
  }
  function theoDoiNhanh() { lich(); }
  /* Rung + tiếng "ting" khi trạng thái đổi (trình duyệt chỉ cho phát sau khi khách đã chạm vào trang) */
  let AC = null;
  function bao(lan) {
    try { if (navigator.vibrate) navigator.vibrate(lan > 1 ? [200, 100, 200] : 150); } catch (e) {}
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
      (lan > 1 ? [[784, 0], [1047, .15], [1319, .3]] : [[988, 0]]).forEach(([f, t]) => {
        const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + t;
        o.frequency.value = f; o.connect(g); g.connect(AC.destination);
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
        o.start(t0); o.stop(t0 + 0.5);
      });
    } catch (e) {}
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act, id = t.dataset.id;
    if (a === 'them') them(id);
    else if (a === 'bot') bot(id);
    else if (a === 'nhom') { S.nhom = id; renderMenu(); window.scrollTo({top: $('.loc').offsetTop - 0, behavior: 'smooth'}); }
    else if (a === 'gio') moNgan('gio');
    else if (a === 'dong') dongNgan();
    else if (a === 'themG') { const g = S.gio[+id]; if (g.sl < 20) g.sl++; veNgan(); renderMenu(); renderThanh(); }
    else if (a === 'botG') { const g = S.gio[+id]; if (--g.sl <= 0) S.gio.splice(+id, 1); veNgan(); renderMenu(); renderThanh(); }
    else if (a === 'gui') guiMon();
    else if (a === 'goiNV') moNgan('nv');
    else if (a === 'nvNhanh') { const o = $('#nv-gc'); o.value = (o.value ? o.value + ', ' : '') + id; }
    else if (a === 'guiNV') guiNV($('#nv-gc').value.trim());
    else if (a === 'xemDon') { moNgan('don'); capNhat(true); }
    else if (a === 'xinTT') xinTT(id);
    else if (a === 'moNgoi') moNgan('ngoi');
    else if (a === 'goiThem') { const l = $('.loc'); if (l) window.scrollTo({top: l.offsetTop, behavior: 'smooth'}); toast('Chọn món muốn gọi thêm rồi bấm "Gọi thêm" ở dưới cùng.', ''); }
    else if (a === 'nhanBan') nhanBan();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.dm) capNhat(true); });

  /* ---------- Khởi động ---------- */
  (async function () {
    if (!B || !K) { loiMan('Hãy quét mã QR dán trên bàn để gọi món.'); return; }
    try {
      const cham = setTimeout(() => { const c = $('#cho-chu'); if (c) c.textContent = 'Đang kết nối máy chủ của quán… (lần đầu có thể mất vài giây)'; }, 4000);
      try { S.dm = await goi({api: 'menu'}); } finally { clearTimeout(cham); }
      S.don = S.dm.don; S.yc = docYC();
      render(); if (S.yc.length) capNhat(); lich();
    } catch (e) { loiMan(e.message, e.kyThuat); }
  })();
})();
</script>
</body>
</html>
