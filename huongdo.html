<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Hường Đỗ Pickleball</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}
    #appFrame{display:block;width:100%;height:100dvh;border:0;background:#f4f7fb}
  </style>
</head>
<body>
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyfiMKylnv0uTMR84fCWXuApOgj4EiWTMvReQftLWUBAdzTVihH0qR9VOtlfz1ESO_tVA/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
  (()=>{
    const STORAGE_KEY='pb_login_saved_credentials_v1';
    const frame=document.getElementById('appFrame');
    function readSaved(){
      try{
        const raw=localStorage.getItem(STORAGE_KEY);
        return raw?JSON.parse(raw):null;
      }catch(e){return null;}
    }
    function sendSaved(){
      try{frame.contentWindow.postMessage({type:'HUONGDO_AUTH_DATA',key:STORAGE_KEY,data:readSaved()},'*');}catch(e){}
    }
    window.addEventListener('message',ev=>{
      if(ev.source!==frame.contentWindow)return;
      const msg=ev.data||{};
      if(msg.key!==STORAGE_KEY)return;
      if(msg.type==='HUONGDO_AUTH_GET'){
        sendSaved();
      }else if(msg.type==='HUONGDO_AUTH_SAVE'){
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(msg.data||{}));}catch(e){}
      }else if(msg.type==='HUONGDO_AUTH_CLEAR'){
        try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
      }
    });
    frame.addEventListener('load',()=>{setTimeout(sendSaved,150);setTimeout(sendSaved,700);});
  })();
  </script>
</body>
</html>
