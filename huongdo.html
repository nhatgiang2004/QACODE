  <!--
  ==========================================================

  Nếu sau này muốn thay icon:

  >

  <!-- File manifest PWA -->
  <link
    rel="manifest"
    href="./manifest-huongdo.json?v=1"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        145deg,
        #06172d 0%,
        #0b4a87 55%,
        #0877be 100%
      );

    .spinner {
      width: 36px;

      margin: auto;

        transform: rotate(360deg);
      }
    }
  </style>
</head>


<body>

  <div class="loading-box">

    <!-- Logo hiển thị lúc đang mở hệ thống -->
    <img
      src="./icon/logo.png?v=1"
      class="logo"
      alt="Hường Đỗ Pickleball"
    >

    <div class="title">
      HƯỜNG ĐỖ PICKLEBALL
    </div>

    <div
      class="sub-title"
      id="statusText"
    >
      Đang mở hệ thống...
    </div>

    <div
      class="spinner"
      id="spinner"
    ></div>

  </div>


  <script>
    /*
    ==========================================================
    QUAN TRỌNG - CHỈ THAY ĐOẠN NÀY KHI APPS SCRIPT ĐỔI LINK
    ==========================================================

    Khi anh Deploy Google Apps Script lại và có link mới:

    Ví dụ link mới:

    https://script.google.com/macros/s/AKfycbXXXXXXXXXXXX/exec

    thì chỉ cần thay toàn bộ nội dung nằm giữa 2 dấu " "
    ở biến APP_URL bên dưới.

    KHÔNG CẦN sửa các phần khác của file này.

    Link shortcut trên điện thoại vẫn giữ nguyên:

    https://nhatgiang2004.github.io/QACODE/huongdo.html

    ==========================================================
    */


    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyzxEXFML1bh2vvQLbrw6TCvREHZTxFI_PF-xO0m3zU6XIQHnWsPTGkvvgyOucOHBaV/exec";


    /*
    ==========================================================
    KHÔNG CẦN SỬA PHẦN BÊN DƯỚI
    ==========================================================
    */


    const statusText =
      document.getElementById("statusText");

    const spinner =
      document.getElementById("spinner");


    function isValidAppUrl(url) {

      return (
        typeof url === "string" &&
        url.startsWith(
          "https://script.google.com/macros/s/"
        ) &&
        url.endsWith("/exec")
      );

    }


    function showError(message) {

      statusText.textContent =
        message;

      spinner.style.display =
        "none";

    }


    function openApp() {

      /*
      Kiểm tra xem link Apps Script
      đã được nhập đúng chưa.
      */

      if (!isValidAppUrl(APP_URL)) {

        showError(
          "Link hệ thống chưa đúng. Vui lòng kiểm tra APP_URL."
        );

        return;
      }


      /*
      Mở ứng dụng.

      Dùng replace() để khi bấm nút Back
      không quay lại màn hình "Đang mở hệ thống".
      */

      window.location.replace(
        APP_URL
      );

    }


    /*
    Khi trang GitHub tải xong,
    chờ 300ms rồi mở Apps Script.
    */

    window.addEventListener(
      "load",
      function () {

        setTimeout(
          openApp,
          300
        );

      }
    );

  </script>

</body>
</html>
