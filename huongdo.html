<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <!-- ============================================
       HIỂN THỊ CHUẨN TRÊN MOBILE
       ============================================ -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Hường Đỗ Pickleball</title>

  <!-- Màu giao diện trên Android -->
  <meta name="theme-color" content="#0b4a87">

  <!-- ============================================
       CẤU HÌNH CHẠY NHƯ APP TRÊN IPHONE / IPAD
       ============================================ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Hường Đỗ"
  >


  <!-- ============================================
       ICON APP TRÊN IPHONE
       ============================================

       File phải đặt tại:

       QACODE/icon/icon-180.png

       Kích thước chuẩn:
       180 x 180 px

       Khi đổi icon:
       1. thay file icon-180.png
       2. đổi ?v=3 thành ?v=4

       ============================================ -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./icon/icon-180.png?v=4"
  >


  <!-- ============================================
       ICON ANDROID / TRÌNH DUYỆT
       ============================================ -->

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon/icon-180.png?v=4"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./icon/icon-180.png?v=4"
  >


  <!-- ============================================
       FILE PWA MANIFEST
       ============================================

       File phải nằm cùng thư mục với huongdo.html:

       QACODE/manifest-huongdo.json

       ============================================ -->
  <link
    rel="manifest"
    href="./manifest-huongdo.json?v=3"
  >


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;

      background:
        linear-gradient(
          145deg,
          #06172d 0%,
          #0b4a87 55%,
          #0877be 100%
        );

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      overflow: hidden;
    }


    .loading-box {
      width: 90%;
      max-width: 380px;

      text-align: center;

      padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom));
    }


    .logo {
      width: 105px;
      height: 105px;

      margin: 0 auto 22px;

      border-radius: 24px;

      object-fit: cover;

      display: block;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.28);
    }


    .title {
      margin-bottom: 8px;

      font-size: 22px;
      font-weight: 700;

      line-height: 1.3;
    }


    .sub-title {
      margin-bottom: 25px;

      font-size: 14px;
      font-weight: 400;

      opacity: 0.85;

      line-height: 1.5;
    }


    .spinner {
      width: 36px;
      height: 36px;

      margin: auto;

      border: 4px solid
        rgba(255, 255, 255, 0.25);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }


    .error-text {
      color: #ffffff;
      font-weight: 700;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

  </style>
</head>


<body>

  <div class="loading-box">

    <!-- ==========================================
         LOGO HIỂN THỊ KHI ĐANG MỞ APP

         Đang dùng icon-192.png

         Khi thay icon chính, phần này cũng
         tự thay theo nếu file icon-192.png đổi.
         ========================================== -->

    <img
      src="./icon/icon-192.png?v=3"
      class="logo"
      id="appLogo"
      alt="Hường Đỗ Pickleball"
    >


    <div class="title">
      HƯỜNG ĐỖ PICKLEBALL
    </div>


    <div
      class="sub-title"
      id="statusText"
    >
      Đang mở hệ thống...
    </div>


    <div
      class="spinner"
      id="spinner"
    ></div>

  </div>


  <script>

    /*
    ============================================================
    ============================================================
    QUAN TRỌNG NHẤT
    SAU NÀY KHI APPS SCRIPT ĐỔI LINK
    CHỈ CẦN THAY ĐÚNG ĐOẠN APP_URL BÊN DƯỚI
    ============================================================
    ============================================================


    LINK SHORTCUT TRÊN ĐIỆN THOẠI LUÔN GIỮ NGUYÊN:

    https://nhatgiang2004.github.io/QACODE/huongdo.html


    Ví dụ Apps Script mới có link:

    https://script.google.com/macros/s/AKfycbXXXXXXXXXXXX/exec


    thì chỉ thay giá trị trong APP_URL.


    KHÔNG cần:
    - đổi shortcut;
    - cài lại link;
    - đổi huongdo.html;
    - đổi tên file.


    ============================================================
    */


    const APP_URL =
      "https://script.google.com/macros/s/AKfycbwWaxwFUIkHOveuIBMn1coj159C4ZHDzobyQVbP47VxHioyCuUeersUCvtOLsk99SHh/exec";


    /*
    ============================================================
    KHÔNG CẦN SỬA PHẦN BÊN DƯỚI
    ============================================================
    */


    const statusText =
      document.getElementById("statusText");


    const spinner =
      document.getElementById("spinner");


    /*
    ============================================================
    KIỂM TRA LINK APPS SCRIPT
    ============================================================
    */

    function isValidAppUrl(url) {

      if (!url) {
        return false;
      }


      if (typeof url !== "string") {
        return false;
      }


      if (
        !url.startsWith(
          "https://script.google.com/macros/s/"
        )
      ) {
        return false;
      }


      if (
        !url.includes("/exec")
      ) {
        return false;
      }


      return true;
    }


    /*
    ============================================================
    HIỂN THỊ LỖI
    ============================================================
    */

    function showError(message) {

      statusText.textContent =
        message;


      statusText.classList.add(
        "error-text"
      );


      spinner.style.display =
        "none";
    }


    /*
    ============================================================
    MỞ APPS SCRIPT
    ============================================================
    */

    function openApp() {

      /*
      --------------------------------------------
      Kiểm tra link trước khi mở
      --------------------------------------------
      */

      if (
        !isValidAppUrl(APP_URL)
      ) {

        showError(
          "Link hệ thống chưa đúng. Vui lòng kiểm tra APP_URL."
        );

        return;
      }


      /*
      --------------------------------------------
      THÊM THAM SỐ CHỐNG CACHE MOBILE

      Ví dụ:

      /exec?_v=1791430000000

      Giá trị tự thay đổi mỗi lần mở.
      Không cần chỉnh tay.
      --------------------------------------------
      */


      const separator =
        APP_URL.includes("?")
          ? "&"
          : "?";


      const freshUrl =
        APP_URL +
        separator +
        "_v=" +
        Date.now();


      /*
      --------------------------------------------
      CHUYỂN SANG WEB APP

      replace() giúp khi người dùng bấm Back
      không quay lại màn hình "Đang mở..."
      --------------------------------------------
      */

      window.location.replace(
        freshUrl
      );

    }


    /*
    ============================================================
    KHI TRANG GITHUB TẢI XONG
    ============================================================

    Chờ 500ms để:
    - logo hiển thị;
    - manifest được đọc;
    - giao diện khởi động;
    - sau đó mới chuyển sang Apps Script.

    ============================================================
    */

    window.addEventListener(
      "load",
      function () {

        setTimeout(
          openApp,
          500
        );

      }
    );

  </script>

</body>
</html>
