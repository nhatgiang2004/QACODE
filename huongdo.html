<!DOCTYPE html>

<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Chống cache -->

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Tiêu đề -->

  <title>PICKLEBALL</title>

  <!-- Icon hiển thị trên tab trình duyệt -->

  <link rel="icon" type="image/png" href="icon/logo.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loading {
      width: 100%;
      max-width: 400px;
      text-align: center;
      padding: 30px 20px;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .message {
      font-size: 16px;
      color: #666;
      margin-bottom: 22px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto;
      border: 4px solid #e5e5e5;
      border-top: 4px solid #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>

</head>

<body>

  <div class="loading">

```
<!--
  Icon lấy từ thư mục icon trên GitHub.
  Nếu tên file khác, đổi logo.png thành tên file thực tế.
-->
<img
  src="icon/logo.png"
  alt="Pickleball"
  class="logo"
  onerror="this.style.display='none';"
>

<div class="title">
  PICKLEBALL
</div>

<div class="message">
  Đang mở hệ thống...
</div>

<div class="spinner"></div>
```

  </div>

  <script>
    // Google Apps Script
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyzxEXFML1bh2vvQLbrw6TCvREHZTxFI_PF-xO0m3zU6XIQHnWsPTGkvvgyOucOHBaV/exec";

    // Thêm timestamp để tránh cache
    const separator = APP_URL.includes("?") ? "&" : "?";

    const url =
      APP_URL +
      separator +
      "v=" +
      Date.now();

    // Chuyển sang hệ thống Apps Script
    window.location.replace(url);
  </script>

</body>
</html>
