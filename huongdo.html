<script>

  /*
  ==========================================================
  CHỈ THAY LINK NÀY KHI GOOGLE APPS SCRIPT ĐỔI URL /exec
  ==========================================================
  */

  const APP_URL =
    "https://script.google.com/macros/s/AKfycbwWaxwFUIkHOveuIBMn1coj159C4ZHDzobyQVbP47VxHioyCuUeersUCvtOLsk99SHh/exec";


  /*
  ==========================================================
  KHÔNG CẦN SỬA PHẦN BÊN DƯỚI
  ==========================================================
  */

  const statusText =
    document.getElementById("statusText");

  const spinner =
    document.getElementById("spinner");


  function isValidAppUrl(url) {

    return (
      typeof url === "string" &&
      url.startsWith(
        "https://script.google.com/macros/s/"
      ) &&
      url.includes("/exec")
    );

  }


  function showError(message) {

    statusText.textContent = message;

    spinner.style.display = "none";

  }


  function openApp() {

    if (!isValidAppUrl(APP_URL)) {

      showError(
        "Link hệ thống chưa đúng. Vui lòng kiểm tra APP_URL."
      );

      return;
    }


    /*
    ==========================================================
    CHỐNG CACHE TRÊN MOBILE

    Mỗi lần mở app sẽ tự thêm một mã thời gian mới.
    Ví dụ:

    /exec?_v=1791430000000

    Không cần chỉnh tay.
    ==========================================================
    */

    const separator =
      APP_URL.includes("?")
        ? "&"
        : "?";

    const freshUrl =
      APP_URL +
      separator +
      "_v=" +
      Date.now();


    window.location.replace(
      freshUrl
    );

  }


  window.addEventListener(
    "load",
    function () {

      setTimeout(
        openApp,
        300
      );

    }
  );

</script>
