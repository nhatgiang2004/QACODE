<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Hường Đỗ Pickleball</title>

  <meta name="theme-color" content="#0b4a87">

  <!-- iPhone / iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Hường Đỗ"
  >

  <!-- ICON IPHONE -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./icon/icon-180.png?v=6"
  >

  <!-- ICON ANDROID / BROWSER -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon/icon-192.png?v=6"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./icon/icon-512.png?v=6"
  >

  <!-- PWA -->
  <link
    rel="manifest"
    href="./manifest-huongdo.json?v=6"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #06172d 0%,
          #0b4a87 55%,
          #0877be 100%
        );

      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;

      overflow: hidden;
    }

    .app-box {
      width: 90%;
      max-width: 380px;

      text-align: center;

      padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom));
    }

    .logo {
      width: 110px;
      height: 110px;

      margin: 0 auto 22px;

      border-radius: 24px;

      object-fit: cover;
      display: block;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.28);
    }

    .title {
      margin-bottom: 8px;

      font-size: 22px;
      font-weight: 700;
    }

    .sub-title {
      margin-bottom: 24px;

      font-size: 14px;
      line-height: 1.5;

      opacity: 0.88;
    }

    .open-btn {
      width: 100%;

      border: 0;
      border-radius: 14px;

      padding: 15px 20px;

      background: #ffffff;
      color: #0b4a87;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.20);
    }

    .open-btn:active {
      transform: scale(0.98);
    }

    .spinner {
      width: 34px;
      height: 34px;

      margin: 24px auto 0;

      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="app-box">

    <img
      src="./icon/icon-180.png?v=6"
      class="logo"
      alt="Hường Đỗ Pickleball"
    >

    <div class="title">
      HƯỜNG ĐỖ PICKLEBALL
    </div>

    <div
      class="sub-title"
      id="statusText"
    >
      Kích "Mở hệ thống" để vào quản lý
    </div>

    <button
      class="open-btn"
      id="openBtn"
      onclick="openApp()"
    >
      MỞ HỆ THỐNG
    </button>

    <div
      class="spinner"
      id="spinner"
    ></div>

  </div>


  <script>

    /*
    ==========================================================
    CHỈ THAY ĐOẠN NÀY KHI GOOGLE APPS SCRIPT ĐỔI LINK
    ==========================================================
    */

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbwFr7U1sPz2sULO1BAdsRihX8IJgT5NPDhPRGv-oQdRyg8Soc3WLz9yGgEiyKx4XEGR/exec";


    /*
    ==========================================================
    KHÔNG CẦN SỬA PHẦN BÊN DƯỚI
    ==========================================================
    */

    const statusText =
      document.getElementById("statusText");

    const openBtn =
      document.getElementById("openBtn");

    const spinner =
      document.getElementById("spinner");


    function isValidAppUrl(url) {

      return (
        typeof url === "string" &&
        url.startsWith(
          "https://script.google.com/macros/s/"
        ) &&
        url.includes("/exec")
      );

    }


    function openApp() {

      if (!isValidAppUrl(APP_URL)) {

        statusText.textContent =
          "Link hệ thống chưa đúng. Vui lòng kiểm tra APP_URL.";

        return;
      }


      openBtn.style.display =
        "none";

      spinner.style.display =
        "block";

      statusText.textContent =
        "Đang mở hệ thống...";


      const separator =
        APP_URL.includes("?")
          ? "&"
          : "?";


      const freshUrl =
        APP_URL +
        separator +
        "_v=" +
        Date.now();


      window.location.replace(
        freshUrl
      );

    }


    /*
    ==========================================================
    KIỂM TRA CÓ ĐANG CHẠY TỪ ICON NGOÀI MÀN HÌNH CHÍNH KHÔNG
    ==========================================================

    - Nếu mở bằng Safari:
      KHÔNG tự chuyển.
      Anh có thời gian chọn "Thêm vào Màn hình chính".

    - Nếu mở từ icon đã cài:
      TỰ ĐỘNG vào Apps Script.

    ==========================================================
    */

    function isStandaloneMode() {

      return (
        window.navigator.standalone === true ||
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches
      );

    }


    window.addEventListener(
      "load",
      function () {

        if (isStandaloneMode()) {

          statusText.textContent =
            "Đang mở hệ thống...";

          openBtn.style.display =
            "none";

          spinner.style.display =
            "block";


          setTimeout(
            openApp,
            350
          );

        }

      }
    );

  </script>

</body>
</html>
