<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
<style>
:root{--brand:#0b6e75;--brand-d:#08545a;--brand-soft:#e3f1f1;--sand:#f6f1e9;--sand-2:#efe6d8;--ink:#13262b;--ink-2:#41565b;--muted:#6b7b80;--line:#e4ddd1;--card:#fff;--coral:#e0703a;--coral-d:#c45a27;--ok:#1f7a4d;--bad:#b3261e;--r:18px;--shadow:0 10px 30px rgba(19,38,43,.08)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.6 'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em}
.serif{font-family:'Playfair Display',Georgia,serif}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}
.muted{color:var(--muted)}
/* nut */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:11px 20px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:.15s}
.btn:hover{background:var(--ink);color:#fff}
.btn.cta{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.cta:hover{background:var(--coral-d);border-color:var(--coral-d)}
.btn.light{border-color:rgba(255,255,255,.7);color:#fff}
.btn.light:hover{background:#fff;color:var(--ink)}
.btn.sm{padding:8px 15px;font-size:14px}
.btn svg{width:18px;height:18px}
/* dau trang */
header.top{position:fixed;inset:0 0 auto 0;z-index:40;transition:background .2s,box-shadow .2s}
header.top .in{display:flex;align-items:center;gap:22px;height:70px}
header.top.solid{background:rgba(246,241,233,.96);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#fff}
header.top.solid .logo,header.top.dark .logo{color:var(--ink)}
.logo i{width:38px;height:38px;border-radius:11px;background:var(--brand);display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo i svg{width:22px;height:22px}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main button{border:0;background:none;color:#fff;font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:999px}
header.top.solid nav.main button,header.top.dark nav.main button{color:var(--ink-2)}
nav.main button:hover{background:rgba(255,255,255,.16)}
header.top.solid nav.main button:hover,header.top.dark nav.main button:hover{background:var(--sand-2)}
.menu-btn{display:none;border:0;background:none;color:#fff;padding:6px;margin-left:auto}
header.top.solid .menu-btn,header.top.dark .menu-btn{color:var(--ink)}
.menu-btn svg{width:28px;height:28px}
/* hero */
.hero{position:relative;min-height:min(92vh,820px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#0d3d45}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s;transform:scale(1.04)}
.hero .bg.on{opacity:1;animation:kb 12s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.hero .art{position:absolute;inset:0}
.hero .art svg{width:100%;height:100%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,30,35,.35) 0%,rgba(8,30,35,.05) 35%,rgba(8,30,35,.65) 100%)}
.hero .in{position:relative;z-index:2;padding:140px 20px 46px;width:100%}
.hero h1{font-size:clamp(40px,6.4vw,78px);max-width:16ch;text-shadow:0 2px 24px rgba(0,0,0,.2)}
.hero h1 em{font-style:italic;color:#ffd7b8}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);max-width:52ch;margin:16px 0 0;opacity:.94}
.hero .facts{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero .facts div{display:flex;flex-direction:column}.hero .facts b{font-size:26px;font-family:'Playfair Display',serif}.hero .facts span{font-size:13px;opacity:.85}
/* khung tim phong */
.search{margin-top:30px;background:#fff;color:var(--ink);border-radius:22px;padding:10px;display:grid;grid-template-columns:1.1fr 1.1fr .8fr .8fr auto;gap:6px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:980px}
.search label{display:flex;flex-direction:column;padding:8px 14px;border-radius:14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.search label:hover{background:var(--sand)}
.search input{border:0;outline:0;background:none;font:600 16px 'Be Vietnam Pro',sans-serif;color:var(--ink);padding:2px 0;width:100%;min-width:0}
.search .go{border-radius:16px;padding:0 26px;font-size:16px}
.notice{background:var(--coral);color:#fff;text-align:center;font-weight:600;font-size:14px;padding:8px 16px}
/* ket qua tim */
.results{margin:-10px auto 0;position:relative;z-index:5}
.results .box{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-top:22px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.rcard{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rcard.no{opacity:.6}
.rcard .opt{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14.5px;padding:8px 0;border-top:1px dashed var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:#e2f3ea;color:var(--ok)}.pill.no{background:#f8e3e1;color:var(--bad)}
/* muc */
section.sec{padding:90px 0}
section.sec.alt{background:#fff}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(30px,3.6vw,46px);margin-top:8px}
.sec-h p{max-width:54ch;margin:10px 0 0;color:var(--ink-2)}
.intro{display:grid;grid-template-columns:1.05fr 1fr;gap:60px;align-items:center}
.intro .txt p{font-size:17px;color:var(--ink-2);white-space:pre-line}
.intro .pics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.intro .pics .ph{aspect-ratio:3/4;border-radius:var(--r)}
.intro .pics .ph:nth-child(2){margin-top:40px}
.stats{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap}
.stats b{display:block;font-family:'Playfair Display',serif;font-size:38px;color:var(--brand);line-height:1}
.stats span{font-size:13.5px;color:var(--muted)}
/* anh / o giu cho anh */
.ph{background:var(--sand-2);background-size:cover;background-position:center;position:relative;overflow:hidden}
.ph.empty{display:flex;align-items:center;justify-content:center}
.ph.empty svg{width:34%;max-width:120px;opacity:.9}
/* the co so */
.props{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.pcard{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;cursor:pointer}
.pcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(19,38,43,.13)}
.pcard .ph{aspect-ratio:4/3}
.pcard .kind{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.94);color:var(--ink);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.pcard .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard h3{font-size:24px}
.pcard .addr{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pcard .addr svg{width:15px;height:15px;flex:none}
.pcard .desc{color:var(--ink-2);font-size:15px}
.pcard .meta{display:flex;gap:14px;font-size:13.5px;color:var(--ink-2);flex-wrap:wrap}
.pcard .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.price small{display:block;font-size:12px;color:var(--muted)}
.price b{font-size:21px;font-weight:700;color:var(--ink)}
.price i{font-style:normal;font-size:13px;color:var(--muted)}
/* tien ich */
.ams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.am{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-weight:600;font-size:14.5px}
.am i{width:38px;height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;flex:none}
.am i svg{width:20px;height:20px}
/* dich vu */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.sgroup{background:var(--sand);border-radius:var(--r);padding:22px}
.sgroup h3{font-size:22px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.sgroup h3 i{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.sgroup h3 i svg{width:18px;height:18px}
.sitem{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sitem:last-child{border:0}
.sitem b{white-space:nowrap;font-weight:600}
/* thu vien */
.gal{columns:3 260px;column-gap:14px}
.gal button{border:0;padding:0;margin:0 0 14px;width:100%;border-radius:14px;overflow:hidden;display:block;background:var(--sand-2);break-inside:avoid}
.gal img{width:100%;transition:transform .4s}
.gal button:hover img{transform:scale(1.04)}
.lb{position:fixed;inset:0;background:rgba(8,20,23,.92);z-index:90;display:flex;align-items:center;justify-content:center;padding:30px}
.lb img{max-height:86vh;max-width:92vw;border-radius:10px}
.lb .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:46px;height:46px;border-radius:50%;font-size:24px}
.lb .x{top:18px;right:18px}.lb .pv{left:18px;top:50%}.lb .nx{right:18px;top:50%}
/* cam nhan */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.rev{background:#fff;border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.rev .st{color:#e3a008;letter-spacing:2px}
.rev p{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;margin:10px 0 14px}
/* hoi dap */
.faq{max-width:860px}
.faq details{background:#fff;border-radius:14px;margin-bottom:10px;border:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:17px 20px;font-weight:600;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-size:22px;line-height:1;color:var(--brand)}
.faq details[open] summary::after{content:'\2212'}
.faq details div{padding:0 20px 18px;color:var(--ink-2);white-space:pre-line}
/* lien he */
.contact{display:grid;grid-template-columns:1fr 1.25fr;gap:30px;align-items:stretch}
.cbox{background:var(--ink);color:#fff;border-radius:22px;padding:34px;display:flex;flex-direction:column;gap:18px}
.cbox h2{font-size:34px}
.cline{display:flex;gap:14px;align-items:flex-start;text-decoration:none}
.cline i{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;flex:none}
.cline i svg{width:20px;height:20px}
.cline span{display:block;font-size:12.5px;opacity:.7}.cline b{font-weight:600}
.map{border-radius:22px;overflow:hidden;min-height:380px;background:var(--sand-2)}
.map iframe{border:0;width:100%;height:100%;min-height:380px;display:block}
footer{background:#0e1f23;color:rgba(255,255,255,.75);padding:50px 0 90px;font-size:14px}
footer .in{display:flex;gap:30px;justify-content:space-between;flex-wrap:wrap}
footer .logo{color:#fff}
footer a{color:#fff;opacity:.85}
footer .adm{display:inline-flex;gap:6px;align-items:center;font-size:13px;opacity:.6;text-decoration:none;margin-top:10px}
footer .adm:hover{opacity:1}
/* chi tiet co so */
.detail{padding-top:96px}
.back{border:0;background:none;color:var(--ink-2);font-weight:600;display:inline-flex;gap:6px;align-items:center;padding:6px 0;margin-bottom:12px;white-space:nowrap}
.back svg{width:18px;height:18px}
footer .adm svg{width:15px;height:15px}
.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:220px 220px;gap:10px;border-radius:22px;overflow:hidden}
.mosaic .ph{cursor:zoom-in}
.mosaic .ph:first-child{grid-row:span 2}
.mosaic.n1{grid-template-columns:1fr}.mosaic.n1 .ph{grid-row:span 2}
.mosaic.n2{grid-template-columns:2fr 1fr}.mosaic.n2 .ph:nth-child(2){grid-row:span 2}
.mosaic.n3{grid-template-columns:2fr 1fr}
.mosaic .more{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.95);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.dgrid{display:grid;grid-template-columns:1fr 360px;gap:46px;margin-top:34px;align-items:start}
.dgrid h1{font-size:clamp(34px,4vw,50px)}
.dgrid .lead{font-size:18px;color:var(--ink-2);margin:12px 0 0}
.dgrid .long{white-space:pre-line;color:var(--ink-2);font-size:16px}
.dsec{padding:30px 0;border-top:1px solid var(--line)}
.dsec h2{font-size:28px;margin-bottom:16px}
.types{display:grid;gap:14px}
.type{display:grid;grid-template-columns:180px 1fr auto;gap:18px;background:#fff;border-radius:16px;overflow:hidden;align-items:center;border:1px solid var(--line)}
.type .ph{height:100%;min-height:130px}
.type .tb{padding:14px 0}
.type h3{font-size:20px}
.type .tm{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-top:4px}
.type .tp{padding:16px 18px;text-align:right}
.bookcard{position:sticky;top:90px;background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(19,38,43,.12);padding:22px;display:flex;flex-direction:column;gap:12px}
.bookcard .price b{font-size:26px}
.bookcard .f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bookcard label{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bookcard input,.bookcard select{border:0;outline:0;font:600 15px 'Be Vietnam Pro',sans-serif;color:var(--ink);background:none;padding:2px 0;width:100%}
.bookcard .res{font-size:14px;border-radius:12px;padding:10px 12px;background:var(--sand)}
.bookcard .res.ok{background:#e2f3ea;color:var(--ok)}.bookcard .res.no{background:#f8e3e1;color:var(--bad)}
.bookcard .small{font-size:12.5px;color:var(--muted)}
.policy{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.policy div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14.5px}
.policy b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
/* thanh goi nhanh tren dien thoai */
.fab{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:10px}
.fab a{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.25);text-decoration:none;font-weight:800;font-size:13px}
.fab a svg{width:24px;height:24px}
.fab .call{background:var(--ok)}.fab .zl{background:#0068ff}
.mbar{display:none}
.mnav{position:fixed;inset:70px 0 auto 0;background:var(--sand);z-index:39;padding:10px 20px 20px;box-shadow:0 20px 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
.mnav button{border:0;background:none;text-align:left;padding:13px 4px;font-size:17px;font-weight:600;border-bottom:1px solid var(--line);color:var(--ink)}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.empty-note{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
@media (max-width:980px){
  .props{grid-template-columns:1fr 1fr}.intro,.contact,.dgrid{grid-template-columns:1fr}.intro{gap:34px}
  .search{grid-template-columns:1fr 1fr}.search .go{grid-column:1/-1;padding:14px}
  .bookcard{position:static}
  nav.main{display:none}.menu-btn{display:block}
}
@media (max-width:640px){
  .wrap{padding:0 16px}section.sec{padding:60px 0}
  .props{grid-template-columns:1fr}
  .hero .in{padding:110px 16px 30px}
  .search{border-radius:18px}
  .mosaic{grid-template-columns:1fr 1fr;grid-template-rows:200px 110px}.mosaic .ph:first-child{grid-column:span 2;grid-row:auto}.mosaic .ph:nth-child(n+4){display:none}
  .mosaic.n1 .ph,.mosaic.n2 .ph{grid-column:span 2}.mosaic.n2{grid-template-rows:200px 160px}
  .type{grid-template-columns:110px 1fr}.type .tp{grid-column:1/-1;text-align:left;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 16px}
  .fab{bottom:84px;right:14px}.fab a{width:50px;height:50px}
  header.top .btn.cta{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px 14px;gap:10px}
  .mbar .btn{flex:1}
  footer{padding-bottom:110px}
}
</style>
</head>

  });

const IC = {

function ph(img, color, ic, cls, attrs) {

function boot() {
  api('GET', '/api/public/site').then(d => {
    W.data = d;
    const c = d.site.color;
    if (c) { document.documentElement.style.setProperty('--brand', c); document.documentElement.style.setProperty('--brand-soft', `color-mix(in srgb, ${c} 12%, #fff)`); }
    W.q = { ci: d.today, co: addD(d.today, 1), ad: 2, ch: 0 };

}

function bookUrl(o) {

  return BASE_URL + '?' + q.join('&');
}

function render() {

}
function lightbox() {
  const [src, i] = W.lb, list = src === 'g' ? D().site.gallery : (D().properties.find(p => p.id === W.prop) || { images: [] }).images, it = list[i];

}
function go(k) {
  W.menu = false;
  if (k === 'home') { W.view = 'home'; W.prop = null; render(); window.scrollTo(0, 0); return; }
  if (W.view !== 'home') { W.view = 'home'; W.prop = null; render(); }
  else render();
  const el = document.getElementById(k);
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
}
function openProp(id) { W.view = 'prop'; W.prop = id; W.bk = null; W.menu = false; render(); window.scrollTo(0, 0); }
function bind() {
  document.querySelectorAll('[data-go]').forEach(x => x.onclick = e => { e.preventDefault(); go(x.dataset.go); });
  document.querySelectorAll('[data-prop]').forEach(x => x.onclick = e => { if (e.target.closest('a[href^="http"],a[href^="tel"]')) return; e.preventDefault(); openProp(x.dataset.prop); });
  const mb = document.querySelector('[data-menu]'); if (mb) mb.onclick = () => { W.menu = !W.menu; W.keepY = window.scrollY; render(); };
  const sf = $('#sf');
  if (sf) {
    $('#s-ci').onchange = e => { W.q.ci = e.target.value; if (W.q.co <= W.q.ci) { W.q.co = addD(W.q.ci, 1); $('#s-co').value = W.q.co; } $('#s-co').min = addD(W.q.ci, 1); };
    $('#s-co').onchange = e => { W.q.co = e.target.value; };
    sf.onsubmit = e => {
      e.preventDefault();
      W.q.ad = Math.max(1, +$('#s-ad').value || 1); W.q.ch = Math.max(0, +$('#s-ch').value || 0);
      W.search = { loading: true }; $('#results').innerHTML = resultsHtml();
      api('POST', '/api/public/search', { checkIn: W.q.ci, checkOut: W.q.co, adults: W.q.ad, children: W.q.ch })
        .then(r => { W.search = r; }).catch(err => { W.search = { error: err.message }; })
        .then(() => { $('#results').innerHTML = resultsHtml(); bindResults(); const el = $('#results'); window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' }); });
    };
  }
  bindResults();
  const chk = $('#b-chk');
  if (chk) {
    const b = W.bk;
    $('#b-ci').onchange = e => { b.ci = e.target.value; if (b.co <= b.ci) b.co = addD(b.ci, 1); b.res = null; W.keepY = window.scrollY; render(); };
    $('#b-co').onchange = e => { b.co = e.target.value; b.res = null; W.keepY = window.scrollY; render(); };
    $('#b-ad').onchange = e => { b.ad = Math.max(1, +e.target.value || 1); b.res = null; W.keepY = window.scrollY; render(); };
    $('#b-ch').onchange = e => { b.ch = Math.max(0, +e.target.value || 0); b.res = null; W.keepY = window.scrollY; render(); };
    chk.onclick = () => {
      b.res = { loading: true }; W.keepY = window.scrollY; render();
      api('POST', '/api/public/search', { checkIn: b.ci, checkOut: b.co, adults: b.ad, children: b.ch }).then(r => { b.res = r; }).catch(err => { b.res = { error: err.message }; }).then(() => { W.keepY = window.scrollY; render(); });
    };
  }
  document.querySelectorAll('[data-lb]').forEach(x => x.onclick = () => { const [s, i] = x.dataset.lb.split('|'); W.lb = [s, +i]; W.keepY = window.scrollY; render(); });
  const lb = document.querySelector('[data-lbx]');
  if (lb) {
    const close = () => { W.lb = null; W.keepY = window.scrollY; render(); };
    lb.onclick = e => { if (e.target === lb) close(); };
    lb.querySelector('[data-lbc]').onclick = close;
    lb.querySelectorAll('[data-lbm]').forEach(x => x.onclick = () => { const list = W.lb[0] === 'g' ? D().site.gallery : D().properties.find(p => p.id === W.prop).images; W.lb[1] = (W.lb[1] + +x.dataset.lbm + list.length) % list.length; W.keepY = window.scrollY; render(); });
  }
}
function bindResults() {
  const c = document.querySelector('[data-clear]'); if (c) c.onclick = () => { W.search = null; $('#results').innerHTML = ''; };
  document.querySelectorAll('#results [data-prop]').forEach(x => x.onclick = e => { e.preventDefault(); openProp(x.dataset.prop); });
}
window.addEventListener('scroll', () => { const s = window.scrollY > 40; if (s !== !!W.scrolled) { W.scrolled = s; const h = document.querySelector('header.top'); if (h && W.view === 'home') h.classList.toggle('solid', s || W.menu); } }, { passive: true });
document.addEventListener('keydown', e => { if (!W.lb) return; if (e.key === 'Escape') { W.lb = null; W.keepY = window.scrollY; render(); } });
/* \u1ea3nh b\u00eca \u0111\u1ed5i m\u1ed7i 6 gi\u00e2y */
setInterval(() => { if (!W.data || W.view !== 'home' || W.lb) return; const bgs = document.querySelectorAll('.hero .bg'); if (bgs.length < 2) return; bgs[W.slide % bgs.length].classList.remove('on'); W.slide++; bgs[W.slide % bgs.length].classList.add('on'); }, 6000);
boot();
</script>
</body>
