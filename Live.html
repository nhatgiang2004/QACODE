<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pickleball Live">
  <title>Pickleball Live Stream</title>
  <style>
    *{box-sizing:border-box}
    :root{--navy:#0b1f33;--navy2:#102a43;--slate:#26384a;--line:#405469;--text:#f8fafc;--muted:#b8c6d5;--score:#e8f0f7;--scoreText:#102030;--green:#0f8a6b;--green2:#0a6e57;--accent:#36d399;--ball:#f4c542;--danger:#ef4444}
    html,body{margin:0;width:100%;min-height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#07131f;color:var(--text)}
    body{min-height:100vh;display:flex;align-items:flex-start;justify-content:flex-start;padding:24px}
    .stage{width:min(800px,100%)}
    .scoreboard{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:15px;overflow:hidden;background:var(--navy);box-shadow:0 22px 70px rgba(0,0,0,.38)}
    .main{display:grid;grid-template-columns:117px minmax(0,1fr) 95px 56px;grid-template-rows:1fr 1fr;min-height:143px}
    .brand{grid-row:1/3;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:11px;border-right:1px solid #d7e0e8}
    .brand img{width:100%;height:100%;max-width:89px;max-height:89px;object-fit:contain}
    .brand-fallback{width:81px;height:81px;border-radius:15px;background:linear-gradient(145deg,#0f8a6b,#0b5f78);display:grid;place-items:center;text-align:center;color:#fff;font-size:11px;font-weight:1000;line-height:1.05;box-shadow:0 8px 22px rgba(15,138,107,.25)}
    .team{display:flex;align-items:center;padding:0 17px;background:linear-gradient(90deg,#26384a,#213244);border-bottom:1px solid var(--line);font-size:clamp(17px,1.95vw,29px);font-weight:950;font-style:normal;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .team.b{border-bottom:0}
    .score{display:grid;place-items:center;background:var(--score);color:var(--scoreText);font-size:clamp(33px,3.75vw,54px);font-weight:1000;border-left:1px solid #d0dbe5;border-bottom:1px solid #c4d0db;font-variant-numeric:tabular-nums;transition:background .18s ease,transform .18s ease}
    .score.b{border-bottom:0}
    .score.flash{background:#b9f6dd;transform:scale(1.035)}
    .serve{display:grid;place-items:center;background:#173047;border-left:1px solid rgba(255,255,255,.12);border-bottom:1px solid var(--line)}
    .serve.b{border-bottom:0}
    .ball{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff2a8 0 12%,var(--ball) 13% 64%,#d49c16 65% 100%);border:2px solid #08131f;box-shadow:0 0 0 3px rgba(244,197,66,.14),0 5px 14px rgba(0,0,0,.34);position:relative;animation:pulse 1.15s ease-in-out infinite}
    .ball:after{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(97,63,2,.55);border-radius:50%}
    .serve.empty .ball{display:none}
    .livebar{display:flex;align-items:center;justify-content:center;min-height:41px;padding:6px 14px;background:linear-gradient(90deg,var(--green2),var(--green),var(--green2));border-top:1px solid rgba(255,255,255,.1)}
    .live-title{font-size:clamp(17px,1.9vw,29px);font-weight:1000;letter-spacing:.04em;color:#fff;text-align:center;text-transform:uppercase}
    .empty-state{padding:52px 15px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:#0c1d2c}.empty-state h1{margin:0 0 10px;font-size:27px}.empty-state p{margin:0;color:#9fb0c0}
    @keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 7px rgba(244,197,66,.10),0 7px 17px rgba(0,0,0,.38)}}
    @media(max-width:780px){body{padding:6px;align-items:flex-start;justify-content:flex-start}.scoreboard{border-radius:9px}.main{grid-template-columns:65px minmax(0,1fr) 50px 35px;min-height:95px}.brand{padding:5px}.brand img{max-width:54px;max-height:54px}.brand-fallback{width:48px;height:48px;border-radius:13px;font-size:7px}.team{padding:0 8px;font-size:clamp(10px,2.85vw,17px)}.score{font-size:clamp(23px,6vw,35px)}.ball{width:20px;height:20px;border-width:2px}.ball:after{inset:4px;border-width:1px}.livebar{padding:5px 7px;min-height:32px}.live-title{font-size:14px}}
  </style>
</head>

    function safeLogo(d){if(d?.logoMode==='none')return '';const u=String(d?.logoUrl||'').trim();if(d?.logoMode==='url'&&/^(https?:\/\/|data:image\/)/i.test(u))return u;return DEFAULT_LOGO}
    function render(d){
      if(!d||!d.active){app.innerHTML='<div class="empty-state"><h1>LIVE STREAM</h1><p>Đang chờ BTC chọn trận đấu.</p></div>';previous={scoreA:null,scoreB:null};return;}
      const logo=safeLogo(d);
      const aChanged=previous.scoreA!==null&&Number(d.scoreA)!==Number(previous.scoreA);
      const bChanged=previous.scoreB!==null&&Number(d.scoreB)!==Number(previous.scoreB);
      const brand=logo?`<img src="${esc(logo)}" alt="Logo" onerror="this.parentNode.innerHTML='<div class=&quot;brand-fallback&quot;>PICKLE<br>BALL</div>'">`:'<div class="brand-fallback">LIVE<br>SCORE</div>';
      const centerLabel=d.completed?'KẾT THÚC':String(d.displayLabel||'Trực tiếp').toUpperCase();
      app.innerHTML=`<section class="scoreboard"><div class="main"><div class="brand">${brand}</div><div class="team">${esc(d.teamA||'')}</div><div class="score ${aChanged?'flash':''}">${Number(d.scoreA||0)}</div><div class="serve ${d.servingSide==='A'?'':'empty'}"><div class="ball"></div></div><div class="team b">${esc(d.teamB||'')}</div><div class="score b ${bChanged?'flash':''}">${Number(d.scoreB||0)}</div><div class="serve b ${d.servingSide==='B'?'':'empty'}"><div class="ball"></div></div></div><div class="livebar"><div class="live-title">${esc(centerLabel)}</div></div></section>`;
      previous={scoreA:Number(d.scoreA||0),scoreB:Number(d.scoreB||0)};
      if(aChanged||bChanged)setTimeout(()=>document.querySelectorAll('.score.flash').forEach(x=>x.classList.remove('flash')),220);
    }
    function showConnectionError(msg){app.innerHTML=`<div class="empty-state"><h1>LIVE STREAM</h1><p>${esc(msg||'Không kết nối được dữ liệu Live.')}</p></div>`;}
    // ==========================================================
    // CẤU HÌNH GITHUB PAGES
    // Dán link Web App /exec của Google Apps Script vào dòng dưới.
    // Ví dụ: https://script.google.com/macros/s/AKfycb.../exec
    // Link này giữ nguyên nếu bạn cập nhật New version trên cùng Deployment.
    // ==========================================================
    const DEFAULT_LIVE_API_URL = 'DAN_LINK_WEB_APP_EXEC_VAO_DAY';
    const urlParams = new URLSearchParams(window.location.search);
    const LIVE_API_URL = String(urlParams.get('api') || DEFAULT_LIVE_API_URL || '').trim();
    const CALLBACK_NAME = '__PB_LIVE_CALLBACK__';

    let pollBusy=false;
    let pollTimer=null;
    let requestSeq=0;
    let activeScript=null;

    function schedulePoll(delay=550){
      clearTimeout(pollTimer);
      pollTimer=setTimeout(poll,delay);
    }

    function validApiUrl(url){
      return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/i.test(url);
    }

    function cleanupScript(){
      if(activeScript && activeScript.parentNode) activeScript.parentNode.removeChild(activeScript);
      activeScript=null;
    }

    window[CALLBACK_NAME]=function(data){
      pollBusy=false;
      cleanupScript();
      if(data && data.error){
        showConnectionError('Không tải được dữ liệu Live: '+data.error);
        schedulePoll(1200);
        return;
      }
      render(data);
      schedulePoll(550);
    };

    function poll(){
      if(pollBusy)return;
      if(!validApiUrl(LIVE_API_URL)){
        showConnectionError('Chưa cấu hình link Web App /exec trong Live.html.');
        return;
      }
      pollBusy=true;
      cleanupScript();
      const sep=LIVE_API_URL.includes('?')?'&':'?';
      const src=LIVE_API_URL+sep+'api=live&callback='+encodeURIComponent(CALLBACK_NAME)+'&_='+Date.now()+'_'+(++requestSeq);
      const script=document.createElement('script');
      activeScript=script;
      script.async=true;
      script.src=src;
      script.onerror=function(){
        pollBusy=false;
        cleanupScript();
        showConnectionError('Không kết nối được dữ liệu Live. Kiểm tra Web App đã Deploy và quyền truy cập.');
        schedulePoll(1500);
      };
      document.head.appendChild(script);
      setTimeout(function(){
        if(pollBusy && activeScript===script){
          pollBusy=false;
          cleanupScript();
          showConnectionError('Kết nối Live đang chậm, hệ thống sẽ thử lại.');
          schedulePoll(1200);
        }
      },5000);
    }
    poll();
  </script>
