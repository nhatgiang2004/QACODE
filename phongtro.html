<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Quản lý Phòng trọ</title>
  <meta name="theme-color" content="#0b4a87">

  <!-- iPhone / iPad: hiện icon khi "Thêm vào Màn hình chính" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quản lý Phòng trọ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon/phongtro-180.png?v=7">

  <!-- Android / trình duyệt -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icon/phongtro-192.png?v=7">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon/phongtro-512.png?v=7">
  <link rel="manifest" href="./manifest-phongtro.json?v=7">


  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #06172d; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f3f6f8; }
    #splash {
      position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #06172d 0%, #0b4a87 55%, #0877be 100%);
      color: #fff; font-family: Arial, Helvetica, sans-serif; text-align: center; padding: 24px;
      transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 35px rgba(0,0,0,.28); }
    #splash .t { margin-top: 18px; font-size: 20px; font-weight: 700; }
    #splash .s { margin-top: 6px; font-size: 14px; opacity: .85; }
    #splash .spin { width: 32px; height: 32px; margin-top: 22px; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    #splash a { display: none; margin-top: 22px; background: #fff; color: #0b4a87; text-decoration: none; font-weight: 700; padding: 13px 22px; border-radius: 12px; }
    #splash.slow a { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Màn hình chờ trong lúc trang đăng nhập đang tải (tự ẩn) -->
  <div id="splash">
    <img src="./icon/phongtro-180.png?v=7" alt="">
    <div class="t">Quản lý Phòng trọ</div>
    <div class="s" id="msg">Đang mở hệ thống…</div>
    <div class="spin"></div>
    <a id="direct" href="#">Mở trực tiếp</a>
  </div>
  <iframe id="app" title="Quản lý Phòng trọ" allow="clipboard-read; clipboard-write; camera; fullscreen"></iframe>

  <script>
    /*
    ==========================================================
    CHỈ THAY ĐOẠN NÀY KHI GOOGLE APPS SCRIPT ĐỔI LINK
    ==========================================================
    */
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbw8Gs9EanSCspkthnw3GkpM-kzWeXXmiy9axSpngiajVJkCQPyysZ33wuDfQUYzpAYzQw/exec";

    /* ===== KHÔNG CẦN SỬA PHẦN BÊN DƯỚI ===== */

    /* Lưu hộ “Ghi nhớ đăng nhập” cho app trong khung.
       Safari/iPhone (và Chrome khi chặn cookie bên thứ ba) không cho khung Google giữ dữ liệu,
       nên app gửi phiên đăng nhập ra trang này để lưu trong bộ nhớ của chính trang (tên miền github.io). */
    (function () {
      var P = "qlnt:";
      var KEY_OK = /^nt_[a-z_]{1,24}$/;
      function tuApp(w) {
        /* Chỉ nhận tin nhắn từ đúng khung app trên trang này (khung Google có thể lồng 1–2 lớp) */
        for (var i = 0; i < 5 && w; i++) {
          if (w === frame.contentWindow) return true;
          try { if (w === w.parent) break; w = w.parent; } catch (e) { return false; }
        }
        return false;
      }
      function docKho(kho, tienTo, out) {
        try {
          for (var i = 0; i < kho.length; i++) {
            var k = kho.key(i);
            if (k && k.indexOf(P) === 0) out[tienTo + k.slice(P.length)] = kho.getItem(k);
          }
        } catch (e) {}
      }
      window.addEventListener("message", function (e) {
        var d = e.data;
        if (!d || typeof d !== "object" || (d.nt !== "kho-get" && d.nt !== "kho-set")) return;
        if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
        if (!tuApp(e.source)) return;
        if (d.nt === "kho-get") {
          var data = {};
          docKho(localStorage, "", data);
          docKho(sessionStorage, "s:", data);
          e.source.postMessage({ nt: "kho", id: d.id, data: data }, e.origin);
          return;
        }
        if (!KEY_OK.test(d.k || "")) return;
        var kho = d.tam ? sessionStorage : localStorage;
        try {
          if (d.v == null) kho.removeItem(P + d.k);
          else if (String(d.v).length < 4000) kho.setItem(P + d.k, String(d.v));
        } catch (err) {}
      });
    })();

    const splash = document.getElementById("splash");
    const msg = document.getElementById("msg");
    const frame = document.getElementById("app");
    const direct = document.getElementById("direct");

    const ok = typeof APP_URL === "string" && APP_URL.startsWith("https://script.google.com/macros/s/") && APP_URL.includes("/exec");
    if (!ok) {
      msg.textContent = "Link hệ thống chưa đúng. Vui lòng kiểm tra APP_URL.";
      document.querySelector("#splash .spin").style.display = "none";
    } else {
      const url = APP_URL + (APP_URL.includes("?") ? "&" : "?") + "_v=" + Date.now();
      direct.href = url;
      /* Trang đăng nhập hiện ngay trong khung, địa chỉ vẫn là hotel.html nên icon trên màn hình chính giữ nguyên */
      frame.addEventListener("load", function () { setTimeout(function () { splash.classList.add("hide"); }, 400); });
      frame.src = url;
      /* Mạng chậm hoặc trình duyệt chặn khung: hiện nút mở trực tiếp */
      setTimeout(function () {
        if (!splash.classList.contains("hide")) { splash.classList.add("slow"); msg.textContent = "Mạng chậm? Bấm để mở trực tiếp."; }
      }, 12000);
    }
  </script>
</body>
</html>
